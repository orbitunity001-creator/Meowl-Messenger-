<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meowl Messenger</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(140, 60, 255, .18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 220, 255, .12), transparent 35%),
        #111218;
      color: #fff;
    }

    body.light {
      background:
        radial-gradient(circle at top left, rgba(140, 60, 255, .10), transparent 35%),
        #f4f4f7;
      color: #18181c;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      border-radius: 28px;
      background: rgba(30, 31, 40, .78);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        0 0 40px rgba(150,60,255,.08);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    body.light .auth-card,
    body.light .chat-card,
    body.light .profile-card,
    body.light .settings-card,
    body.light .empty-card,
    body.light .chat-window {
      background: rgba(255,255,255,.82);
      border-color: rgba(0,0,0,.08);
      color: #18181c;
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 12px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background:
        linear-gradient(135deg, rgba(175,70,255,.28), rgba(0,220,255,.16));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 0 35px rgba(160,70,255,.20);
    }

    .logo-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .logo-sub {
      margin-top: 6px;
      color: #999aa8;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 5px;
      margin-bottom: 18px;
      border-radius: 15px;
      background: rgba(255,255,255,.05);
    }

    .tab {
      flex: 1;
      border: 0;
      border-radius: 11px;
      padding: 12px;
      color: #aaa;
      background: transparent;
    }

    .tab.active {
      color: #fff;
      background: linear-gradient(
        135deg,
        rgba(159, 67, 255, .85),
        rgba(81, 124, 255, .75)
      );
      box-shadow: 0 5px 20px rgba(120,70,255,.22);
    }

    .field {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      margin: 0 0 7px 4px;
      font-size: 13px;
      color: #9b9ca9;
    }

    .input,
    .textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.10);
      outline: none;
      color: #fff;
      background: rgba(255,255,255,.055);
      border-radius: 15px;
      padding: 14px 15px;
      transition: .2s;
    }

    body.light .input,
    body.light .textarea {
      color: #18181c;
      background: rgba(0,0,0,.035);
      border-color: rgba(0,0,0,.08);
    }

    .input:focus,
    .textarea:focus {
      border-color: rgba(160,80,255,.75);
      box-shadow: 0 0 0 3px rgba(160,80,255,.10);
    }

    .main-button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(135deg, #a443ff, #5c7dff);
      box-shadow: 0 8px 25px rgba(120,70,255,.25);
      transition: transform .15s, opacity .15s;
    }

    .main-button:active {
      transform: scale(.98);
    }

    .main-button:disabled {
      opacity: .55;
    }

    .auth-error {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      background: rgba(255,70,100,.10);
      border: 1px solid rgba(255,70,100,.18);
      color: #ff9aaa;
    }

    /* =========================
       APP
    ========================= */

    #appScreen {
      min-height: 100vh;
      padding-bottom: 78px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: rgba(17,18,24,.76);
      border-bottom: 1px solid rgba(255,255,255,.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    body.light .topbar {
      background: rgba(244,244,247,.80);
      border-color: rgba(0,0,0,.06);
    }

    .top-title {
      font-size: 21px;
      font-weight: 800;
    }

    .top-email {
      max-width: 180px;
      margin-top: 3px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 11px;
      color: #888a98;
    }

    .logout-button {
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      padding: 9px 11px;
      color: #ff8e9e;
      background: rgba(255,255,255,.04);
    }

    .page {
      display: none;
      max-width: 700px;
      margin: 0 auto;
      padding: 18px;
    }

    .page.active {
      display: block;
    }

    .search {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,.08);
      outline: none;
      border-radius: 16px;
      color: #fff;
      background: rgba(255,255,255,.055);
    }

    body.light .search {
      color: #18181c;
      background: rgba(0,0,0,.035);
    }

    .section-title {
      margin: 18px 4px 10px;
      font-size: 13px;
      color: #8e8f9d;
      font-weight: 700;
    }

    .chat-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 10px;
      padding: 14px;
      text-align: left;
      color: #fff;
      background: rgba(30,31,40,.72);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .chat-card:active {
      transform: scale(.99);
    }

    .chat-avatar,
    .profile-avatar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(135deg, #a443ff, #4e8dff);
      box-shadow: 0 0 25px rgba(130,70,255,.20);
    }

    .chat-avatar {
      width: 52px;
      height: 52px;
      border-radius: 17px;
      font-size: 23px;
    }

    .chat-info {
      min-width: 0;
      flex: 1;
    }

    .chat-name {
      font-weight: 700;
      font-size: 15px;
    }

    .chat-preview {
      overflow: hidden;
      margin-top: 4px;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #8f91a0;
      font-size: 12px;
    }

    .chat-arrow {
      color: #777987;
      font-size: 20px;
    }

    .empty-card {
      padding: 28px 20px;
      text-align: center;
      border-radius: 20px;
      background: rgba(30,31,40,.72);
      border: 1px solid rgba(255,255,255,.07);
      color: #8f91a0;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-card,
    .settings-card {
      padding: 22px;
      border-radius: 24px;
      background: rgba(30,31,40,.72);
      border: 1px solid rgba(255,255,255,.07);
      box-shadow: 0 12px 35px rgba(0,0,0,.14);
    }

    .profile-avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 15px;
      border-radius: 30px;
      font-size: 39px;
    }

    .profile-name {
      text-align: center;
      font-size: 23px;
      font-weight: 800;
    }

    .profile-description {
      margin: 7px 0 22px;
      text-align: center;
      color: #9293a0;
      font-size: 13px;
    }

    .secondary-button {
      width: 100%;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: 13px;
      color: #fff;
      background: rgba(255,255,255,.05);
    }

    body.light .secondary-button {
      color: #18181c;
      border-color: rgba(0,0,0,.08);
      background: rgba(0,0,0,.035);
    }

    /* =========================
       SETTINGS
    ========================= */

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-name {
      font-weight: 700;
      font-size: 15px;
    }

    .setting-desc {
      margin-top: 4px;
      color: #8f91a0;
      font-size: 12px;
    }

    .switch {
      width: 49px;
      height: 28px;
      border: 0;
      padding: 3px;
      border-radius: 20px;
      background: #3a3b45;
    }

    .switch span {
      display: block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      transition: .2s;
    }

    .switch.active {
      background: linear-gradient(135deg, #a443ff, #5c7dff);
    }

    .switch.active span {
      transform: translateX(21px);
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      z-index: 30;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      background: rgba(17,18,24,.88);
      border-top: 1px solid rgba(255,255,255,.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    body.light .bottom-nav {
      background: rgba(244,244,247,.90);
      border-color: rgba(0,0,0,.06);
    }

    .nav-button {
      flex: 1;
      max-width: 150px;
      border: 0;
      border-radius: 15px;
      padding: 9px 7px;
      color: #777987;
      background: transparent;
      font-size: 11px;
    }

    .nav-icon {
      display: block;
      margin-bottom: 3px;
      font-size: 20px;
    }

    .nav-button.active {
      color: #fff;
      background: rgba(150,70,255,.16);
    }

    body.light .nav-button.active {
      color: #7a42e8;
    }

    /* =========================
       CHAT WINDOW
    ========================= */

    .chat-overlay {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      flex-direction: column;
      background:
        radial-gradient(circle at top left, rgba(140,60,255,.14), transparent 35%),
        #111218;
    }

    .chat-overlay.open {
      display: flex;
    }

    body.light .chat-overlay {
      background: #f4f4f7;
    }

    .chat-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 15px;
      background: rgba(17,18,24,.82);
      border-bottom: 1px solid rgba(255,255,255,.07);
      backdrop-filter: blur(18px);
    }

    body.light .chat-header {
      background: rgba(244,244,247,.88);
      border-color: rgba(0,0,0,.06);
    }

    .back-button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: rgba(255,255,255,.06);
      font-size: 24px;
    }

    body.light .back-button {
      color: #18181c;
      background: rgba(0,0,0,.04);
    }

    .chat-header-avatar {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #a443ff, #4e8dff);
    }

    .chat-header-info {
      min-width: 0;
      flex: 1;
    }

    .chat-header-name {
      font-weight: 800;
    }

    .chat-header-status {
      margin-top: 2px;
      color: #8d8e9d;
      font-size: 11px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 10px;
      scroll-behavior: smooth;
    }

    .message-line {
      display: flex;
      margin-bottom: 8px;
    }

    .message-line.mine {
      justify-content: flex-end;
    }

    .message {
      max-width: min(78%, 460px);
      padding: 10px 13px;
      border-radius: 17px;
      line-height: 1.35;
      font-size: 14px;
      word-break: break-word;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.06);
    }

    .message-line.mine .message {
      border-bottom-right-radius: 5px;
      background: linear-gradient(
        135deg,
        rgba(155,65,255,.92),
        rgba(86,120,255,.92)
      );
      border-color: transparent;
    }

    .message-line:not(.mine) .message {
      border-bottom-left-radius: 5px;
    }

    .message-time {
      margin-top: 4px;
      text-align: right;
      color: rgba(255,255,255,.52);
      font-size: 9px;
    }

    .message-input-area {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px;
      background: rgba(17,18,24,.88);
      border-top: 1px solid rgba(255,255,255,.07);
    }

    body.light .message-input-area {
      background: rgba(244,244,247,.92);
      border-color: rgba(0,0,0,.06);
    }

    #messageInput {
      flex: 1;
      min-height: 45px;
      max-height: 130px;
      resize: none;
      padding: 12px 14px;
      border-radius: 16px;
    }

    .send-button {
      width: 47px;
      height: 47px;
      flex: 0 0 47px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(135deg, #a443ff, #5c7dff);
      font-size: 20px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      padding: 18px;
      text-align: center;
      color: #8f91a0;
      font-size: 13px;
    }

    .online-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 5px;
      border-radius: 50%;
      background: #57e389;
      box-shadow: 0 0 8px #57e389;
    }

    @media (max-width: 500px) {
      .auth-card {
        padding: 25px 18px;
      }

      .page {
        padding: 14px;
      }

      .topbar {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================= -->

  <section id="authScreen">

    <div class="auth-card">

      <div class="logo">
        <div class="logo-icon">🐱</div>
        <div class="logo-title">Meowl Messenger</div>
        <div class="logo-sub">Общайся. Быстро. Просто. Реально.</div>
      </div>

      <div class="tabs">
        <button class="tab active" id="loginTab">Вход</button>
        <button class="tab" id="registerTab">Регистрация</button>
      </div>

      <form id="authForm">

        <div class="field">
          <label class="field-label">Email</label>
          <input
            class="input"
            id="emailInput"
            type="email"
            placeholder="example@mail.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label class="field-label">Пароль</label>
          <input
            class="input"
            id="passwordInput"
            type="password"
            placeholder="Минимум 6 символов"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="main-button" id="authButton" type="submit">
          Войти
        </button>

        <div class="auth-error hidden" id="authError"></div>

      </form>

    </div>

  </section>


  <!-- =========================
       MAIN APP
  ========================= -->

  <section id="appScreen" class="hidden">

    <header class="topbar">

      <div>
        <div class="top-title">Meowl Messenger</div>
        <div class="top-email" id="topEmail"></div>
      </div>

      <button class="logout-button" id="logoutButton">
        Выйти
      </button>

    </header>


    <!-- CHATS -->

    <main id="chatsPage" class="page active">

      <input
        class="search"
        id="userSearch"
        type="search"
        placeholder="🔎 Найти пользователя..."
        autocomplete="off"
      >

      <div id="searchResults"></div>

      <div class="section-title" id="recentTitle">
        МОИ ЧАТЫ
      </div>

      <div id="recentChats"></div>

    </main>


    <!-- PROFILE -->

    <main id="profilePage" class="page">

      <div class="profile-card">

        <div class="profile-avatar" id="profileAvatar">
          🐱
        </div>

        <div class="profile-name" id="profileName">
          Пользователь
        </div>

        <div class="profile-description" id="profileDescription">
          Meowl Messenger
        </div>

        <div class="field">
          <label class="field-label">Никнейм</label>
          <input class="input" id="nicknameInput" maxlength="30">
        </div>

        <div class="field">
          <label class="field-label">Описание</label>
          <textarea
            class="textarea"
            id="descriptionInput"
            rows="3"
            maxlength="150"
            placeholder="Расскажи немного о себе..."
          ></textarea>
        </div>

        <button class="main-button" id="saveProfileButton">
          Сохранить профиль
        </button>

        <br><br>

        <button class="secondary-button" id="profileLogoutButton">
          Выйти из аккаунта
        </button>

      </div>

    </main>


    <!-- SETTINGS -->

    <main id="settingsPage" class="page">

      <div class="settings-card">

        <div class="setting-row">
          <div>
            <div class="setting-name">Тёмная тема</div>
            <div class="setting-desc">
              Использовать тёмный интерфейс
            </div>
          </div>

          <button class="switch active" id="themeSwitch">
            <span></span>
          </button>
        </div>

        <div class="setting-row">
          <div>
            <div class="setting-name">О приложении</div>
            <div class="setting-desc">
              Meowl Messenger
            </div>
          </div>

          <div style="color:#888;font-size:12px;">
            v1.0
          </div>
        </div>

      </div>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

      <button class="nav-button active" data-page="chatsPage">
        <span class="nav-icon">💬</span>
        Чаты
      </button>

      <button class="nav-button" data-page="settingsPage">
        <span class="nav-icon">⚙️</span>
        Настройки
      </button>

      <button class="nav-button" data-page="profilePage">
        <span class="nav-icon">👤</span>
        Профиль
      </button>

    </nav>

  </section>


  <!-- =========================
       CHAT OVERLAY
  ========================= -->

  <section class="chat-overlay" id="chatOverlay">

    <header class="chat-header">

      <button class="back-button" id="closeChatButton">
        ←
      </button>

      <div class="chat-header-avatar" id="chatHeaderAvatar">
        🐱
      </div>

      <div class="chat-header-info">

        <div class="chat-header-name" id="chatHeaderName">
          Пользователь
        </div>

        <div class="chat-header-status">
          <span class="online-dot"></span>
          Meowl Messenger
        </div>

      </div>

    </header>


    <div class="messages" id="messages">

      <div class="loading">
        Загрузка сообщений...
      </div>

    </div>


    <div class="message-input-area">

      <textarea
        class="textarea"
        id="messageInput"
        placeholder="Написать сообщение..."
        rows="1"
        maxlength="2000"
      ></textarea>

      <button class="send-button" id="sendButton">
        ➤
      </button>

    </div>

  </section>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      set,
      get,
      push,
      onValue,
      serverTimestamp,
      query,
      orderByChild,
      startAt,
      endAt,
      limitToFirst
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /* ==========================================
       FIREBASE CONFIG
    ========================================== */

    const firebaseConfig = {

      apiKey: "AIzaSyDUu20AAahXFB57envRSAFIDq9A6YKIMg",

      authDomain:
        "meowl-messenger.firebaseapp.com",

      databaseURL:
        "https://meowl-messenger-default-rtdb.firebaseio.com",

      projectId:
        "meowl-messenger",

      storageBucket:
        "meowl-messenger.firebasestorage.app",

      messagingSenderId:
        "228165699456",

      appId:
        "1:228165699456:web:a33dfc849a553c01a36365",

      measurementId:
        "G-WBJM9L18VH"
    };


    /* ==========================================
       INITIALIZE
    ========================================== */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);


    /* ==========================================
       ELEMENTS
    ========================================== */

    const authScreen =
      document.getElementById("authScreen");

    const appScreen =
      document.getElementById("appScreen");

    const authForm =
      document.getElementById("authForm");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const authButton =
      document.getElementById("authButton");

    const authError =
      document.getElementById("authError");

    const loginTab =
      document.getElementById("loginTab");

    const registerTab =
      document.getElementById("registerTab");

    const topEmail =
      document.getElementById("topEmail");

    const logoutButton =
      document.getElementById("logoutButton");

    const userSearch =
      document.getElementById("userSearch");

    const searchResults =
      document.getElementById("searchResults");

    const recentChats =
      document.getElementById("recentChats");

    const chatOverlay =
      document.getElementById("chatOverlay");

    const closeChatButton =
      document.getElementById("closeChatButton");

    const chatHeaderName =
      document.getElementById("chatHeaderName");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const chatHeaderAvatar =
      document.getElementById("chatHeaderAvatar");

    const profileName =
      document.getElementById("profileName");

    const profileDescription =
      document.getElementById("profileDescription");

    const nicknameInput =
      document.getElementById("nicknameInput");

    const descriptionInput =
      document.getElementById("descriptionInput");

    const saveProfileButton =
      document.getElementById("saveProfileButton");

    const themeSwitch =
      document.getElementById("themeSwitch");


    /* ==========================================
       STATE
    ========================================== */

    let currentUser = null;

    let isRegisterMode = false;

    let currentChatId = null;

    let currentOtherUser = null;

    let unsubscribeMessages = null;

    let searchTimer = null;


    /* ==========================================
       HELPERS
    ========================================== */

    function showAuthError(message) {

      authError.textContent = message;

      authError.classList.remove("hidden");
    }


    function hideAuthError() {

      authError.textContent = "";

      authError.classList.add("hidden");
    }


    function getNicknameFromEmail(email) {

      if (!email) {
        return "Пользователь";
      }

      const part = email.split("@")[0];

      return part
        .replace(/[.#$[\]]/g, "")
        .slice(0, 30) || "Пользователь";
    }


    function chatIdFor(a, b) {

      return [a, b]
        .sort()
        .join("_");
    }


    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    function formatTime(timestamp) {

      if (!timestamp) {
        return "";
      }

      const date =
        new Date(timestamp);

      return date.toLocaleTimeString(
        "ru-RU",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }


    function recentStorageKey() {

      return "MEOWL_RECENT_" + currentUser.uid;
    }


    function getRecentContacts() {

      try {

        return JSON.parse(
          localStorage.getItem(
            recentStorageKey()
          ) || "[]"
        );

      } catch {

        return [];
      }
    }


    function saveRecentContact(user) {

      const contacts =
        getRecentContacts();

      const filtered =
        contacts.filter(
          item => item.uid !== user.uid
        );

      filtered.unshift({
        uid: user.uid,
        nickname: user.nickname || "Пользователь"
      });

      localStorage.setItem(
        recentStorageKey(),
        JSON.stringify(
          filtered.slice(0, 30)
        )
      );
    }


    /* ==========================================
       FIREBASE USER PROFILE
    ========================================== */

    async function ensureUserProfile(user) {

      const userRef =
        ref(db, `users/${user.uid}`);

      const snapshot =
        await get(userRef);

      if (!snapshot.exists()) {

        const nickname =
          getNicknameFromEmail(user.email);

        await set(userRef, {

          nickname: nickname,

          nicknameLower:
            nickname.toLowerCase(),

          description:
            "",

          createdAt:
            serverTimestamp()

        });

      }
    }


    async function loadMyProfile() {

      if (!currentUser) {
        return;
      }

      try {

        const snapshot =
          await get(
            ref(
              db,
              `users/${currentUser.uid}`
            )
          );

        const data =
          snapshot.val() || {};

        const nickname =
          data.nickname ||
          getNicknameFromEmail(
            currentUser.email
          );

        const description =
          data.description || "";

        profileName.textContent =
          nickname;

        profileDescription.textContent =
          description ||
          "Meowl Messenger";

        nicknameInput.value =
          nickname;

        descriptionInput.value =
          description;

      } catch (error) {

        console.error(
          "Ошибка профиля:",
          error
        );

      }
    }


    /* ==========================================
       AUTH MODE
    ========================================== */

    loginTab.addEventListener(
      "click",
      () => {

        isRegisterMode = false;

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

        authButton.textContent =
          "Войти";

        passwordInput.autocomplete =
          "current-password";

        hideAuthError();
      }
    );


    registerTab.addEventListener(
      "click",
      () => {

        isRegisterMode = true;

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

        authButton.textContent =
          "Создать аккаунт";

        passwordInput.autocomplete =
          "new-password";

        hideAuthError();
      }
    );


    /* ==========================================
       AUTH
    ========================================== */

    authForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideAuthError();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {

          showAuthError(
            "Заполни email и пароль."
          );

          return;
        }

        if (
          isRegisterMode &&
          password.length < 6
        ) {

          showAuthError(
            "Пароль должен быть минимум 6 символов."
          );

          return;
        }

        authButton.disabled = true;

        authButton.textContent =
          "Подождите...";

        try {

          if (isRegisterMode) {

            const result =
              await createUserWithEmailAndPassword(
                auth,
                email,
                password
              );

            await ensureUserProfile(
              result.user
            );

          } else {

            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );
          }

        } catch (error) {

          console.error(error);

          showAuthError(
            firebaseErrorMessage(error)
          );

        } finally {

          authButton.disabled = false;

          authButton.textContent =
            isRegisterMode
              ? "Создать аккаунт"
              : "Войти";
        }
      }
    );


    function firebaseErrorMessage(error) {

      switch (error.code) {

        case "auth/invalid-credential":
          return "Неверный email или пароль.";

        case "auth/user-not-found":
          return "Неверный email или пароль.";

        case "auth/wrong-password":
          return "Неверный email или пароль.";

        case "auth/email-already-in-use":
          return "Такой аккаунт уже существует.";

        case "auth/invalid-email":
          return "Неверный email.";

        case "auth/weak-password":
          return "Пароль должен быть минимум 6 символов.";

        case "auth/operation-not-allowed":
          return "Email/Password не включён в Firebase Authentication.";

        case "auth/api-key-not-valid":
          return "Firebase API key недействителен. Проверь API key в Firebase/Google Cloud.";

        case "auth/network-request-failed":
          return "Ошибка сети. Проверь интернет-соединение.";

        case "auth/too-many-requests":
          return "Слишком много попыток. Попробуй немного позже.";

        default:
          return error.message ||
            "Произошла ошибка.";
      }
    }


    /* ==========================================
       AUTH STATE
    ========================================== */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (user) {

          currentUser = user;

          authScreen.classList.add(
            "hidden"
          );

          appScreen.classList.remove(
            "hidden"
          );

          topEmail.textContent =
            user.email || "";

          try {

            await ensureUserProfile(user);

            await loadMyProfile();

            await renderRecentChats();

          } catch (error) {

            console.error(error);
          }

        } else {

          currentUser = null;

          appScreen.classList.add(
            "hidden"
          );

          authScreen.classList.remove(
            "hidden"
          );

          closeChat();

        }
      }
    );


    /* ==========================================
       LOGOUT
    ========================================== */

    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);
      }
    );


    document
      .getElementById("profileLogoutButton")
      .addEventListener(
        "click",
        async () => {

          await signOut(auth);
        }
      );


    /* ==========================================
       SEARCH USERS
    ========================================== */

    userSearch.addEventListener(
      "input",
      () => {

        clearTimeout(searchTimer);

        const value =
          userSearch.value.trim();

        if (!value) {

          searchResults.innerHTML = "";

          return;
        }

        searchTimer =
          setTimeout(
            () => searchUsers(value),
            350
          );
      }
    );


    async function searchUsers(text) {

      if (!currentUser) {
        return;
      }

      const search =
        text.toLowerCase();

      searchResults.innerHTML =
        `<div class="loading">Поиск...</div>`;

      try {

        const usersRef =
          ref(db, "users");

        const usersQuery =
          query(
            usersRef,
            orderByChild("nicknameLower"),
            startAt(search),
            endAt(search + "\uf8ff"),
            limitToFirst(20)
          );

        const snapshot =
          await get(usersQuery);

        const results = [];

        snapshot.forEach(
          child => {

            if (
              child.key ===
              currentUser.uid
            ) {
              return;
            }

            results.push({
              uid: child.key,
              ...child.val()
            });
          }
        );

        renderSearchResults(results);

      } catch (error) {

        console.error(error);

        searchResults.innerHTML =
          `<div class="loading">
            Ошибка поиска
          </div>`;
      }
    }


    function renderSearchResults(users) {

      if (!users.length) {

        searchResults.innerHTML =
          `<div class="empty-card">
            Пользователь не найден
          </div>`;

        return;
      }

      searchResults.innerHTML =
        `<div class="section-title">
          ПОЛЬЗОВАТЕЛИ
        </div>`;

      users.forEach(user => {

        const card =
          document.createElement("button");

        card.className =
          "chat-card";

        card.innerHTML = `

          <div class="chat-avatar">
            🐱
          </div>

          <div class="chat-info">

            <div class="chat-name">
              ${escapeHtml(
                user.nickname ||
                "Пользователь"
              )}
            </div>

            <div class="chat-preview">
              ${escapeHtml(
                user.description ||
                "Открыть чат"
              )}
            </div>

          </div>

          <div class="chat-arrow">
            ›
          </div>
        `;

        card.addEventListener(
          "click",
          () => {

            openChat(user);

            userSearch.value = "";

            searchResults.innerHTML = "";
          }
        );

        searchResults.appendChild(card);
      });
    }


    /* ==========================================
       CREATE / OPEN CHAT
    ========================================== */

    async function openChat(user) {

      if (!currentUser) {
        return;
      }

      currentOtherUser = user;

      currentChatId =
        chatIdFor(
          currentUser.uid,
          user.uid
        );

      chatHeaderName.textContent =
        user.nickname ||
        "Пользователь";

      chatHeaderAvatar.textContent =
        "🐱";

      chatOverlay.classList.add(
        "open"
      );

      messages.innerHTML =
        `<div class="loading">
          Загрузка сообщений...
        </div>`;

      saveRecentContact(user);

      await createChatIfNeeded(user);

      subscribeToMessages();

      setTimeout(
        () => messageInput.focus(),
        150
      );
    }


    async function createChatIfNeeded(user) {

      const chatRef =
        ref(
          db,
          `chats/${currentChatId}`
        );

      const snapshot =
        await get(chatRef);

      if (!snapshot.exists()) {

        await set(
          chatRef,
          {
            participants: {
              [currentUser.uid]: true,
              [user.uid]: true
            },

            createdAt:
              serverTimestamp()
          }
        );
      }
    }


    /* ==========================================
       REALTIME MESSAGES
    ========================================== */

    function subscribeToMessages() {

      if (unsubscribeMessages) {

        unsubscribeMessages();

        unsubscribeMessages = null;
      }

      if (!currentChatId) {
        return;
      }

      const messagesRef =
        ref(
          db,
          `chats/${currentChatId}/messages`
        );

      unsubscribeMessages =
        onValue(
          messagesRef,
          snapshot => {

            const data =
              snapshot.val() || {};

            const list =
              Object.entries(data)
                .map(
                  ([id, message]) => ({
                    id,
                    ...message
                  })
                )
                .sort(
                  (a, b) =>
                    (a.createdAt || 0) -
                    (b.createdAt || 0)
                );

            renderMessages(list);
          },
          error => {

            console.error(
              "Ошибка сообщений:",
              error
            );

            messages.innerHTML =
              `<div class="loading">
                Не удалось загрузить сообщения
              </div>`;
          }
        );
    }


    function renderMessages(list) {

      if (!list.length) {

        messages.innerHTML =
          `<div class="empty-card">
            Пока нет сообщений.<br>
            Напиши первым 👋
          </div>`;

        return;
      }

      messages.innerHTML = "";

      list.forEach(message => {

        const mine =
          message.senderId ===
          currentUser.uid;

        const line =
          document.createElement("div");

        line.className =
          "message-line" +
          (mine ? " mine" : "");

        const bubble =
          document.createElement("div");

        bubble.className =
          "message";

        bubble.innerHTML = `

          <div>
            ${escapeHtml(
              message.text || ""
            ).replace(/\n/g, "<br>")}
          </div>

          <div class="message-time">
            ${formatTime(
              message.createdAt
            )}
          </div>
        `;

        line.appendChild(bubble);

        messages.appendChild(line);
      });

      requestAnimationFrame(
        () => {
          messages.scrollTop =
            messages.scrollHeight;
        }
      );
    }


    /* ==========================================
       SEND MESSAGE
    ========================================== */

    async function sendMessage() {

      if (!currentUser) {
        return;
      }

      if (!currentChatId) {
        return;
      }

      const text =
        messageInput.value.trim();

      if (!text) {
        return;
      }

      if (text.length > 2000) {

        alert(
          "Сообщение слишком длинное."
        );

        return;
      }

      sendButton.disabled = true;

      try {

        const messageRef =
          push(
            ref(
              db,
              `chats/${currentChatId}/messages`
            )
          );

        await set(
          messageRef,
          {
            senderId:
              currentUser.uid,

            text:
              text,

            createdAt:
              serverTimestamp()
          }
        );

        messageInput.value = "";

        autoResizeTextarea();

      } catch (error) {

        console.error(error);

        alert(
          "Не удалось отправить сообщение."
        );

      } finally {

        sendButton.disabled = false;

        messageInput.focus();
      }
    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }
      }
    );


    messageInput.addEventListener(
      "input",
      autoResizeTextarea
    );


    function autoResizeTextarea() {

      messageInput.style.height =
        "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          130
        ) + "px";
    }


    /* ==========================================
       CLOSE CHAT
    ========================================== */

    closeChatButton.addEventListener(
      "click",
      closeChat
    );


    function closeChat() {

      if (unsubscribeMessages) {

        unsubscribeMessages();

        unsubscribeMessages = null;
      }

      currentChatId = null;

      currentOtherUser = null;

      chatOverlay.classList.remove(
        "open"
      );

      messageInput.value = "";

      messages.innerHTML = "";
    }


    /* ==========================================
       RECENT CHATS
    ========================================== */

    async function renderRecentChats() {

      if (!currentUser) {
        return;
      }

      const contacts =
        getRecentContacts();

      if (!contacts.length) {

        recentChats.innerHTML =
          `<div class="empty-card">
            Найди пользователя через поиск,<br>
            чтобы начать новый чат 💬
          </div>`;

        return;
      }

      recentChats.innerHTML =
        `<div class="loading">
          Загрузка чатов...
        </div>`;

      const validContacts = [];

      for (
        const contact of contacts
      ) {

        try {

          const snapshot =
            await get(
              ref(
                db,
                `users/${contact.uid}`
              )
            );

          if (snapshot.exists()) {

            validContacts.push({
              uid: contact.uid,
              ...snapshot.val()
            });
          }

        } catch (error) {

          console.error(error);
        }
      }

      if (!validContacts.length) {

        recentChats.innerHTML =
          `<div class="empty-card">
            Пока нет чатов
          </div>`;

        return;
      }

      recentChats.innerHTML = "";

      validContacts.forEach(user => {

        const card =
          document.createElement("button");

        card.className =
          "chat-card";

        card.innerHTML = `

          <div class="chat-avatar">
            🐱
          </div>

          <div class="chat-info">

            <div class="chat-name">
              ${escapeHtml(
                user.nickname ||
                "Пользователь"
              )}
            </div>

            <div class="chat-preview">
              Открыть переписку
            </div>

          </div>

          <div class="chat-arrow">
            ›
          </div>
        `;

        card.addEventListener(
          "click",
          () => openChat(user)
        );

        recentChats.appendChild(card);
      });
    }


    /* ==========================================
       NAVIGATION
    ========================================== */

    document
      .querySelectorAll(".nav-button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const pageId =
              button.dataset.page;

            document
              .querySelectorAll(".page")
              .forEach(page => {

                page.classList.remove(
                  "active"
                );
              });

            document
              .getElementById(pageId)
              .classList.add("active");

            document
              .querySelectorAll(".nav-button")
              .forEach(btn => {

                btn.classList.remove(
                  "active"
                );
              });

            button.classList.add(
              "active"
            );

            if (
              pageId === "profilePage"
            ) {

              loadMyProfile();
            }

            if (
              pageId === "chatsPage"
            ) {

              renderRecentChats();
            }
          }
        );
      });


    /* ==========================================
       SAVE PROFILE
    ========================================== */

    saveProfileButton.addEventListener(
      "click",
      async () => {

        if (!currentUser) {
          return;
        }

        let nickname =
          nicknameInput.value.trim();

        const description =
          descriptionInput.value.trim();

        if (!nickname) {

          nickname =
            getNicknameFromEmail(
              currentUser.email
            );
        }

        nickname =
          nickname.slice(0, 30);

        saveProfileButton.disabled =
          true;

        saveProfileButton.textContent =
          "Сохранение...";

        try {

          await set(
            ref(
              db,
              `users/${currentUser.uid}`
            ),
            {
              nickname:
                nickname,

              nicknameLower:
                nickname.toLowerCase(),

              description:
                description,

              createdAt:
                serverTimestamp()
            }
          );

          profileName.textContent =
            nickname;

          profileDescription.textContent =
            description ||
            "Meowl Messenger";

          alert(
            "Профиль сохранён!"
          );

        } catch (error) {

          console.error(error);

          alert(
            "Не удалось сохранить профиль."
          );

        } finally {

          saveProfileButton.disabled =
            false;

          saveProfileButton.textContent =
            "Сохранить профиль";
        }
      }
    );


    /* ==========================================
       THEME
    ========================================== */

    const savedTheme =
      localStorage.getItem(
        "MEOWL_THEME"
      );

    if (savedTheme === "light") {

      document.body.classList.add(
        "light"
      );

      themeSwitch.classList.remove(
        "active"
      );

    } else {

      themeSwitch.classList.add(
        "active"
      );
    }


    themeSwitch.addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "light"
        );

        const light =
          document.body.classList.contains(
            "light"
          );

        themeSwitch.classList.toggle(
          "active",
          !light
        );

        localStorage.setItem(
          "MEOWL_THEME",
          light
            ? "light"
            : "dark"
        );
      }
    );


    /* ==========================================
       ESCAPE KEY
    ========================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          chatOverlay.classList.contains(
            "open"
          )
        ) {

          closeChat();
        }
      }
    );

  </script>

</body>
</html>
