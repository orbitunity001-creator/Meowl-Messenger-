<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meowl Messenger</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #070914;
  --card: rgba(20, 23, 45, .74);
  --card2: rgba(30, 34, 65, .70);
  --border: rgba(255,255,255,.10);
  --text: #fff;
  --muted: #9da4c5;
  --purple: #8b5cf6;
  --cyan: #22d3ee;
  --pink: #ec4899;
  --green: #34d399;
  --red: #fb7185;
}

html,
body {
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(139,92,246,.25),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(34,211,238,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 90%,
      rgba(236,72,153,.14),
      transparent 35%
    ),
    var(--bg);
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* =========================================
   APP
========================================= */

#app {
  min-height: 100vh;
  padding-bottom: 92px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 17px 18px;

  background: rgba(7,9,20,.66);
  backdrop-filter: blur(20px);

  border-bottom:
    1px solid rgba(255,255,255,.06);
}

.topbar-title {
  font-size: 21px;
  font-weight: 900;
}

.topbar-sub {
  color: var(--muted);
  font-size: 12px;
  margin-top: 3px;
}

.mini-avatar {
  width: 42px;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );

  font-size: 21px;
}

.content {
  width: min(760px, 100%);
  margin: 0 auto;
  padding: 20px 16px;
}


/* =========================================
   HERO
========================================= */

.hero {
  position: relative;
  overflow: hidden;

  padding: 28px;

  border-radius: 28px;

  border:
    1px solid var(--border);

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.20),
      rgba(34,211,238,.08)
    ),
    var(--card);

  box-shadow:
    0 20px 60px rgba(0,0,0,.25);
}

.hero-cat {
  font-size: 48px;
  margin-bottom: 8px;
}

.hero h1 {
  font-size: 30px;
  margin-bottom: 8px;
}

.hero p {
  color: var(--muted);
  line-height: 1.6;
}


/* =========================================
   HOME CARDS
========================================= */

.home-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 13px;

  margin-top: 16px;
}

.home-card {
  position: relative;
  overflow: hidden;

  min-height: 150px;

  padding: 20px;

  text-align: left;

  color: white;

  border-radius: 22px;

  border:
    1px solid var(--border);

  background: var(--card);

  transition: .2s;
}

.home-card:hover {
  transform: translateY(-2px);

  border-color:
    rgba(139,92,246,.45);
}

.home-card .icon {
  font-size: 30px;
  margin-bottom: 12px;
}

.home-card h3 {
  font-size: 17px;
  margin-bottom: 6px;
}

.home-card p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.bot-card {
  grid-column: 1 / -1;

  min-height: 165px;

  background:
    radial-gradient(
      circle at 90% 20%,
      rgba(34,211,238,.16),
      transparent 30%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(139,92,246,.16),
      transparent 35%
    ),
    var(--card);
}

.online {
  position: absolute;

  top: 16px;
  right: 16px;

  padding: 5px 9px;

  border-radius: 999px;

  color: #6ee7b7;

  background:
    rgba(52,211,153,.10);

  border:
    1px solid rgba(52,211,153,.25);

  font-size: 10px;
}


/* =========================================
   CHAT LIST
========================================= */

.chat-list {
  display: grid;
  gap: 11px;
}

.chat-item {
  width: 100%;

  display: flex;
  align-items: center;

  gap: 13px;

  padding: 14px;

  text-align: left;

  color: white;

  border:
    1px solid var(--border);

  border-radius: 21px;

  background:
    var(--card);

  transition: .2s;
}

.chat-item:hover {
  transform: translateY(-2px);

  border-color:
    rgba(139,92,246,.45);
}

.chat-item-avatar {
  width: 50px;
  height: 50px;

  flex: 0 0 50px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 17px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );

  font-size: 23px;
}

.chat-item-info {
  flex: 1;
  min-width: 0;
}

.chat-item-name {
  font-weight: 900;
  font-size: 16px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-item-username {
  color: #a78bfa;
  font-size: 12px;
  margin-top: 3px;
}

.chat-item-desc {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-arrow {
  color: var(--muted);
  font-size: 23px;
}


/* =========================================
   PAGES
========================================= */

.page-title {
  font-size: 27px;
  font-weight: 900;
  margin-bottom: 7px;
}

.page-subtitle {
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 18px;
}

.placeholder {
  padding: 25px;

  border-radius: 24px;

  border:
    1px solid var(--border);

  background:
    var(--card);
}

.placeholder .big {
  font-size: 45px;
  margin-bottom: 12px;
}


/* =========================================
   PROFILE
========================================= */

.profile-card {
  text-align: center;

  padding: 28px;

  border-radius: 27px;

  border:
    1px solid var(--border);

  background:
    var(--card);
}

.profile-avatar {
  width: 90px;
  height: 90px;

  margin:
    0 auto 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 28px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );

  font-size: 42px;
}

.profile-name {
  font-size: 25px;
  font-weight: 900;
}

.profile-username {
  margin-top: 5px;
  color: #a78bfa;
}

.profile-description {
  margin-top: 14px;

  color: var(--muted);

  line-height: 1.6;
}


/* =========================================
   CREATE BOT
========================================= */

.form-card {
  padding: 22px;

  border-radius: 25px;

  border:
    1px solid var(--border);

  background:
    var(--card);
}

.form-title {
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 7px;
}

.form-text {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
  margin-bottom: 18px;
}

.field-label {
  display: block;

  color: var(--muted);

  font-size: 13px;

  margin-bottom: 7px;
}

.form-input {
  width: 100%;

  padding: 13px 15px;

  border-radius: 15px;

  border:
    1px solid var(--border);

  outline: none;

  color: white;

  background:
    rgba(255,255,255,.045);

  margin-bottom: 14px;
}

.form-input:focus {
  border-color:
    rgba(139,92,246,.75);

  box-shadow:
    0 0 20px
    rgba(139,92,246,.12);
}

.primary-btn {
  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 16px;

  color: white;

  font-weight: 900;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      #6366f1
    );

  box-shadow:
    0 10px 30px
    rgba(99,102,241,.22);
}

.secondary-btn {
  width: 100%;

  padding: 13px;

  border-radius: 15px;

  border:
    1px solid var(--border);

  color: white;

  background:
    rgba(255,255,255,.05);
}

.success-box {
  padding: 20px;

  border-radius: 22px;

  border:
    1px solid
    rgba(52,211,153,.22);

  background:
    rgba(52,211,153,.07);
}

.success-title {
  font-size: 20px;
  font-weight: 900;
  margin-bottom: 9px;
}

.bot-link {
  display: block;

  margin:
    13px 0;

  padding: 12px;

  border-radius: 13px;

  color: #67e8f9;

  background:
    rgba(34,211,238,.07);

  border:
    1px solid
    rgba(34,211,238,.18);

  word-break: break-all;

  text-decoration: none;
}

.copy-btn {
  width: 100%;

  padding: 12px;

  border-radius: 14px;

  border:
    1px solid var(--border);

  color: white;

  background:
    rgba(255,255,255,.06);
}


/* =========================================
   CHAT
========================================= */

.chat-shell {
  height: calc(100vh - 165px);

  min-height: 450px;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 26px;

  border:
    1px solid var(--border);

  background:
    rgba(13,16,32,.70);

  backdrop-filter:
    blur(20px);
}

.chat-header {
  display: flex;
  align-items: center;

  gap: 12px;

  padding: 15px;

  border-bottom:
    1px solid var(--border);
}

.back-btn {
  width: 40px;
  height: 40px;

  border-radius: 13px;

  border:
    1px solid var(--border);

  background:
    rgba(255,255,255,.05);

  color: white;
}

.chat-avatar {
  width: 42px;
  height: 42px;

  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );

  font-size: 20px;
}

.chat-name {
  font-weight: 900;
}

.chat-status {
  margin-top: 2px;

  color: #6ee7b7;

  font-size: 12px;
}

.messages {
  flex: 1;

  overflow-y: auto;

  padding: 18px 14px;

  display: flex;
  flex-direction: column;

  gap: 9px;
}

.message-row {
  display: flex;
}

.message-row.me {
  justify-content: flex-end;
}

.message {
  max-width: 85%;

  padding: 12px 14px;

  border-radius: 18px;

  font-size: 14px;

  line-height: 1.55;

  white-space: pre-wrap;

  word-break: break-word;
}

.message.bot {
  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.08);

  border-bottom-left-radius: 5px;
}

.message.me {
  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #4f46e5
    );

  border-bottom-right-radius: 5px;
}

.time {
  display: block;

  margin-top: 5px;

  text-align: right;

  opacity: .5;

  font-size: 9px;
}

.chat-input-area {
  display: flex;

  gap: 8px;

  padding: 12px;

  border-top:
    1px solid var(--border);
}

.chat-input {
  flex: 1;

  min-width: 0;

  padding: 13px 15px;

  border-radius: 15px;

  border:
    1px solid var(--border);

  outline: none;

  color: white;

  background:
    rgba(255,255,255,.045);
}

.send-btn {
  width: 48px;

  border: none;

  border-radius: 15px;

  color: white;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--cyan)
    );

  font-size: 20px;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav {
  position: fixed;

  left: 50%;
  bottom: 12px;

  transform:
    translateX(-50%);

  z-index: 50;

  width:
    min(700px,calc(100% - 20px));

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 5px;

  padding: 7px;

  border-radius: 23px;

  background:
    rgba(14,17,34,.84);

  border:
    1px solid
    rgba(255,255,255,.09);

  backdrop-filter:
    blur(25px);

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.35);
}

.nav-btn {
  border: none;

  border-radius: 17px;

  padding: 9px 4px;

  color: var(--muted);

  background: transparent;

  font-size: 11px;
}

.nav-icon {
  display: block;

  font-size: 21px;

  margin-bottom: 3px;
}

.nav-btn.active {
  color: white;

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.30),
      rgba(34,211,238,.10)
    );
}


/* =========================================
   TOAST
========================================= */

#toast {
  position: fixed;

  left: 50%;
  bottom: 95px;

  transform:
    translateX(-50%)
    translateY(20px);

  z-index: 100;

  max-width:
    calc(100% - 30px);

  padding: 12px 17px;

  border-radius: 15px;

  background:
    rgba(20,23,45,.95);

  border:
    1px solid var(--border);

  color: white;

  opacity: 0;

  pointer-events: none;

  transition: .25s;

  text-align: center;

  font-size: 13px;

  backdrop-filter:
    blur(15px);
}

#toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:520px) {

  .home-grid {
    grid-template-columns: 1fr;
  }

  .bot-card {
    grid-column: auto;
  }

  .hero {
    padding: 23px;
  }

  .hero h1 {
    font-size: 27px;
  }

  .chat-shell {
    height: calc(100vh - 160px);
  }
}
</style>
</head>


<body>


<div id="app">


  <!-- TOP -->

  <header class="topbar">

    <div>

      <div
        id="topTitle"
        class="topbar-title"
      >
        Главная
      </div>

      <div class="topbar-sub">
        Meowl Messenger
      </div>

    </div>

    <div class="mini-avatar">
      🐱
    </div>

  </header>


  <!-- CONTENT -->

  <main
    id="content"
    class="content"
  ></main>


  <!-- NAV -->

  <nav class="bottom-nav">

    <button
      class="nav-btn active"
      data-page="home"
    >
      <span class="nav-icon">🏠</span>
      Главная
    </button>

    <button
      class="nav-btn"
      data-page="chats"
    >
      <span class="nav-icon">💬</span>
      Чаты
    </button>

    <button
      class="nav-btn"
      data-page="people"
    >
      <span class="nav-icon">👥</span>
      Люди
    </button>

    <button
      class="nav-btn"
      data-page="profile"
    >
      <span class="nav-icon">👤</span>
      Профиль
    </button>

  </nav>

</div>


<div id="toast"></div>


<script>

/* =====================================================
   LOCAL STORAGE
===================================================== */

const BOTS_KEY =
  "meowl_created_bots_v2";

const CHAT_KEY =
  "meowl_bot_chats_v2";


let bots =
  JSON.parse(
    localStorage.getItem(BOTS_KEY) || "[]"
  );


let botChats =
  JSON.parse(
    localStorage.getItem(CHAT_KEY) || "{}"
  );


/* =====================================================
   MAIN ELEMENTS
===================================================== */

const content =
  document.getElementById("content");

const topTitle =
  document.getElementById("topTitle");


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(text) {

  const toast =
    document.getElementById("toast");

  clearTimeout(toastTimer);

  toast.textContent = text;

  toast.classList.add("show");

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    }, 2800);
}


/* =====================================================
   RULES
===================================================== */

const START_RULES = `🐾 ПРАВИЛА MEOWL MESSENGER

Добро пожаловать в Meowl Messenger!

Meowl Messenger создан как уютное место для общения, знакомств и обмена сообщениями.

Пожалуйста, внимательно ознакомься с правилами перед использованием мессенджера.

━━━━━━━━━━━━━━━━━━

1. 🐱 УВАЖЕНИЕ К ДРУГИМ

Каждый пользователь Meowl Messenger имеет право на нормальное и уважительное общение.

Запрещено:

• оскорблять других пользователей;
• унижать людей;
• преследовать пользователей;
• намеренно провоцировать конфликты;
• распространять ненависть;
• угрожать другим пользователям;
• постоянно отправлять нежелательные сообщения.

Если тебе не нравится человек — просто прекрати общение с ним.

━━━━━━━━━━━━━━━━━━

2. 💬 СПАМ

Не используй Meowl Messenger для массовой рассылки одинаковых сообщений.

Запрещается:

• массово отправлять рекламу;
• отправлять большое количество одинаковых сообщений;
• создавать множество аккаунтов ради рассылки;
• использовать автоматические скрипты для спама;
• намеренно перегружать приложение.

━━━━━━━━━━━━━━━━━━

3. 🚫 ЗАПРЕЩЁННЫЙ КОНТЕНТ

Нельзя использовать мессенджер для распространения незаконного или опасного контента.

Запрещается распространять:

• мошеннические схемы;
• фишинговые ссылки;
• вредоносные программы;
• украденные данные;
• угрозы;
• инструкции по причинению вреда людям;
• материалы, нарушающие закон.

━━━━━━━━━━━━━━━━━━

4. 🔐 ЛИЧНЫЕ ДАННЫЕ

Не публикуй чужие личные данные без разрешения.

К личным данным относятся:

• номера телефонов;
• домашние адреса;
• документы;
• пароли;
• данные банковских карт;
• приватные фотографии;
• данные аккаунтов;
• другая личная информация.

Никому не сообщай свой пароль.

━━━━━━━━━━━━━━━━━━

5. 🛡️ БЕЗОПАСНОСТЬ

Никому не передавай пароль от своего аккаунта.

Не вводи пароль на подозрительных сайтах.

Если кто-то представляется администрацией Meowl Messenger и просит пароль — не сообщай его.

━━━━━━━━━━━━━━━━━━

6. 👤 USERNAME

Username должен использоваться честно.

Запрещается выдавать себя за другого пользователя или администрацию Meowl Messenger.

━━━━━━━━━━━━━━━━━━

7. 🤝 ОБЩЕНИЕ

Уважай собеседников.

Если человек просит прекратить общение — уважай его просьбу.

Не нужно превращать обычное общение в постоянный конфликт.

━━━━━━━━━━━━━━━━━━

8. 📢 РЕКЛАМА

Не используй личные сообщения для массовой рекламы и навязчивого продвижения.

━━━━━━━━━━━━━━━━━━

9. 🤖 АВТОМАТИЗАЦИЯ

Не пытайся взломать или перегрузить Meowl Messenger.

Запрещены:

• подбор паролей;
• попытки получить доступ к чужому аккаунту;
• обход ограничений;
• эксплуатация ошибок;
• вредоносные боты;
• атаки на приложение.

Если ты обнаружил ошибку — сообщи администрации.

━━━━━━━━━━━━━━━━━━

10. 🐾 АДМИНИСТРАЦИЯ

За нарушение правил администрация может:

• предупредить пользователя;
• ограничить функции;
• заблокировать аккаунт;
• удалить нарушающий контент.

Серьёзные нарушения могут привести к блокировке.

━━━━━━━━━━━━━━━━━━

/* =====================================================
   SEND MESSAGE
===================================================== */

function sendBotMessage(bot) {

  const input =
    document.getElementById("chatInput");


  if (!input) return;


  const text =
    input.value.trim();


  if (!text) return;


  input.value = "";


  if (!botChats[bot.id]) {

    botChats[bot.id] = [];

  }


  botChats[bot.id].push({

    type: "me",

    text: text,

    time: Date.now()

  });


  saveChats();

  renderBotMessages(bot);


  /*
   * /start
   */

  if (
    text
      .trim()
      .toLowerCase() === "/start"
  ) {

    setTimeout(() => {

      botChats[bot.id].push({

        type: "bot",

        text: bot.id === "official"
          ? START_RULES
          : getCreatedBotStart(bot),

        time: Date.now()

      });


      saveChats();

      renderBotMessages(bot);

    }, 400);


    return;

  }


  /*
   * /newbot доступна только
   * официальному боту.
   */

  if (
    bot.id === "official" &&
    text
      .trim()
      .toLowerCase() === "/newbot"
  ) {

    setTimeout(() => {

      startNewBotCreation();

    }, 350);


    return;

  }


  /*
   * Остальные ответы.
   */

  setTimeout(() => {

    let reply;


    if (
      bot.id === "official"
    ) {

      reply =
        "🐱 Я официальный бот Meowl Messenger.\n\nДоступные команды:\n\n/start — правила Meowl Messenger\n/newbot — создать своего бота.";

    }

    else {

      reply =
        "🤖 Привет! Я бот @" +
        bot.username +
        ".\n\nПопробуй написать /start.";

    }


    botChats[bot.id].push({

      type: "bot",

      text: reply,

      time: Date.now()

    });


    saveChats();

    renderBotMessages(bot);

  }, 500);

}

/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderBotMessages(bot) {

  const box =
    document.getElementById("messages");


  if (!box) return;


  box.innerHTML = "";


  const chat =
    botChats[bot.id] || [];


  if (chat.length === 0) {

    addMessage(
      box,
      "bot",
      bot.id === "official"
        ? "🐾 Привет! Я официальный бот Meowl Messenger.\n\nНапиши /start, чтобы получить правила.\n\nИли /newbot, чтобы создать своего бота."
        : `🤖 Привет! Я ${bot.name}.\n\nНапиши /start.`
    );

  }


  chat.forEach(message => {

    addMessage(
      box,
      message.type,
      message.text,
      message.time
    );

  });


  box.scrollTop =
    box.scrollHeight;

}


/* =====================================================
   MESSAGE ELEMENT
===================================================== */

function addMessage(
  box,
  type,
  text,
  time
) {

  const row =
    document.createElement("div");


  row.className =
    "message-row " +
    (type === "me" ? "me" : "");


  const message =
    document.createElement("div");


  message.className =
    "message " +
    (type === "me" ? "me" : "bot");


  const textElement =
    document.createElement("div");


  textElement.textContent =
    text;


  message.appendChild(
    textElement
  );


  if (time) {

    const timeElement =
      document.createElement("span");


    timeElement.className =
      "time";


    timeElement.textContent =
      new Date(time)
        .toLocaleTimeString(
          "ru-RU",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


    message.appendChild(
      timeElement
    );

  }


  row.appendChild(message);

  box.appendChild(row);

}

function askBotUsername() {

    );

    return;

  }


  /*
   * Название должно содержать
   * английские буквы.
   */

  if (
    !/[A-Za-z]/.test(name)
  ) {

    showToast(
      "Название должно содержать английские буквы."
    );

    return;

  }


  if (
    !/^[A-Za-z0-9 _-]+$/.test(name)
  ) {

    showToast(
      "Используй английские буквы, цифры, пробел, _ или -."
    );

    return;

  content.innerHTML = `

/* =====================================================
   CREATE BOT
===================================================== */

function createBot(
  name,
  usernameValue
) {

  let username =
    usernameValue
      .trim()
      .replace(/^@/, "");


  if (!username) {

    showToast(
      "Напиши username."
    );

    return;

  }


  /*
   * Убираем пробелы.
   */

  username =
    username.replace(/\s/g, "");


  /*
   * Username:
   * английские буквы,
   * цифры,
   * _
   */

  if (
    !/^[A-Za-z0-9_]{4,30}$/.test(username)
  ) {

    showToast(
      "Username: 4–30 символов, только A-Z, a-z, 0-9 и _."
    );

    return;

  }


  /*
   * Проверяем уникальность.
   */

  const alreadyExists =
    getAllBots()
      .some(bot =>
        bot.username.toLowerCase() ===
        username.toLowerCase()
      );


  if (alreadyExists) {

    showToast(
      "Такой username уже существует."
    );

    return;

  }


  /*
   * Создаём ID.
   */

  const id =
    "bot_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);


  const bot = {

    id: id,

    name: name,

    username: username,

    description:
      "Пользовательский бот Meowl Messenger.",

    createdAt:
      Date.now()

  };


  bots.push(bot);


  localStorage.setItem(
    BOTS_KEY,
    JSON.stringify(bots)
  );


  /*
   * Пустой чат бота.
   */

  botChats[id] = [];

  saveChats();


  /*
   * Показываем ссылку.
   */

  showBotCreated(bot);

}

/* =====================================================
   BOT LINK
===================================================== */

function createBotLink(username) {

  /*
   * Ссылка ведёт на этот же GitHub Pages сайт.
   *
   * При открытии страницы параметр
   * ?bot=username можно использовать
   * для открытия нужного бота.
   */

  const url =
    window.location.origin +
    window.location.pathname;


  return (
    url +
    "?bot=" +
    encodeURIComponent(username)
  );

}


/* =====================================================
   OPEN BOT FROM LINK
===================================================== */

function openBotFromUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const username =
    params.get("bot");


  if (!username) return;


  const bot =
    getAllBots()
      .find(item =>
        item.username.toLowerCase() ===
        username.toLowerCase()
      );


  if (!bot) {

    showToast(
      "Этот бот не найден на этом устройстве."
    );

    return;

  }


  openBot(bot.id);

}

/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttr(value) {

  return escapeHtml(value);

}
