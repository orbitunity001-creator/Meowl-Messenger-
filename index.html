<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meowl Messenger</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       AUTH
  ========================== -->

  <section id="authScreen" class="screen auth-screen">

    <div class="auth-card">

      <div class="logo-cat">🐱</div>

      <h1>Meowl</h1>

      <p class="subtitle">
        Твой уютный мессенджер
      </p>

      <div class="auth-tabs">

        <button
          id="loginTab"
          class="auth-tab active"
          type="button"
        >
          Вход
        </button>

        <button
          id="registerTab"
          class="auth-tab"
          type="button"
        >
          Регистрация
        </button>

      </div>

      <form id="authForm">

        <div class="input-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            placeholder="example@mail.com"
            required
          >

        </div>

        <div class="input-group">

          <label for="password">
            Пароль
          </label>

          <input
            id="password"
            type="password"
            placeholder="Введите пароль"
            minlength="4"
            required
          >

        </div>

        <button
          id="authButton"
          class="primary-button"
          type="submit"
        >
          Продолжить
        </button>

      </form>

      <p
        id="authMessage"
        class="auth-message"
      ></p>

    </div>

  </section>


  <!-- =========================
       APP
  ========================== -->

  <section
    id="appScreen"
    class="screen app-screen hidden"
  >

    <!-- HEADER -->

    <header class="app-header">

      <div>

        <div class="brand">
          🐱 Meowl
        </div>

        <div class="brand-subtitle">
          Messenger
        </div>

      </div>

      <button
        id="logoutButton"
        class="icon-button"
        type="button"
        title="Выйти"
      >
        ⎋
      </button>

    </header>


    <!-- =========================
         CHATS
    ========================== -->

    <main
      id="chatsPage"
      class="page"
    >

      <div class="page-title">

        <div>
          <h2>Чаты</h2>
          <p>Твои сообщения</p>
        </div>

      </div>


      <div class="chat-list">

        <!-- FAVORITES -->

        <button
          id="favoritesOpen"
          class="chat-card"
          type="button"
        >

          <div class="chat-avatar favorites-avatar">
            🐱
          </div>

          <div class="chat-info">

            <div class="chat-top">

              <strong>
                Избранное
              </strong>

              <span class="star">
                ⭐
              </span>

            </div>

            <span
              id="favoritesPreview"
              class="chat-preview"
            >
              Чат с самим собой
            </span>

          </div>

          <div class="chat-arrow">
            ›
          </div>

        </button>


        <!-- DEMO CHAT -->

        <div class="empty-chat-card">

          <div class="empty-icon">
            💬
          </div>

          <strong>
            Здесь будут твои чаты
          </strong>

          <span>
            Пока доступно только «Избранное»
          </span>

        </div>

      </div>

    </main>


    <!-- =========================
         PROFILE
    ========================== -->

    <main
      id="profilePage"
      class="page hidden"
    >

      <div class="page-title">

        <div>
          <h2>Профиль</h2>
          <p>Настройки аккаунта</p>
        </div>

      </div>


      <div class="profile-card">

        <div
          id="profileAvatar"
          class="profile-avatar"
        >
          🐱
        </div>

        <label
          for="avatarInput"
          class="change-avatar-button"
        >
          📷 Изменить аватар
        </label>

        <input
          id="avatarInput"
          type="file"
          accept="image/*"
          hidden
        >


        <div class="input-group">

          <label for="nickname">
            Никнейм
          </label>

          <input
            id="nickname"
            type="text"
            placeholder="Твой никнейм"
            maxlength="30"
          >

        </div>


        <div class="input-group">

          <label for="description">
            Описание
          </label>

          <textarea
            id="description"
            placeholder="Расскажи немного о себе..."
            maxlength="150"
          ></textarea>

        </div>


        <div class="input-group">

          <label>
            Email
          </label>

          <input
            id="profileEmail"
            type="email"
            disabled
          >

        </div>


        <button
          id="saveProfile"
          class="primary-button"
          type="button"
        >
          Сохранить
        </button>

      </div>

    </main>


    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <nav class="bottom-nav">

      <button
        id="chatsNav"
        class="nav-button active"
        type="button"
      >

        <span>💬</span>
        <small>Чаты</small>

      </button>


      <button
        id="profileNav"
        class="nav-button"
        type="button"
      >

        <span>👤</span>
        <small>Профиль</small>

      </button>

    </nav>

  </section>


  <!-- =========================
       FAVORITES CHAT
  ========================== -->

  <section
    id="favoritesScreen"
    class="favorites-screen hidden"
  >

    <div class="favorites-window">


      <!-- HEADER -->

      <header class="favorites-header">

        <button
          id="favoritesBack"
          class="icon-button"
          type="button"
        >
          ←
        </button>


        <div class="favorites-user">

          <div class="favorites-avatar">
            🐱
          </div>

          <div>

            <strong>
              Избранное ⭐
            </strong>

            <span>
              Чат с самим собой
            </span>

          </div>

        </div>


        <button
          id="clearFavorites"
          class="icon-button"
          type="button"
          title="Очистить"
        >
          🗑️
        </button>

      </header>


      <!-- MESSAGES -->

      <main
        id="favoritesMessages"
        class="favorites-messages"
      ></main>


      <!-- ATTACH MENU -->

      <div
        id="attachMenu"
        class="attach-menu hidden"
      >

        <button
          id="photoButton"
          type="button"
        >
          🖼️ Фото
        </button>

        <button
          id="videoButton"
          type="button"
        >
          🎥 Видео
        </button>

      </div>


      <!-- INPUT -->

      <form
        id="favoritesForm"
        class="message-form"
      >

        <button
          id="attachButton"
          class="attach-button"
          type="button"
        >
          ＋
        </button>


        <input
          id="favoritesInput"
          type="text"
          placeholder="Написать сообщение..."
          autocomplete="off"
        >


        <button
          class="send-button"
          type="submit"
        >
          ➤
        </button>

      </form>


      <!-- FILE INPUTS -->

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        hidden
      >

      <input
        id="videoInput"
        type="file"
        accept="video/*"
        hidden
      >

    </div>

  </section>


  <script src="script.js"></script>

</body>
</html>
