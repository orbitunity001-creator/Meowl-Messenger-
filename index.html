<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth {
      width: 100%;
      max-width: 420px;
      padding: 25px;
    }

    .logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 15px;
      border-radius: 22px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #999;
      margin-top: 8px;
    }

    .card {
      background: #191919;
      border: 1px solid #2b2b2b;
      border-radius: 22px;
      padding: 22px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #101010;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #999;
    }

    .switch span {
      color: white;
      cursor: pointer;
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="auth">

    <div class="logo">
      <div class="logo-icon">🐱</div>
      <h1>Meowl Messenger</h1>
      <div class="subtitle">Ваши сообщения — в одном месте</div>
    </div>

    <!-- ВХОД -->
    <section class="card" id="login">
      <h2>Вход</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="Email"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Пароль"
      >

      <button>Войти</button>

      <div class="switch">
        Нет аккаунта?
        <span onclick="showRegister()">Зарегистрироваться</span>
      </div>
    </section>

    <!-- РЕГИСТРАЦИЯ -->
    <section class="card hidden" id="register">
      <h2>Регистрация</h2>

      <input
        type="text"
        id="username"
        placeholder="Имя пользователя"
      >

      <input
        type="email"
        id="registerEmail"
        placeholder="Email"
      >

      <input
        type="password"
        id="registerPassword"
        placeholder="Пароль"
      >

      <input
        type="password"
        id="registerPassword2"
        placeholder="Повторите пароль"
      >

      <button>Зарегистрироваться</button>

      <div class="switch">
        Уже есть аккаунт?
        <span onclick="showLogin()">Войти</span>
      </div>
    </section>

  </main>

  <script>
    function showRegister() {
      document.getElementById("login").classList.add("hidden");
      document.getElementById("register").classList.remove("hidden");
    }

    function showLogin() {
      document.getElementById("register").classList.add("hidden");
      document.getElementById("login").classList.remove("hidden");
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 22px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 30px;
    }

    .subtitle {
      color: #999;
    }

    .card {
      background: #191919;
      border: 1px solid #2d2d2d;
      border-radius: 22px;
      padding: 22px;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: 1px solid #333;
      border-radius: 12px;
      background: #101010;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #999;
    }

    .switch span {
      color: white;
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <div class="logo-icon">🐱</div>
    <h1>Meowl Messenger</h1>
    <div class="subtitle">Ваш мессенджер</div>
  </div>

  <!-- ВХОД -->
  <div class="card" id="loginBox">

    <h2>Вход</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Пароль"
    >

    <button onclick="login()">
      Войти
    </button>

    <div class="switch">
      Нет аккаунта?
      <span onclick="showRegister()">Зарегистрироваться</span>
    </div>

  </div>

  <!-- РЕГИСТРАЦИЯ -->
  <div class="card hidden" id="registerBox">

    <h2>Регистрация</h2>

    <input
      id="registerUsername"
      type="text"
      placeholder="Имя пользователя"
    >

    <input
      id="registerEmail"
      type="email"
      placeholder="Email"
    >

    <input
      id="registerPassword"
      type="password"
      placeholder="Пароль"
    >

    <input
      id="registerPassword2"
      type="password"
      placeholder="Повторите пароль"
    >

    <button onclick="register()">
      Зарегистрироваться
    </button>

    <div class="switch">
      Уже есть аккаунт?
      <span onclick="showLogin()">Войти</span>
    </div>

  </div>

  <div id="message"></div>

</div>

<script>

  const SUPABASE_URL =
    "https://ehkdidgjiszpqqajsxsu.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_5-1jR2q3JRmXTAjksWFndA_yraWCUD2";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  function showRegister() {
    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("registerBox")
      .classList.remove("hidden");

    document.getElementById("message").textContent = "";
  }


  function showLogin() {
    document
      .getElementById("registerBox")
      .classList.add("hidden");

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

    document.getElementById("message").textContent = "";
  }


  async function register() {

    const username =
      document.getElementById("registerUsername").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;

    const password2 =
      document.getElementById("registerPassword2").value;

    const message =
      document.getElementById("message");


    if (!username || !email || !password) {
      message.textContent = "Заполни все поля";
      return;
    }

    if (password !== password2) {
      message.textContent = "Пароли не совпадают";
      return;
    }

    message.textContent = "Регистрация...";


    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });


    if (error) {
      message.textContent =
        "Ошибка: " + error.message;
      return;
    }


    if (data.user) {

      const { error: profileError } =
        await supabaseClient
          .from("profiles")
          .insert({
            id: data.user.id,
            username: username
          });


      if (profileError) {
        message.textContent =
          "Аккаунт создан, но профиль не сохранился: "
          + profileError.message;
        return;
      }
    }


    message.textContent =
      "Регистрация выполнена! Теперь можно войти.";

    showLogin();
  }


  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("message");

    message.textContent = "Выполняется вход...";


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {
      message.textContent =
        "Ошибка: " + error.message;
      return;
    }


    message.textContent =
      "Вход выполнен!";
  }

</script>

</body>
</html>
