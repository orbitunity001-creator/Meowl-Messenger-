<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ВХОД / РЕГИСТРАЦИЯ -->
<div id="auth" class="auth-card">
  <div class="logo">M</div>

  <h1>Meowl Messenger</h1>
  <p class="subtitle">Общайся. Быстро. Красиво.</p>

  <div class="tabs">
    <button id="loginTab" class="tab active" onclick="setMode('login')">
      Войти
    </button>
    <button id="registerTab" class="tab" onclick="setMode('register')">
      Регистрация
    </button>
  </div>

  <input id="email" type="email" placeholder="Почта">
  <input id="password" type="password" placeholder="Пароль">

  <button class="main-btn" onclick="auth()">Продолжить</button>

  <p id="error"></p>
</div>


<!-- ПРИЛОЖЕНИЕ -->
<div id="app">

  <header>
    <div>
      <h2 id="pageTitle">Чаты</h2>
      <small id="userEmail"></small>
    </div>

    <button class="logout" onclick="logout()">Выйти</button>
  </header>


  <main>

    <!-- ТОЛЬКО ЧАТЫ -->
    <section id="chatsPage">
      <div class="empty-card">
        <div class="chat-icon">💬</div>
        <h2>Чатов пока нет</h2>
        <p>Здесь будут отображаться твои чаты</p>
      </div>
    </section>


    <!-- ПРОФИЛЬ -->
    <section id="profilePage" class="hidden">

      <div class="profile-card">

        <div class="avatar">
          <img id="avatar" alt="">
          <span id="avatarPlaceholder">👤</span>
        </div>

        <h2 id="profileNick">Ник</h2>
        <p id="profileDesc">Описание профиля</p>

        <button class="main-btn" onclick="openEdit()">
          ✏️ Изменить профиль
        </button>

      </div>


      <!-- РЕДАКТИРОВАНИЕ -->
      <div id="editBox" class="profile-card hidden">

        <h2>Редактирование</h2>

        <button class="photo-btn" onclick="chooseAvatar()">
          📷 Выбрать фото
        </button>

        <input
          id="avatarInput"
          type="file"
          accept="image/*"
          hidden
        >

        <input id="nickname" type="text" placeholder="Ник">

        <textarea
          id="description"
          placeholder="Описание"
        ></textarea>

        <input
          id="profileEmail"
          type="email"
          readonly
          disabled
          placeholder="Почта"
        >

        <button class="main-btn" onclick="saveProfile()">
          💾 Сохранить
        </button>

        <button class="cancel-btn" onclick="closeEdit()">
          Отмена
        </button>

      </div>

    </section>

  </main>


  <!-- НИЖНЕЕ МЕНЮ -->
  <nav>
    <button id="chatBtn" class="nav-btn active" onclick="showChats()">
      <span>💬</span>
      Чаты
    </button>

    <button id="profileBtn" class="nav-btn" onclick="showProfile()">
      <span>👤</span>
      Профиль
    </button>
  </nav>

</div>

<script src="script.js"></script>
</body>
</html>
