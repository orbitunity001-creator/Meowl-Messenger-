<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meowl Messenger</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f3f7;color:#222}
button,input{font:inherit}
button{cursor:pointer}
.page{min-height:100vh;padding:20px}
.auth{max-width:430px;margin:40px auto;background:white;padding:25px 20px;border-radius:25px;box-shadow:0 8px 30px #0001}
.logo{text-align:center;font-size:55px}
h1{text-align:center;margin:5px 0;font-size:30px}
.sub{text-align:center;color:#777;margin-bottom:25px}
h2{margin-top:10px}
input{width:100%;padding:14px;margin:7px 0 12px;border:1px solid #ddd;border-radius:12px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#222;color:white;font-weight:bold;margin-top:5px}
.link{text-align:center;margin:18px 0;color:#777}
.link button{border:0;background:none;font-weight:bold}
.msg{text-align:center;margin:12px 0;min-height:20px}
.hidden{display:none!important}
.app{height:100vh;display:flex;flex-direction:column}
.head{height:65px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.head b{font-size:20px}
.exit{border:0;border-radius:10px;padding:9px 12px}
.main{display:flex;flex:1;min-height:0}
.chats{width:320px;background:white;border-right:1px solid #ddd;padding:15px;overflow:auto}
.new{width:100%;padding:12px;border:0;border-radius:10px;background:#222;color:white;margin-bottom:12px}
.chat{width:100%;padding:14px;border:0;border-bottom:1px solid #eee;background:white;text-align:left}
.chat:hover{background:#f5f5f5}
.window{flex:1;display:flex;flex-direction:column;min-width:0}
.chathead{padding:15px;background:white;border-bottom:1px solid #ddd;font-weight:bold}
.messages{flex:1;padding:15px;overflow:auto}
.bubble{display:block;width:max-content;max-width:80%;background:white;padding:10px 13px;border-radius:15px;margin:7px 0}
.me{margin-left:auto;background:#222;color:white}
.send{display:flex;padding:10px;background:white;gap:8px}
.send input{margin:0}
.send button{width:55px;border:0;border-radius:12px;background:#222;color:white}
.empty{text-align:center;color:#999;margin-top:50px}
@media(max-width:650px){
.main{display:block}
.chats{width:100%;height:45%;border-right:0;border-bottom:1px solid #ddd}
.window{height:55%}
}
</style>
</head>

<body>

<section id="auth" class="page">
<div class="auth">
<div class="logo">🐱</div>
<h1>Meowl Messenger</h1>
<div class="sub">Общайся с друзьями</div>

<div id="login">
<h2>Вход</h2>
<input id="le" type="email" placeholder="Email">
<input id="lp" type="password" placeholder="Пароль">
<button class="btn" onclick="login()">Войти</button>
<div class="link">Нет аккаунта?
<button onclick="regForm()">Зарегистрироваться</button></div>
</div>

<div id="register" class="hidden">
<h2>Регистрация</h2>
<input id="name" placeholder="Имя пользователя">
<input id="re" type="email" placeholder="Email">
<input id="rp" type="password" placeholder="Пароль">
<input id="rp2" type="password" placeholder="Повторите пароль">
<button class="btn" onclick="register()">Зарегистрироваться</button>
<div class="link">Уже есть аккаунт?
<button onclick="loginForm()">Войти</button></div>
</div>

<div id="error" class="msg"></div>
</div>
</section>

<section id="app" class="app hidden">
<header class="head">
<b>🐱 Meowl Messenger</b>
<button class="exit" onclick="logout()">Выйти</button>
</header>

<div class="main">

<aside class="chats">
<button class="new" onclick="addChat()">➕ Новый чат</button>
<div id="chatList"></div>
</aside>

<section class="window">
<div id="chatTitle" class="chathead">Выберите чат</div>
<div id="messages" class="messages">
<div class="empty">Выбери чат или создай новый 💬</div>
</div>

<div class="send">
<input id="text" placeholder="Написать сообщение..." onkeydown="enterSend(event)">
<button onclick="send()">➤</button>
</div>
</section>

</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const URL="https://ehkdidgjiszpqqajsxsu.supabase.co";
const KEY="sb_publishable_5-1jR2q3JRmXTAjksWFndA_yraWCUD2";
const sb=window.supabase.createClient(URL,KEY);

let currentChat=null;

function $(id){return document.getElementById(id)}

function say(x){$("error").textContent=x}

function loginForm(){
$("register").classList.add("hidden");
$("login").classList.remove("hidden");
say("");
}

function regForm(){
$("login").classList.add("hidden");
$("register").classList.remove("hidden");
say("");
}

async function register(){
let n=$("name").value.trim();
let e=$("re").value.trim();
let p=$("rp").value;
let p2=$("rp2").value;

if(!n||!e||!p||!p2)return say("Заполни все поля.");
if(p.length<6)return say("Пароль минимум 6 символов.");
if(p!==p2)return say("Пароли не совпадают.");

say("Создаём аккаунт...");

let r=await sb.auth.signUp({
email:e,
password:p,
options:{data:{username:n}}
});

if(r.error)return say("Ошибка: "+r.error.message);

if(r.data.session){
openApp();
}else{
say("Аккаунт создан. Подтверди email и затем войди.");
loginForm();
}
}

async function login(){
let e=$("le").value.trim();
let p=$("lp").value;

if(!e||!p)return say("Заполни email и пароль.");

say("Выполняем вход...");

let r=await sb.auth.signInWithPassword({
email:e,password:p
});

if(r.error)return say("Ошибка: "+r.error.message);

openApp();
}

async function logout(){
await sb.auth.signOut();
$("app").classList.add("hidden");
$("auth").classList.remove("hidden");
loginForm();
}

function openApp(){
$("auth").classList.add("hidden");
$("app").classList.remove("hidden");
loadChats();
}

function chats(){
return JSON.parse(localStorage.getItem("meowl_chats")||"[]");
}

function saveChats(x){
localStorage.setItem("meowl_chats",JSON.stringify(x));
}

function addChat(){
let n=prompt("Имя пользователя:");

if(!n)return;

let x=chats();
let id=Date.now();

x.push({id:id,name:n,messages:[]});
saveChats(x);
loadChats();
openChat(id);
}

function loadChats(){
let list=$("chatList");
let x=chats();

if(!x.length){
list.innerHTML='<div class="empty">Пока нет чатов</div>';
return;
}

list.innerHTML="";

x.forEach(c=>{
let b=document.createElement("button");
b.className="chat";
b.textContent="🐱 "+c.name;
b.onclick=()=>openChat(c.id);
list.appendChild(b);
});
}

function openChat(id){
currentChat=id;

let x=chats();
let c=x.find(a=>a.id===id);

if(!c)return;

$("chatTitle").textContent="💬 "+c.name;
draw(c);
}

function draw(c){
let box=$("messages");
box.innerHTML="";

if(!c.messages.length){
box.innerHTML='<div class="empty">Начни переписку 💬</div>';
return;
}

c.messages.forEach(m=>{
let d=document.createElement("div");
d.className="bubble"+(m.me?" me":"");
d.textContent=m.text;
box.appendChild(d);
});

box.scrollTop=box.scrollHeight;
}

function send(){
if(currentChat===null)return;

let input=$("text");
let text=input.value.trim();

if(!text)return;

let x=chats();
let c=x.find(a=>a.id===currentChat);

c.messages.push({
text:text,
me:true,
time:Date.now()
});

saveChats(x);
input.value="";
draw(c);
}

function enterSend(e){
if(e.key==="Enter")send();
}

async function check(){
let r=await sb.auth.getSession();

if(r.data.session)openApp();
}

check();
</script>

</body>
</html>
