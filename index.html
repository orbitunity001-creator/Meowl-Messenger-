<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meowl Messenger</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 20%,#6d28d9 0%,transparent 35%),
    radial-gradient(circle at 80% 80%,#0891b2 0%,transparent 35%),
    #090014;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden
}

button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.app{
  width:100%;
  max-width:1100px;
  height:95vh;
  border:1px solid rgba(255,255,255,.15);
  border-radius:28px;
  background:rgba(10,8,25,.72);
  backdrop-filter:blur(25px);
  box-shadow:0 0 60px rgba(139,92,246,.25);
  overflow:hidden;
  position:relative
}

.auth{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px
}

.auth-card{
  width:100%;
  max-width:430px;
  padding:35px;
  border-radius:25px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 0 40px rgba(139,92,246,.18)
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:800;
  margin-bottom:8px;
  background:linear-gradient(90deg,#c084fc,#22d3ee);
  -webkit-background-clip:text;
  color:transparent
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:28px
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px
}

.tab{
  flex:1;
  border:0;
  padding:12px;
  border-radius:12px;
  color:#aaa;
  background:rgba(255,255,255,.05)
}

.tab.active{
  color:#fff;
  background:linear-gradient(90deg,#7c3aed,#0891b2)
}

.field{margin-bottom:14px}

.field label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin-bottom:7px
}

.field input,
.field textarea,
.search input,
.message-input{
  width:100%;
  border:1px solid rgba(255,255,255,.12);
  outline:none;
  color:#fff;
  background:rgba(255,255,255,.06);
  border-radius:14px;
  padding:13px 15px
}

.field textarea{
  min-height:90px;
  resize:none
}

.field input:focus,
.field textarea:focus,
.search input:focus,
.message-input:focus{
  border-color:#a855f7;
  box-shadow:0 0 15px rgba(168,85,247,.2)
}

.primary{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  color:#fff;
  font-weight:700;
  background:linear-gradient(90deg,#7c3aed,#0891b2);
  box-shadow:0 0 25px rgba(124,58,237,.25)
}

.primary:active{transform:scale(.98)}

.error{
  color:#fb7185;
  text-align:center;
  margin-top:12px;
  font-size:14px;
  min-height:18px
}

.main{
  height:100%;
  display:grid;
  grid-template-columns:320px 1fr
}

.sidebar{
  border-right:1px solid rgba(255,255,255,.1);
  display:flex;
  flex-direction:column;
  min-width:0
}

.topbar{padding:24px 20px 15px}

.brand{
  font-size:24px;
  font-weight:800;
  background:linear-gradient(90deg,#c084fc,#22d3ee);
  -webkit-background-clip:text;
  color:transparent
}

.search{margin-top:18px}

.search input{padding:12px}

.user-mini{
  margin:15px 20px;
  padding:13px;
  border-radius:16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08)
}

.user-mini .name{font-weight:700}

.user-mini .handle{
  color:#22d3ee;
  font-size:13px;
  margin-top:3px
}

.chat-list{
  flex:1;
  overflow-y:auto;
  padding:5px 12px
}

.chat-item{
  padding:14px;
  border-radius:15px;
  margin-bottom:7px;
  cursor:pointer;
  border:1px solid transparent
}

.chat-item:hover,
.chat-item.active{
  background:rgba(139,92,246,.14);
  border-color:rgba(168,85,247,.2)
}

.chat-name{font-weight:700}

.chat-handle{
  color:#999;
  font-size:12px;
  margin-top:3px
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 15px;
  font-size:14px
}

.bottom-nav{
  display:flex;
  gap:7px;
  padding:12px;
  border-top:1px solid rgba(255,255,255,.1)
}

.nav-btn{
  flex:1;
  border:0;
  color:#aaa;
  background:transparent;
  padding:11px 5px;
  border-radius:12px
}

.nav-btn.active,
.nav-btn:hover{
  color:#fff;
  background:rgba(139,92,246,.15)
}

.content{
  min-width:0;
  position:relative
}

.screen{
  height:100%;
  display:flex;
  flex-direction:column
}

.screen-header{
  padding:22px;
  border-bottom:1px solid rgba(255,255,255,.1);
  display:flex;
  align-items:center;
  gap:12px
}

.screen-header h2{font-size:21px}

.back{
  display:none;
  border:0;
  color:#fff;
  background:rgba(255,255,255,.07);
  border-radius:10px;
  padding:8px 12px
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:20px
}

.message{
  max-width:75%;
  padding:11px 14px;
  border-radius:17px;
  margin-bottom:9px;
  line-height:1.4;
  word-wrap:break-word
}

.message.mine{
  margin-left:auto;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  border-bottom-right-radius:5px
}

.message.theirs{
  background:rgba(255,255,255,.08);
  border-bottom-left-radius:5px
}

.message-time{
  font-size:10px;
  opacity:.55;
  margin-top:4px;
  text-align:right
}

.message-form{
  padding:15px;
  display:flex;
  gap:8px;
  border-top:1px solid rgba(255,255,255,.1)
}

.message-input{flex:1}

.send{
  width:52px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,#7c3aed,#0891b2)
}

.panel{
  padding:25px;
  overflow-y:auto;
  height:100%
}

.panel-card{
  padding:22px;
  border-radius:20px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  margin-bottom:15px
}

.panel-card h3{margin-bottom:16px}

.handle-big{
  color:#22d3ee;
  font-size:18px;
  margin-bottom:15px
}

.logout{
  width:100%;
  border:1px solid rgba(248,113,113,.3);
  color:#fca5a5;
  background:rgba(248,113,113,.08);
  padding:13px;
  border-radius:13px
}

.search-result{
  padding:15px;
  margin-top:10px;
  border-radius:15px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  cursor:pointer
}

.search-result:hover{
  background:rgba(139,92,246,.15)
}

.status{
  text-align:center;
  color:#aaa;
  font-size:13px;
  padding:8px
}

@media(max-width:700px){
  body{align-items:stretch}

  .app{
    height:100vh;
    border-radius:0;
    border:0
  }

  .main{display:block}

  .sidebar{
    height:100%;
    border:0
  }

  .content{
    position:absolute;
    inset:0;
    background:rgba(9,0,20,.97);
    display:none
  }

  .content.show{display:block}

  .back{display:block}

  .main.chat-open .sidebar{display:none}

  .main.chat-open .content{display:block}

  .message{max-width:85%}
}
</style>
</head>

<body>

<div class="app">

<section id="authScreen" class="auth">

<div class="auth-card">

<div class="logo">🐱 Meowl Messenger</div>

<div class="subtitle">
Общайся с людьми в реальном времени
</div>

<div class="tabs">
<button id="loginTab" class="tab active">Войти</button>
<button id="registerTab" class="tab">Регистрация</button>
</div>

<form id="authForm">

<div class="field">
<label>Email</label>
<input id="email" type="email" autocomplete="email" required>
</div>

<div class="field">
<label>Пароль</label>
<input id="password" type="password" autocomplete="current-password" minlength="6" required>
</div>

<button class="primary" type="submit" id="authButton">
Войти
</button>

<div id="authError" class="error"></div>

</form>

</div>
</section>


<section id="mainScreen" class="main hidden">

<aside class="sidebar">

<div class="topbar">

<div class="brand">🐱 Meowl</div>

<div class="search">
<input
id="userSearch"
type="text"
placeholder="Найти по @username..."
autocomplete="off">
</div>

<div id="searchResults"></div>

</div>

<div class="user-mini">
<div id="miniName" class="name">Пользователь</div>
<div id="miniHandle" class="handle">@username</div>
</div>

<div id="chatList" class="chat-list">
<div class="empty">
Найди человека по @username и начни общение.
</div>
</div>

<div class="bottom-nav">
<button class="nav-btn active" id="chatsNav">💬 Чаты</button>
<button class="nav-btn" id="profileNav">👤 Профиль</button>
<button class="nav-btn" id="settingsNav">⚙️</button>
</div>

</aside>


<main class="content" id="content">

<div id="chatScreen" class="screen hidden">

<div class="screen-header">

<button id="backButton" class="back">←</button>

<div>
<h2 id="chatTitle">Чат</h2>
<div id="chatSubtitle" style="color:#888;font-size:12px"></div>
</div>

</div>

<div id="messages" class="chat-messages">
<div class="empty">Выберите чат</div>
</div>

<form id="messageForm" class="message-form">

<input
id="messageInput"
class="message-input"
placeholder="Написать сообщение..."
maxlength="2000"
autocomplete="off">

<button class="send" type="submit">➤</button>

</form>

</div>


<div id="profileScreen" class="screen hidden">

<div class="screen-header">
<h2>Профиль</h2>
</div>

<div class="panel">

<div class="panel-card">

<h3>Мой профиль</h3>

<div id="profileHandle" class="handle-big">
@username
</div>

<div class="field">
<label>Никнейм</label>
<input id="nicknameInput" maxlength="40">
</div>

<div class="field">
<label>Описание</label>
<textarea id="descriptionInput" maxlength="200"></textarea>
</div>

<button id="saveProfile" class="primary">
Сохранить
</button>

<div id="profileStatus" class="status"></div>

</div>
</div>
</div>


<div id="settingsScreen" class="screen hidden">

<div class="screen-header">
<h2>Настройки</h2>
</div>

<div class="panel">

<div class="panel-card">

<h3>Аккаунт</h3>

<div style="color:#999;margin-bottom:18px">
Email:
<span id="accountEmail" style="color:#fff"></span>
</div>

<button id="logoutButton" class="logout">
Выйти из аккаунта
</button>

</div>

</div>
</div>

</main>

</section>

</div>


<script type="module">

/* =====================================================
   ТВОЙ FIREBASE CONFIG
   ===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDUu20AAahXFB57envRSAFIDqA9H6YKIMg",
  authDomain: "meowl-messenger.firebaseapp.com",
  databaseURL: "https://meowl-messenger-default-rtdb.firebaseio.com",
  projectId: "meowl-messenger",
  storageBucket: "meowl-messenger.firebasestorage.app",
  messagingSenderId: "228165699456",
  appId: "1:228165699456:web:a33dfc849a553c01a36365",
  measurementId: "G-WBJM9L18VH"
};


/* =====================================================
   FIREBASE IMPORTS
   ===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  get,
  push,
  onValue,
  serverTimestamp,
  query,
  orderByChild,
  startAt,
  endAt
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);


/* =====================================================
   ELEMENTS
   ===================================================== */

const authScreen = document.getElementById("authScreen");
const mainScreen = document.getElementById("mainScreen");

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const authForm = document.getElementById("authForm");
const authButton = document.getElementById("authButton");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authError = document.getElementById("authError");

const userSearch = document.getElementById("userSearch");
const searchResults = document.getElementById("searchResults");

const chatList = document.getElementById("chatList");

const miniName = document.getElementById("miniName");
const miniHandle = document.getElementById("miniHandle");

const chatScreen = document.getElementById("chatScreen");
const profileScreen = document.getElementById("profileScreen");
const settingsScreen = document.getElementById("settingsScreen");

const chatsNav = document.getElementById("chatsNav");
const profileNav = document.getElementById("profileNav");
const settingsNav = document.getElementById("settingsNav");

const backButton = document.getElementById("backButton");

const chatTitle = document.getElementById("chatTitle");
const chatSubtitle = document.getElementById("chatSubtitle");

const messagesBox = document.getElementById("messages");

const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");

const profileHandle = document.getElementById("profileHandle");
const nicknameInput = document.getElementById("nicknameInput");
const descriptionInput = document.getElementById("descriptionInput");

const saveProfile = document.getElementById("saveProfile");
const profileStatus = document.getElementById("profileStatus");

const accountEmail = document.getElementById("accountEmail");
const logoutButton = document.getElementById("logoutButton");


/* =====================================================
   STATE
   ===================================================== */

let isRegister = false;
let currentUser = null;
let currentProfile = null;
let currentChatId = null;
let currentOtherUser = null;

let unsubscribeMessages = null;
let unsubscribeChats = null;


/* =====================================================
   AUTH TABS
   ===================================================== */

loginTab.onclick = () => {

  isRegister = false;

  loginTab.classList.add("active");
  registerTab.classList.remove("active");

  authButton.textContent = "Войти";
  authError.textContent = "";

};


registerTab.onclick = () => {

  isRegister = true;

  registerTab.classList.add("active");
  loginTab.classList.remove("active");

  authButton.textContent = "Создать аккаунт";
  authError.textContent = "";

};


/* =====================================================
   FIREBASE ERROR
   ===================================================== */

function firebaseError(error){

  console.error(error);

  const code = error?.code || "";

  if(
    code === "auth/api-key-not-valid" ||
    code === "auth/invalid-api-key"
  ){
    return "Firebase API key недействителен. Проверь Config в Firebase.";
  }

  if(code === "auth/email-already-in-use"){
    return "Этот email уже зарегистрирован.";
  }

  if(code === "auth/invalid-email"){
    return "Неверный email.";
  }

  if(code === "auth/weak-password"){
    return "Пароль должен быть минимум 6 символов.";
  }

  if(code === "auth/invalid-credential"){
    return "Неверный email или пароль.";
  }

  if(code === "auth/user-not-found"){
    return "Пользователь не найден.";
  }

  if(code === "auth/wrong-password"){
    return "Неверный пароль.";
  }

  return error?.message || "Произошла ошибка.";
}


/* =====================================================
   LOGIN / REGISTER
   ===================================================== */

authForm.addEventListener("submit", async event => {

  event.preventDefault();

  authError.textContent = "";

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    authError.textContent = "Заполни email и пароль.";
    return;
  }

  authButton.disabled = true;

  try{

    if(isRegister){

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      await createUserProfile(result.user);

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

  }catch(error){

    authError.textContent =
      firebaseError(error);

  }finally{

    authButton.disabled = false;

  }

});


/* =====================================================
   USERNAME
   ===================================================== */

function makeUsername(uid){

  const clean =
    uid.replace(/[^a-zA-Z0-9]/g,"").toLowerCase();

  return "@" + clean.slice(0,8);

}


async function usernameExists(username){

  const value =
    username.toLowerCase();

  const usersQuery = query(
    ref(db,"users"),
    orderByChild("usernameLower"),
    startAt(value),
    endAt(value)
  );

  const snapshot =
    await get(usersQuery);

  return snapshot.exists();

}


async function createUniqueUsername(uid){

  const base =
    makeUsername(uid);

  let username = base;
  let number = 1;

  while(await usernameExists(username)){

    username =
      "@" +
      base.substring(1) +
      number;

    number++;

  }

  return username;

}


/* =====================================================
   CREATE PROFILE
   ===================================================== */

async function createUserProfile(user){

  const username =
    await createUniqueUsername(user.uid);

  const nickname =
    user.email
      ? user.email.split("@")[0]
      : "Пользователь";

  await set(
    ref(db,"users/" + user.uid),
    {
      username,
      usernameLower: username.toLowerCase(),

      nickname,
      nicknameLower: nickname.toLowerCase(),

      description:"",

      createdAt:Date.now()
    }
  );

}


/* =====================================================
   LOAD PROFILE
   ===================================================== */

async function loadProfile(){

  if(!currentUser) return;

  let snapshot =
    await get(
      ref(db,"users/" + currentUser.uid)
    );

  if(!snapshot.exists()){

    await createUserProfile(currentUser);

    snapshot =
      await get(
        ref(db,"users/" + currentUser.uid)
      );

  }

  currentProfile =
    snapshot.val();

  updateProfileUI();

}


/* =====================================================
   PROFILE UI
   ===================================================== */

function updateProfileUI(){

  if(!currentProfile) return;

  miniName.textContent =
    currentProfile.nickname ||
    "Пользователь";

  miniHandle.textContent =
    currentProfile.username ||
    "@username";

  profileHandle.textContent =
    currentProfile.username ||
    "@username";

  nicknameInput.value =
    currentProfile.nickname || "";

  descriptionInput.value =
    currentProfile.description || "";

  accountEmail.textContent =
    currentUser?.email || "";

}


/* =====================================================
   SAVE PROFILE
   ===================================================== */

saveProfile.onclick = async () => {

  if(!currentUser || !currentProfile)
    return;

  const nickname =
    nicknameInput.value.trim();

  const description =
    descriptionInput.value.trim();

  if(!nickname){

    profileStatus.textContent =
      "Введите никнейм.";

    return;

  }

  saveProfile.disabled = true;

  try{

    await set(
      ref(db,"users/" + currentUser.uid),
      {
        ...currentProfile,

        nickname,
        nicknameLower:
          nickname.toLowerCase(),

        description
      }
    );

    currentProfile.nickname = nickname;
    currentProfile.nicknameLower =
      nickname.toLowerCase();
    currentProfile.description =
      description;

    updateProfileUI();

    profileStatus.textContent =
      "Сохранено ✓";

  }catch(error){

    profileStatus.textContent =
      firebaseError(error);

  }finally{

    saveProfile.disabled = false;

  }

};


/* =====================================================
   NAVIGATION
   ===================================================== */

function hideScreens(){

  chatScreen.classList.add("hidden");
  profileScreen.classList.add("hidden");
  settingsScreen.classList.add("hidden");

}


function showChats(){

  hideScreens();

  chatScreen.classList.remove("hidden");

  chatsNav.classList.add("active");
  profileNav.classList.remove("active");
  settingsNav.classList.remove("active");

}


function showProfile(){

  hideScreens();

  profileScreen.classList.remove("hidden");

  chatsNav.classList.remove("active");
  profileNav.classList.add("active");
  settingsNav.classList.remove("active");

}


function showSettings(){

  hideScreens();

  settingsScreen.classList.remove("hidden");

  chatsNav.classList.remove("active");
  profileNav.classList.remove("active");
  settingsNav.classList.add("active");

}


chatsNav.onclick = showChats;
profileNav.onclick = showProfile;
settingsNav.onclick = showSettings;


/* =====================================================
   SEARCH
   ===================================================== */

let searchTimer;

userSearch.addEventListener("input", () => {

  clearTimeout(searchTimer);

  searchTimer =
    setTimeout(searchUsers,250);

});


async function searchUsers(){

  const value =
    userSearch.value.trim().toLowerCase();

  searchResults.innerHTML = "";

  if(!value) return;

  const username =
    value.startsWith("@")
      ? value
      : "@" + value;

  try{

    const usersQuery = query(
      ref(db,"users"),
      orderByChild("usernameLower"),
      startAt(username),
      endAt(username + "\uf8ff")
    );

    const snapshot =
      await get(usersQuery);

    if(!snapshot.exists()){

      searchResults.innerHTML =
        `<div class="empty">Пользователь не найден</div>`;

      return;

    }

    snapshot.forEach(child => {

      if(child.key === currentUser.uid)
        return;

      const user = child.val();

      const result =
        document.createElement("div");

      result.className =
        "search-result";

      result.innerHTML = `
        <div style="font-weight:700">
          ${escapeHtml(user.nickname || "Пользователь")}
        </div>

        <div style="color:#22d3ee;font-size:13px;margin-top:4px">
          ${escapeHtml(user.username || "")}
        </div>
      `;

      result.onclick = () => {

        openChat(child.key,user);

        userSearch.value = "";
        searchResults.innerHTML = "";

      };

      searchResults.appendChild(result);

    });

  }catch(error){

    console.error(error);

    searchResults.innerHTML =
      `<div class="empty">Ошибка поиска</div>`;

  }

}


/* =====================================================
   CHAT ID
   ===================================================== */

function chatIdFor(a,b){

  return [a,b].sort().join("_");

}


/* =====================================================
   OPEN CHAT
   ===================================================== */

async function openChat(uid,user){

  if(!currentUser) return;

  currentOtherUser = {
    uid,
    ...user
  };

  currentChatId =
    chatIdFor(currentUser.uid,uid);

  chatTitle.textContent =
    user.nickname || "Пользователь";

  chatSubtitle.textContent =
    user.username || "";

  hideScreens();

  chatScreen.classList.remove("hidden");

  document
    .querySelector(".main")
    .classList.add("chat-open");

  if(unsubscribeMessages){
    unsubscribeMessages();
  }

  const chatRef =
    ref(db,"chats/" + currentChatId);

  const snapshot =
    await get(chatRef);

  if(!snapshot.exists()){

    await set(
      chatRef,
      {
        participants:{
          [currentUser.uid]:true,
          [uid]:true
        },
        createdAt:Date.now()
      }
    );

  }

  listenMessages();

}


/* =====================================================
   MESSAGES
   ===================================================== */

function listenMessages(){

  const messagesRef =
    ref(
      db,
      "chats/" +
      currentChatId +
      "/messages"
    );

  unsubscribeMessages =
    onValue(
      messagesRef,
      snapshot => {

        messagesBox.innerHTML = "";

        if(!snapshot.exists()){

          messagesBox.innerHTML =
            `<div class="empty">
              Напиши первое сообщение 👋
            </div>`;

          return;

        }

        const messages = [];

        snapshot.forEach(child => {

          messages.push({
            id:child.key,
            ...child.val()
          });

        });

        messages.sort(
          (a,b) =>
            (a.createdAt || 0) -
            (b.createdAt || 0)
        );

        messages.forEach(renderMessage);

        setTimeout(() => {
          messagesBox.scrollTop =
            messagesBox.scrollHeight;
        },50);

      }
    );

}


function renderMessage(message){

  const mine =
    message.senderId === currentUser.uid;

  const element =
    document.createElement("div");

  element.className =
    "message " +
    (mine ? "mine" : "theirs");

  const time =
    message.createdAt
      ? new Date(
          message.createdAt
        ).toLocaleTimeString(
          "ru-RU",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        )
      : "";

  element.innerHTML = `
    <div>${escapeHtml(message.text)}</div>
    <div class="message-time">${time}</div>
  `;

  messagesBox.appendChild(element);

}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

messageForm.addEventListener("submit",async event => {

  event.preventDefault();

  if(!currentUser || !currentChatId)
    return;

  const text =
    messageInput.value.trim();

  if(!text || text.length > 2000)
    return;

  messageInput.value = "";

  try{

    const messagesRef =
      ref(
        db,
        "chats/" +
        currentChatId +
        "/messages"
      );

    const newMessage =
      push(messagesRef);

    await set(
      newMessage,
      {
        senderId:currentUser.uid,
        text,
        createdAt:serverTimestamp()
      }
    );

  }catch(error){

    console.error(error);

    alert(
      "Не удалось отправить сообщение: " +
      firebaseError(error)
    );

  }

});


/* =====================================================
   CHAT LIST
   ===================================================== */

function listenChats(){

  if(unsubscribeChats)
    unsubscribeChats();

  unsubscribeChats =
    onValue(
      ref(db,"chats"),
      async snapshot => {

        if(!snapshot.exists()){

          chatList.innerHTML =
            `<div class="empty">
              Пока нет чатов.
            </div>`;

          return;

        }

        const chats = [];

        snapshot.forEach(child => {

          const chat = child.val();

          if(
            chat.participants &&
            chat.participants[currentUser.uid]
          ){

            chats.push({
              id:child.key,
              ...chat
            });

          }

        });

        if(!chats.length){

          chatList.innerHTML =
            `<div class="empty">
              Пока нет чатов.<br>
              Найди человека по @username.
            </div>`;

          return;

        }

        chatList.innerHTML = "";

        for(const chat of chats){

          const otherUid =
            Object.keys(
              chat.participants || {}
            ).find(
              uid =>
                uid !== currentUser.uid
            );

          if(!otherUid) continue;

          const userSnapshot =
            await get(
              ref(db,"users/" + otherUid)
            );

          if(!userSnapshot.exists())
            continue;

          const user =
            userSnapshot.val();

          const item =
            document.createElement("div");

          item.className =
            "chat-item";

          item.innerHTML = `
            <div class="chat-name">
              ${escapeHtml(
                user.nickname ||
                "Пользователь"
              )}
            </div>

            <div class="chat-handle">
              ${escapeHtml(
                user.username || ""
              )}
            </div>
          `;

          item.onclick = () => {
            openChat(otherUid,user);
          };

          chatList.appendChild(item);

        }

      }
    );

}


/* =====================================================
   BACK
   ===================================================== */

backButton.onclick = () => {

  currentChatId = null;
  currentOtherUser = null;

  if(unsubscribeMessages){

    unsubscribeMessages();
    unsubscribeMessages = null;

  }

  document
    .querySelector(".main")
    .classList.remove("chat-open");

  showChats();

};


/* =====================================================
   LOGOUT
   ===================================================== */

logoutButton.onclick = async () => {

  await signOut(auth);

};


/* =====================================================
   AUTH STATE
   ===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(user){

      currentUser = user;

      authScreen.classList.add("hidden");
      mainScreen.classList.remove("hidden");

      try{

        await loadProfile();

        listenChats();

        showChats();

      }catch(error){

        console.error(error);

        alert(
          "Ошибка Firebase: " +
          firebaseError(error)
        );

      }

    }else{

      currentUser = null;
      currentProfile = null;
      currentChatId = null;
      currentOtherUser = null;

      if(unsubscribeMessages){
        unsubscribeMessages();
        unsubscribeMessages = null;
      }

      if(unsubscribeChats){
        unsubscribeChats();
        unsubscribeChats = null;
      }

      mainScreen.classList.add("hidden");
      authScreen.classList.remove("hidden");

    }

  }
);


/* =====================================================
   HTML SECURITY
   ===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
