<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Meowl Messenger</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(139, 92, 246, .22), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(0, 229, 255, .14), transparent 28%),
        #090a0f;
      color: white;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       AUTH
    ========================= */

    #authScreen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 28px;

      background: rgba(20, 22, 31, .72);
      border: 1px solid rgba(255,255,255,.1);
      box-shadow:
        0 0 50px rgba(128, 0, 255, .15),
        inset 0 1px 0 rgba(255,255,255,.06);

      backdrop-filter: blur(20px);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;

      background: linear-gradient(90deg, #a855f7, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #8e93a5;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      color: #9da2b3;
    }

    .tab.active {
      color: white;
      background: linear-gradient(
        135deg,
        rgba(168,85,247,.45),
        rgba(34,211,238,.25)
      );
    }

    .input {
      width: 100%;
      padding: 15px 16px;
      margin-bottom: 12px;

      border-radius: 15px;
      outline: none;

      color: white;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }

    .input:focus {
      border-color: rgba(168,85,247,.65);
      box-shadow: 0 0 20px rgba(168,85,247,.12);
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      border-radius: 16px;

      color: white;
      font-weight: 700;

      background: linear-gradient(135deg, #9333ea, #06b6d4);
      box-shadow: 0 10px 30px rgba(124,58,237,.25);
    }

    .error {
      color: #ff6b81;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      min-height: 18px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 68px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(10,11,17,.72);
      backdrop-filter: blur(20px);
    }

    .top-title {
      font-size: 21px;
      font-weight: 700;
    }

    .top-subtitle {
      font-size: 12px;
      color: #7f8497;
      margin-top: 3px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      padding-bottom: 100px;
    }

    .page {
      max-width: 700px;
      margin: 0 auto;
    }

    .hero {
      padding: 24px;
      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          rgba(168,85,247,.18),
          rgba(34,211,238,.08)
        );

      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 0 40px rgba(168,85,247,.08);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 29px;
    }

    .hero p {
      margin: 0;
      color: #9da2b3;
      line-height: 1.5;
    }

    .section-title {
      margin: 24px 4px 12px;
      color: #aaaebe;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    /* =========================
       PEOPLE SEARCH
    ========================= */

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 17px 18px 17px 48px;

      border-radius: 18px;
      outline: none;

      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.09);

      color: white;
    }

    .search-box input:focus {
      border-color: rgba(34,211,238,.5);
      box-shadow: 0 0 25px rgba(34,211,238,.08);
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      opacity: .7;
    }

    .person-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;

      padding: 15px;
      margin-bottom: 10px;

      text-align: left;
      color: white;

      border-radius: 20px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.07);

      transition: .2s;
    }

    .person-card:active {
      transform: scale(.98);
    }

    .person-card:hover {
      border-color: rgba(168,85,247,.35);
      background: rgba(168,85,247,.08);
    }

    .avatar {
      width: 52px;
      height: 52px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      font-size: 23px;
      font-weight: 700;

      background:
        linear-gradient(135deg, #7c3aed, #06b6d4);

      box-shadow: 0 0 22px rgba(124,58,237,.22);
    }

    .person-info {
      min-width: 0;
      flex: 1;
    }

    .person-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .person-username {
      color: #22d3ee;
      font-size: 13px;
    }

    .person-description {
      color: #858a9c;
      font-size: 13px;
      margin-top: 5px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      color: #72778a;
      font-size: 23px;
    }

    .empty {
      text-align: center;
      color: #777c8e;
      padding: 45px 20px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-card {
      text-align: center;
      padding: 28px 20px;

      border-radius: 26px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
    }

    .big-avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      font-size: 38px;
      font-weight: 800;

      background: linear-gradient(135deg,#9333ea,#06b6d4);
      box-shadow: 0 0 35px rgba(147,51,234,.3);
    }

    .profile-name {
      font-size: 25px;
      font-weight: 800;
    }

    .profile-username {
      margin-top: 6px;
      color: #22d3ee;
    }

    .profile-description {
      margin: 15px auto 0;
      max-width: 500px;
      color: #979caf;
      line-height: 1.5;
    }

    .profile-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .secondary-btn {
      flex: 1;
      padding: 14px;
      border-radius: 15px;

      color: white;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }

    .write-btn {
      flex: 1;
      padding: 14px;
      border-radius: 15px;

      color: white;
      font-weight: 700;

      background: linear-gradient(135deg,#9333ea,#06b6d4);
    }

    /* =========================
       CHAT
    ========================= */

    .chat-page {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 5px 0 15px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;

      color: white;
      background: rgba(255,255,255,.06);
      font-size: 22px;
    }

    .chat-person-name {
      font-weight: 700;
    }

    .chat-person-username {
      font-size: 12px;
      color: #22d3ee;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 15px;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-row {
      display: flex;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message {
      max-width: 78%;
      padding: 11px 14px;

      border-radius: 18px;

      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.06);

      word-break: break-word;
    }

    .message-row.mine .message {
      background: linear-gradient(
        135deg,
        rgba(147,51,234,.65),
        rgba(6,182,212,.45)
      );
    }

    .message-time {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      color: rgba(255,255,255,.55);
      text-align: right;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding-top: 8px;
    }

    .chat-input {
      flex: 1;
      min-width: 0;

      padding: 14px;

      border-radius: 17px;
      outline: none;

      color: white;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
    }

    .send-btn {
      width: 52px;
      border-radius: 17px;

      color: white;
      font-size: 20px;

      background: linear-gradient(135deg,#9333ea,#06b6d4);
    }

    /* =========================
       CHATS
    ========================= */

    .chat-card {
      display: flex;
      align-items: center;
      gap: 13px;

      width: 100%;
      padding: 14px;
      margin-bottom: 9px;

      color: white;
      text-align: left;

      border-radius: 20px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.07);
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-last {
      margin-top: 5px;
      color: #777c8f;
      font-size: 13px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread {
      min-width: 24px;
      height: 24px;
      padding: 0 7px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: #22d3ee;
      color: #071018;

      font-size: 12px;
      font-weight: 800;
    }

    /* =========================
       NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      height: 76px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      background: rgba(10,11,17,.88);
      border-top: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(22px);

      z-index: 50;
    }

    .nav-btn {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;

      color: #6f7485;
      background: transparent;

      font-size: 11px;
    }

    .nav-btn .icon {
      font-size: 21px;
    }

    .nav-btn.active {
      color: white;
    }

    .nav-btn.active .icon {
      filter: drop-shadow(0 0 8px #a855f7);
    }

    .nav-badge {
      position: absolute;
      top: 8px;
      right: calc(50% - 25px);

      min-width: 18px;
      height: 18px;
      padding: 0 5px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;

      background: #ff3b72;
      color: white;

      font-size: 10px;
      font-weight: 800;
    }

    /* =========================
       LOADER
    ========================= */

    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #090a0f;
    }

    .loader-logo {
      font-size: 30px;
      font-weight: 800;

      background: linear-gradient(90deg,#a855f7,#22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: pulse 1.3s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: .4;
        transform: scale(.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

<div id="loader">
  <div class="loader-logo">🐱 Meowl</div>
</div>

<!-- =========================
     AUTH SCREEN
========================= -->

<div id="authScreen" class="hidden">

  <div class="auth-card">

    <div class="logo">🐱 Meowl Messenger</div>

    <div class="subtitle">
      Общайся с людьми в реальном времени
    </div>

    <div class="tabs">
      <button id="loginTab" class="tab active">
        Войти
      </button>

      <button id="registerTab" class="tab">
        Регистрация
      </button>
    </div>

    <input
      id="emailInput"
      class="input"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="passwordInput"
      class="input"
      type="password"
      placeholder="Пароль"
      autocomplete="current-password"
    >

    <div id="registerFields" class="hidden">

      <input
        id="usernameInput"
        class="input"
        type="text"
        placeholder="Username, например meow123"
        maxlength="20"
      >

      <input
        id="nicknameInput"
        class="input"
        type="text"
        placeholder="Имя / никнейм"
        maxlength="50"
      >

    </div>

    <button id="authButton" class="main-btn">
      Войти
    </button>

    <div id="authError" class="error"></div>

  </div>
</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

  <div class="topbar">

    <div>
      <div id="topTitle" class="top-title">
        Meowl
      </div>

      <div id="topSubtitle" class="top-subtitle">
        Messenger
      </div>
    </div>

  </div>

  <main id="content" class="content"></main>

  <nav class="bottom-nav">

    <button class="nav-btn active" data-page="home">
      <span class="icon">🏠</span>
      <span>Главная</span>
    </button>

    <button class="nav-btn" data-page="chats">
      <span class="icon">💬</span>
      <span>Чаты</span>
      <span id="globalUnread" class="nav-badge hidden">0</span>
    </button>

    <button class="nav-btn" data-page="people">
      <span class="icon">👥</span>
      <span>Люди</span>
    </button>

    <button class="nav-btn" data-page="profile">
      <span class="icon">👤</span>
      <span>Профиль</span>
    </button>

  </nav>
</div>


<script type="module">

  /* =====================================================
     FIREBASE
  ===================================================== */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    set,
    get,
    update,
    remove,
    push,
    onValue,
    serverTimestamp,
    runTransaction,
    query,
    orderByChild,
    equalTo
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDUu20AAahXFB57envRSAFIDa9H6YKIMg",
    authDomain: "meowl-messenger.firebaseapp.com",
    databaseURL: "https://meowl-messenger-default-rtdb.firebaseio.com",
    projectId: "meowl-messenger",
    storageBucket: "meowl-messenger.firebasestorage.app",
    messagingSenderId: "228165699456",
    appId: "1:228165699456:web:a33dfc849a553c01a36365",
    measurementId: "G-WBJM9L18VH"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getDatabase(app);


  /* =====================================================
     STATE
  ===================================================== */

  let currentUser = null;
  let currentProfile = null;

  let currentPage = "home";

  let selectedPerson = null;
  let selectedChatId = null;

  let messagesUnsubscribe = null;
  let chatIndexUnsubscribe = null;

  let isRegisterMode = false;


  /* =====================================================
     DOM
  ===================================================== */

  const loader = document.getElementById("loader");

  const authScreen = document.getElementById("authScreen");
  const appScreen = document.getElementById("app");

  const content = document.getElementById("content");

  const topTitle = document.getElementById("topTitle");
  const topSubtitle = document.getElementById("topSubtitle");

  const authButton = document.getElementById("authButton");

  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");

  const registerFields = document.getElementById("registerFields");

  const authError = document.getElementById("authError");


  /* =====================================================
     HELPERS
  ===================================================== */

  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function normalizeUsername(value) {

    return String(value || "")
      .trim()
      .toLowerCase()
      .replace(/^@/, "");

  }


  function validUsername(value) {

    return /^[a-z0-9_]{3,20}$/.test(value);

  }


  function avatarLetter(profile) {

    const name =
      profile?.nickname ||
      profile?.username ||
      "?";

    return name.charAt(0).toUpperCase();

  }


  function formatTime(timestamp) {

    if (!timestamp) return "";

    const date = new Date(timestamp);

    return date.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });

  }


  function chatIdFor(uid1, uid2) {

    return [uid1, uid2]
      .sort()
      .join("_");

  }


  function showPage(page) {

    currentPage = page;

    document.querySelectorAll(".nav-btn").forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );

    });

    if (page === "home") {
      renderHome();
    }

    if (page === "people") {
      renderPeople();
    }

    if (page === "chats") {
      renderChats();
    }

    if (page === "profile") {
      renderProfile();
    }

  }


  /* =====================================================
     AUTH TABS
  ===================================================== */

  loginTab.onclick = () => {

    isRegisterMode = false;

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    registerFields.classList.add("hidden");

    authButton.textContent = "Войти";

    authError.textContent = "";

  };


  registerTab.onclick = () => {

    isRegisterMode = true;

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    registerFields.classList.remove("hidden");

    authButton.textContent = "Создать аккаунт";

    authError.textContent = "";

  };


  /* =====================================================
     REGISTER / LOGIN
  ===================================================== */

  authButton.onclick = async () => {

    authError.textContent = "";

    const email =
      document.getElementById("emailInput").value.trim();

    const password =
      document.getElementById("passwordInput").value;

    if (!email || !password) {

      authError.textContent =
        "Введите email и пароль.";

      return;
    }

    authButton.disabled = true;

    try {

      if (isRegisterMode) {

        const username =
          normalizeUsername(
            document.getElementById("usernameInput").value
          );

        const nickname =
          document.getElementById("nicknameInput").value.trim();

        if (!validUsername(username)) {

          throw new Error(
            "Username: только a-z, 0-9 и _, от 3 до 20 символов."
          );

        }

        if (!nickname) {

          throw new Error(
            "Введите имя или никнейм."
          );

        }


        /* Проверяем username */

        const usernameRef =
          ref(db, "usernameIndex/" + username);

        const usernameSnapshot =
          await get(usernameRef);

        if (usernameSnapshot.exists()) {

          throw new Error(
            "Этот username уже занят."
          );

        }


        /* Создаём Firebase аккаунт */

        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        const uid = credential.user.uid;


        /* Регистрируем username */

        const transaction =
          await runTransaction(
            usernameRef,
            current => {

              if (current === null) {
                return uid;
              }

              return;

            }
          );


        if (!transaction.committed) {

          await signOut(auth);

          throw new Error(
            "Этот username уже занят."
          );

        }


        /* Создаём профиль */

        await set(
          ref(db, "users/" + uid),
          {
            username: username,
            usernameLower: username,
            nickname: nickname,
            nicknameLower: nickname.toLowerCase(),
            description: "",
            createdAt: serverTimestamp()
          }
        );

      } else {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }

    } catch (error) {

      console.error(error);

      authError.textContent =
        firebaseError(error);

    } finally {

      authButton.disabled = false;

    }

  };


  function firebaseError(error) {

    const code = error?.code || "";

    if (
      code === "auth/invalid-credential" ||
      code === "auth/wrong-password" ||
      code === "auth/user-not-found"
    ) {
      return "Неверный email или пароль.";
    }

    if (code === "auth/email-already-in-use") {
      return "Этот email уже зарегистрирован.";
    }

    if (code === "auth/weak-password") {
      return "Пароль должен быть минимум 6 символов.";
    }

    if (code === "auth/invalid-email") {
      return "Неверный email.";
    }

    return error?.message || "Произошла ошибка.";

  }

  /* =====================================================
     MY PROFILE
  ===================================================== */

  async function loadMyProfile() {

    if (!currentUser) return;

    const profileRef =
      ref(db, "users/" + currentUser.uid);

    const snapshot =
      await get(profileRef);

    if (snapshot.exists()) {

      currentProfile = snapshot.val();

      return;

    }


    /*
      Если Firebase Auth аккаунт существует,
      а профиля ещё нет — создаём профиль.
    */

    let username =
      normalizeUsername(
        currentUser.email?.split("@")[0] || "user"
      );

    username =
      username.replace(/[^a-z0-9_]/g, "")
        .slice(0, 20);

    if (username.length < 3) {
      username = "user" + Math.floor(Math.random() * 99999);
    }


    let finalUsername = username;

    let counter = 1;

    while (true) {

      const snap =
        await get(
          ref(db, "usernameIndex/" + finalUsername)
        );

      if (!snap.exists()) break;

      finalUsername =
        username.slice(0, 17) + counter;

      counter++;

    }


    await set(
      ref(db, "usernameIndex/" + finalUsername),
      currentUser.uid
    );


    await set(
      profileRef,
      {
        username: finalUsername,
        usernameLower: finalUsername,
        nickname: currentUser.email?.split("@")[0] || "Meowl User",
        nicknameLower:
          (currentUser.email?.split("@")[0] || "Meowl User").toLowerCase(),
        description: "",
        createdAt: serverTimestamp()
      }
    );


    const newSnapshot =
      await get(profileRef);

    currentProfile =
      newSnapshot.val();

  }

  /* =====================================================

  ===================================================== */

  async function searchPeople(value) {

    const username =
      normalizeUsername(value);

    const results =
      document.getElementById("peopleResults");

    if (!results) return;


    if (!username) {

      results.innerHTML = `
        <div class="empty">
          Введи username человека
        </div>
      `;

      return;

    }


    if (!/^[a-z0-9_]{1,20}$/.test(username)) {

      results.innerHTML = `
        <div class="empty">
          Используй буквы a-z, цифры и _
        </div>
      `;

      return;

    }


    results.innerHTML = `
      <div class="empty">
        🔎 Ищу @${escapeHTML(username)}...
      </div>
    `;


    try {

      /*
        Ищем по usernameLower.
        Это позволяет найти:
        @MeOw123
        meow123
        @meow123
      */

      const peopleQuery =
        query(
          ref(db, "users"),
          orderByChild("usernameLower"),
          equalTo(username)
        );


      const snapshot =
        await get(peopleQuery);


      if (!snapshot.exists()) {

        results.innerHTML = `
          <div class="empty">
            😿 Пользователь
            <b>@${escapeHTML(username)}</b>
            не найден.
          </div>
        `;

        return;

      }


      const people = [];

      snapshot.forEach(child => {

        people.push({
          uid: child.key,
          ...child.val()
        });

      });


      /*
        Не показываем самого себя
      */

      const filtered =
        people.filter(
          person =>
            person.uid !== currentUser?.uid
        );


      if (!filtered.length) {

        results.innerHTML = `
          <div class="empty">
            Это твой собственный username.
          </div>
        `;

        return;

      }


      results.innerHTML =
        filtered
          .map(personCardHTML)
          .join("");


      filtered.forEach(person => {

        const button =
          document.querySelector(
            `[data-person-id="${person.uid}"]`

            openPerson(person);

      });

    } catch (error) {

      console.error(error);

      results.innerHTML = `
        <div class="empty">
          ❌ Не удалось выполнить поиск.<br><br>
          ${escapeHTML(error.message)}
        </div>
      `;

    }

  }

  /* =====================================================
     START CHAT
  ===================================================== */

  async function startChat(person) {

    if (!currentUser || !person?.uid) return;

    if (person.uid === currentUser.uid) return;


    const chatId =
      chatIdFor(
        currentUser.uid,
        person.uid
      );


    const chatRef =
      ref(db, "chats/" + chatId);


    try {

      const existing =
        await get(chatRef);


      if (!existing.exists()) {

        const chatData = {

          userA:
            currentUser.uid < person.uid
              ? currentUser.uid
              : person.uid,

          userB:
            currentUser.uid < person.uid
              ? person.uid
              : currentUser.uid,

          participants: {

            [currentUser.uid]: true,

            [person.uid]: true

          },

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        };


        await set(
          chatRef,
          chatData
        );

      }


      /*
        Индексы чата у обоих пользователей
      */

      await set(
        ref(
          db,
          "chatIndex/" +
          currentUser.uid +
          "/" +
          chatId
        ),
        person.uid
      );


      await set(
        ref(
          db,
          "chatIndex/" +
          person.uid +
          "/" +
          chatId
        ),
        currentUser.uid
      );


      openChat(
        chatId,
        person
      );


    } catch (error) {

      console.error(error);

      alert(
        "Не удалось открыть чат:\n" +
        error.message
      );

    }

  }

  /* =====================================================
     REAL-TIME MESSAGES
  ===================================================== */

  function listenMessages() {

    const messagesRef =
      ref(
        db,
        "chats/" +
        selectedChatId +
        "/messages"
      );


    messagesUnsubscribe =
      onValue(
        messagesRef,
        snapshot => {

          const messages = [];

          snapshot.forEach(child => {

            messages.push({
              id: child.key,
              ...child.val()
            });

          });


          messages.sort(
            (a, b) =>
              (a.createdAt || 0) -
              (b.createdAt || 0)
          );


          renderMessages(messages);


          markMessagesRead(messages);

        }
      );

  }


  function renderMessages(messages) {

    const container =
      document.getElementById("messages");

    if (!container) return;


    if (!messages.length) {

      container.innerHTML = `
        <div class="empty">
          Начните общение 💬
        </div>
      `;

      return;

    }


    container.innerHTML =
      messages.map(message => {

        const mine =
          message.senderId === currentUser.uid;


        return `

          <div
            class="message-row ${
              mine ? "mine" : ""
            }"
          >

            <div class="message">

              ${escapeHTML(message.text)}

              <span class="message-time">
                ${formatTime(message.createdAt)}
              </span>

            </div>

          </div>

        `;

      }).join("");


    requestAnimationFrame(() => {

      container.scrollTop =
        container.scrollHeight;

    });

  }


  /* =====================================================
     READ MESSAGES
  ===================================================== */

  async function markMessagesRead(messages) {

    if (!currentUser || !selectedChatId) {
      return;
    }


    const updates = {};


    messages.forEach(message => {

      if (
        message.senderId !== currentUser.uid &&
        !message.readBy?.[currentUser.uid]
      ) {

        updates[
          "chats/" +
          selectedChatId +
          "/messages/" +
          message.id +
          "/readBy/" +
          currentUser.uid
        ] = true;

      }

    });


    if (Object.keys(updates).length) {

      try {

        await update(
          ref(db),
          updates
        );

      } catch (error) {

        console.error(
          "Read error:",
          error
        );

      }

    }

  }


  /* =====================================================
     SEND MESSAGE
  ===================================================== */

  async function sendMessage() {

    const input =
      document.getElementById(
        "messageInput"
      );

    if (!input) return;


    const text =
      input.value.trim();


    if (!text) return;


    if (!currentUser || !selectedChatId) {
      return;
    }


    input.value = "";


    try {

      const messagesRef =
        ref(
          db,
          "chats/" +
          selectedChatId +
          "/messages"
        );


      const messageRef =
        push(messagesRef);


      await set(
        messageRef,
        {
          text: text,
          senderId: currentUser.uid,
          createdAt: serverTimestamp(),
          readBy: {
            [currentUser.uid]: true
          }
        }
      );


      await set(
        ref(
          db,
          "chats/" +
          selectedChatId +
          "/updatedAt"
        ),
        serverTimestamp()
      );


    } catch (error) {

      console.error(error);

      alert(
        "Сообщение не отправилось:\n" +
        error.message
      );

    }

  }

  async function renderChats() {

    topTitle.textContent = "Чаты";

        list.innerHTML = `

      }


      const chats = [];


      for (
        const child of indexSnapshot.children
      ) {

        const chatId =
          child.key;

        const otherUid =
          child.val();


        const userSnapshot =
          await get(
            ref(
              db,
              "users/" +
              otherUid
            )
          );


        if (!userSnapshot.exists()) {
          continue;
        }


        const chatSnapshot =
          await get(
            ref(
              db,
              "chats/" +
              chatId
            )
          );


        if (!chatSnapshot.exists()) {
          continue;
        }


        const chat =
          chatSnapshot.val();


        const messages =
          chat.messages || {};


        const messageArray =
          Object.entries(messages)
            .map(([id, value]) => ({
              id,
              ...value
            }))
            .sort(
              (a,b) =>
                (b.createdAt || 0) -
                (a.createdAt || 0)
            );


        const lastMessage =
          messageArray[0] || null;


        let unread = 0;


        messageArray.forEach(message => {

          if (
            message.senderId !== currentUser.uid &&
            !message.readBy?.[currentUser.uid]
          ) {

            unread++;

          }

        });


        chats.push({

          chatId,

          person: {
            uid: otherUid,
            ...userSnapshot.val()
          },

          lastMessage,

          unread,

          updatedAt:
            chat.updatedAt || 0

        });

      }


      chats.sort(
        (a,b) =>
          b.updatedAt -
          a.updatedAt
      );

                      ${chat.unread > 99
                        ? "99+"
                        : chat.unread}
                    </div>
                  `
                  : ""

        }).join("");


      chats.forEach(chat => {

          ${escapeHTML(error.message)}
        </div>

  /* =====================================================

  ===================================================== */

  async function updateGlobalUnread() {

    if (!currentUser) return;


    try {

      const indexSnapshot =
        await get(
          ref(
            db,
            "chatIndex/" +
            currentUser.uid
          )
        );


      if (!indexSnapshot.exists()) {

        setUnreadBadge(0);

        return;

      }


      let total = 0;


      for (
        const child of indexSnapshot.children
      ) {

        const chatSnapshot =
          await get(
            ref(
              db,
              "chats/" +
              child.key +
              "/messages"
            )
          );


        if (!chatSnapshot.exists()) {
          continue;
        }


        chatSnapshot.forEach(message => {

          const value =
            message.val();


          if (
            value.senderId !== currentUser.uid &&
            !value.readBy?.[currentUser.uid]
          ) {

            total++;

          }

        });

      }


      setUnreadBadge(total);

    } catch (error) {

      console.error(
        "Unread error:",
        error
      );

    }

  }


  function setUnreadBadge(number) {

    const badge =
      document.getElementById(
        "globalUnread"
      );


    if (!badge) return;


    if (number > 0) {

      badge.textContent =
        number > 99
          ? "99+"
          : number;

      badge.classList.remove("hidden");

    } else {

      badge.classList.add("hidden");

    }

  }

          );

        }
      );

    });


</script>
