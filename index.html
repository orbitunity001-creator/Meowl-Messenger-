<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- ВХОД -->
  <div id="authScreen" class="card">
    <div class="logo">M</div>

    <h1>Meowl Messenger</h1>
    <p class="subtitle">Общайся. Создавай. Будь собой.</p>

    <div class="tabs">
      <button id="loginTab" class="tab active" onclick="setMode('login')">
        Войти
      </button>

      <button id="registerTab" class="tab" onclick="setMode('register')">
        Регистрация
      </button>
    </div>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">

    <button class="main-btn" onclick="auth()">
      <span id="authButtonText">Войти</span>
    </button>

    <p id="error"></p>
  </div>


  <!-- МЕССЕНДЖЕР -->
  <div id="appScreen" class="app hidden">

    <header>
      <div>
        <h2 id="pageTitle">Чаты</h2>
        <p id="userEmail"></p>
      </div>

      <button class="logout-btn" onclick="logout()">Выйти</button>
    </header>


    <!-- ЧАТЫ -->
    <div id="chatsPage" class="page">

      <div class="empty-card">
        <div class="chat-icon">💬</div>

        <h3>Пока нет чатов</h3>

        <p>Здесь появятся твои переписки.</p>
      </div>

    </div>


    <!-- ПРОФИЛЬ -->
    <div id="profilePage" class="page hidden">

      <div class="profile-card">

        <div class="avatar">
          <img id="avatarPreview" src="" alt="Аватар">
        </div>

        <h2 id="profileNickname">Профиль</h2>

        <p id="profileDescription">
          Описание профиля
        </p>

        <button class="main-btn" onclick="openEditProfile()">
          ✏️ Изменить профиль
        </button>

      </div>


      <!-- РЕДАКТИРОВАНИЕ ПРОФИЛЯ -->
      <div id="editProfile" class="edit-card hidden">

        <h2>Изменить профиль</h2>


        <!-- АВАТАР -->
        <label>Аватар</label>

        <label class="avatar-button">
          📷 Выбрать фото с устройства
          <input
            id="avatarInput"
            type="file"
            accept="image/*"
          >
        </label>


        <!-- НИК -->
        <label>Никнейм</label>

        <input
          id="nickname"
          type="text"
          maxlength="30"
          placeholder="Твой никнейм"
        >


        <!-- ОПИСАНИЕ -->
        <label>Описание</label>

        <textarea
          id="description"
          maxlength="200"
          placeholder="Расскажи о себе..."
        ></textarea>


        <!-- ПОЧТА -->
        <label>Почта</label>

        <input
          id="profileEmail"
          type="email"
          readonly
          disabled
        >


        <!-- СОХРАНИТЬ -->
        <button class="main-btn" onclick="saveProfile()">
          💾 Сохранить профиль
        </button>


        <!-- ОТМЕНА -->
        <button class="cancel-btn" onclick="closeEditProfile()">
          Отмена
        </button>


        <p id="profileMessage"></p>

      </div>

    </div>


    <!-- НИЖНЕЕ МЕНЮ -->
    <nav class="bottom-nav">

      <button
        id="chatsNav"
        class="nav-btn active"
        onclick="showChats()"
      >
        <span>💬</span>
        Чаты
      </button>

      <button
        id="profileNav"
        class="nav-btn"
        onclick="showProfile()"
      >
        <span>👤</span>
        Профиль
      </button>

    </nav>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
