<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meowl Messenger</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#070812;
  --card:rgba(18,21,40,.76);
  --card2:rgba(25,29,52,.9);
  --border:rgba(255,255,255,.1);
  --text:#fff;
  --muted:#9297b7;
  --purple:#9b5cff;
  --cyan:#36e5ff;
  --pink:#ff4fd8;
  --green:#4cff9b;
  --red:#ff557b;
}

html,body{min-height:100%}

body{
  background:
    radial-gradient(circle at 10% 10%,rgba(155,92,255,.2),transparent 30%),
    radial-gradient(circle at 90% 15%,rgba(54,229,255,.15),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(255,79,216,.12),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* AUTH */

.auth-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-card{
  width:100%;
  max-width:430px;
  padding:30px;
  border:1px solid var(--border);
  border-radius:30px;
  background:var(--card);
  backdrop-filter:blur(25px);
  box-shadow:0 25px 90px rgba(0,0,0,.45);
}

.logo{text-align:center;margin-bottom:24px}
.logo-icon{
  font-size:55px;
  filter:drop-shadow(0 0 20px rgba(155,92,255,.7));
}
.logo h1{font-size:28px;margin-top:5px}
.logo p{color:var(--muted);margin-top:6px}

.auth-tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.auth-tabs button{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  color:var(--muted);
}

.auth-tabs button.active{
  color:#fff;
  background:linear-gradient(
    135deg,
    rgba(155,92,255,.35),
    rgba(54,229,255,.18)
  );
  border-color:rgba(155,92,255,.5);
}

.field{margin-bottom:14px}

.field label{
  display:block;
  margin-bottom:7px;
  color:#cfd2e8;
  font-size:14px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid var(--border);
  outline:none;
  border-radius:15px;
  background:rgba(0,0,0,.23);
  color:#fff;
  padding:13px 15px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:rgba(155,92,255,.75);
  box-shadow:0 0 20px rgba(155,92,255,.12);
}

.primary{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),#665cff);
  box-shadow:0 10px 30px rgba(155,92,255,.25);
}

.error{
  color:#ff7890;
  font-size:13px;
  line-height:1.45;
  margin-top:11px;
}

/* APP */

.app{
  min-height:100vh;
  padding-bottom:92px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  padding:16px 18px;
  background:rgba(7,8,18,.74);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.topbar-inner{
  max-width:850px;
  margin:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:800;
}

.brand-icon{font-size:27px}

.page{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:22px 16px;
}

.section-title{margin-bottom:17px}
.section-title h2{font-size:27px}
.section-title p{
  color:var(--muted);
  margin-top:5px;
}

.card{
  border:1px solid var(--border);
  background:var(--card);
  backdrop-filter:blur(22px);
  border-radius:22px;
  padding:17px;
  margin-bottom:12px;
  box-shadow:0 15px 50px rgba(0,0,0,.18);
}

/* PERSON */

.person{
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
}

.avatar{
  width:52px;
  height:52px;
  flex:0 0 52px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:linear-gradient(
    135deg,
    rgba(155,92,255,.48),
    rgba(54,229,255,.25)
  );
  border:1px solid rgba(255,255,255,.12);
}

.person-info{
  min-width:0;
  flex:1;
}

.person-name{font-weight:750}

.person-username{
  color:var(--cyan);
  font-size:13px;
  margin-top:3px;
}

.person-description{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.online-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

/* PROFILE */

.profile-card{
  text-align:center;
  padding:28px 20px;
}

.profile-avatar{
  width:92px;
  height:92px;
  margin:0 auto 15px;
  border-radius:29px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:39px;
  background:linear-gradient(
    135deg,
    rgba(155,92,255,.55),
    rgba(54,229,255,.25)
  );
}

.profile-card h2{font-size:25px}

.profile-card .username{
  color:var(--cyan);
  margin-top:5px;
}

.profile-card .description{
  color:var(--muted);
  line-height:1.5;
  margin-top:12px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.secondary{
  flex:1;
  padding:12px;
  border-radius:14px;
  color:#fff;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
}

.secondary:hover{
  background:rgba(255,255,255,.1);
}

.danger{color:#ff8296}

/* CHAT */

.chat-screen{
  position:fixed;
  inset:0;
  z-index:50;
  background:
    radial-gradient(circle at 20% 20%,rgba(155,92,255,.12),transparent 30%),
    var(--bg);
  display:flex;
  flex-direction:column;
}

.chat-header{
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  background:rgba(7,8,18,.78);
  backdrop-filter:blur(20px);
}

.chat-header-inner{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:11px;
}

.back-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  border:1px solid var(--border);
  color:#fff;
  background:rgba(255,255,255,.05);
}

.chat-title{flex:1}
.chat-title strong{display:block}
.chat-title span{
  color:var(--cyan);
  font-size:12px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px 16px 15px;
}

.messages-inner{
  max-width:850px;
  margin:auto;
}

.message{
  display:flex;
  margin:7px 0;
}

.message.mine{justify-content:flex-end}

.bubble{
  max-width:min(75%,560px);
  padding:11px 14px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--border);
  line-height:1.4;
  word-break:break-word;
}

.message.mine .bubble{
  background:linear-gradient(
    135deg,
    rgba(155,92,255,.55),
    rgba(107,92,255,.42)
  );
  border-color:rgba(155,92,255,.4);
}

.message-time{
  display:block;
  color:rgba(255,255,255,.5);
  font-size:10px;
  margin-top:5px;
  text-align:right;
}

.chat-input{
  padding:12px 16px;
  border-top:1px solid var(--border);
  background:rgba(7,8,18,.84);
  backdrop-filter:blur(20px);
}

.chat-input-inner{
  max-width:850px;
  margin:auto;
  display:flex;
  gap:9px;
}

.chat-input input{
  flex:1;
  min-width:0;
  border:1px solid var(--border);
  border-radius:17px;
  background:rgba(255,255,255,.06);
  color:#fff;
  outline:none;
  padding:13px 15px;
}

.send-btn{
  width:49px;
  border:0;
  border-radius:16px;
  color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-size:20px;
}

/* NAV */

.bottom-nav{
  position:fixed;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  padding:9px 10px 12px;
  background:rgba(7,8,18,.82);
  backdrop-filter:blur(25px);
  border-top:1px solid rgba(255,255,255,.08);
}

.bottom-nav-inner{
  max-width:700px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.nav-btn{
  position:relative;
  border:0;
  background:transparent;
  color:#777c9d;
  padding:7px 3px;
  border-radius:15px;
}

.nav-btn.active{
  color:#fff;
  background:rgba(155,92,255,.1);
}

.nav-icon{
  display:block;
  font-size:20px;
}

.nav-text{
  display:block;
  font-size:11px;
  margin-top:3px;
}

.badge{
  position:absolute;
  top:2px;
  right:23%;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:800;
  color:#fff;
  background:var(--red);
  box-shadow:0 0 12px rgba(255,79,123,.5);
}

/* CHAT LIST */

.chat-row{
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.chat-main{
  flex:1;
  min-width:0;
}

.chat-main strong{display:block}

.last-message{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-meta{text-align:right}

.chat-time{
  color:#777c9d;
  font-size:11px;
}

.unread{
  margin-top:5px;
  min-width:20px;
  height:20px;
  padding:0 6px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:var(--red);
  font-size:10px;
  font-weight:800;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:44px;
  margin-bottom:10px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
}

.modal-card{
  width:100%;
  max-width:430px;
  background:#111426;
  border:1px solid var(--border);
  border-radius:25px;
  padding:22px;
  box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.modal-card h3{margin-bottom:18px}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.modal-actions button{flex:1}

.loading{
  text-align:center;
  color:var(--muted);
  padding:35px;
}

@media(max-width:600px){
  .auth-card{padding:23px}
  .page{padding:18px 12px}
  .bubble{max-width:85%}
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<section id="authScreen" class="auth-screen">

  <div class="auth-card">

    <div class="logo">
      <div class="logo-icon">🐱</div>
      <h1>Meowl Messenger</h1>
      <p>Общайся с реальными людьми</p>
    </div>

    <div class="auth-tabs">
      <button id="loginTab" class="active">Войти</button>
      <button id="registerTab">Регистрация</button>
    </div>

    <form id="authForm">

      <div id="nicknameField" class="field hidden">
        <label>Имя / никнейм</label>
        <input id="nicknameInput"
               maxlength="40"
               placeholder="Например: Alex">
      </div>

      <div id="usernameField" class="field hidden">
        <label>Username</label>
        <input id="usernameInput"
               maxlength="20"
               placeholder="@alex">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="emailInput"
               type="email"
               autocomplete="email"
               placeholder="you@example.com"
               required>
      </div>

      <div class="field">
        <label>Пароль</label>
        <input id="passwordInput"
               type="password"
               autocomplete="current-password"
               placeholder="Минимум 6 символов"
               required>
      </div>

      <button id="authButton"
              class="primary"
              type="submit">
        Войти
      </button>

      <div id="authError" class="error"></div>

    </form>
  </div>

</section>


<!-- ================= APP ================= -->

<section id="app" class="app hidden">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon">🐱</span>
        <span>Meowl Messenger</span>
      </div>
    </div>
  </header>

  <main id="page" class="page"></main>

  <nav class="bottom-nav">

    <div class="bottom-nav-inner">

      <button class="nav-btn active" data-page="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">Главная</span>
      </button>

      <button class="nav-btn" data-page="chats">
        <span class="nav-icon">💬</span>
        <span class="nav-text">Чаты</span>
        <span id="globalBadge" class="badge hidden">0</span>
      </button>

      <button class="nav-btn" data-page="people">
        <span class="nav-icon">👥</span>
        <span class="nav-text">Люди</span>
      </button>

      <button class="nav-btn" data-page="profile">
        <span class="nav-icon">👤</span>
        <span class="nav-text">Профиль</span>
      </button>

    </div>

  </nav>

</section>


<!-- ================= CHAT ================= -->

<section id="chatScreen" class="chat-screen hidden">

  <header class="chat-header">

    <div class="chat-header-inner">

      <button id="chatBack" class="back-btn">←</button>

      <div class="avatar">🐱</div>

      <div class="chat-title">
        <strong id="chatName">Чат</strong>
        <span id="chatUsername">@user</span>
      </div>

    </div>

  </header>

  <div id="messages" class="messages">
    <div id="messagesInner" class="messages-inner"></div>
  </div>

  <div class="chat-input">

    <form id="messageForm" class="chat-input-inner">

      <input id="messageInput"
             maxlength="2000"
             autocomplete="off"
             placeholder="Написать сообщение...">

      <button class="send-btn" type="submit">➤</button>

    </form>

  </div>

</section>


<!-- ================= PROFILE MODAL ================= -->

<div id="profileModal" class="modal hidden">

  <div class="modal-card">

    <h3>Изменить профиль</h3>

    <form id="profileForm">

      <div class="field">
        <label>Имя / никнейм</label>
        <input id="editNickname"
               maxlength="40"
               required>
      </div>

      <div class="field">
        <label>Username</label>
        <input id="editUsername"
               maxlength="20"
               required>
      </div>

      <div class="field">
        <label>Описание</label>
        <textarea id="editDescription"
                  maxlength="160"
                  placeholder="Расскажи о себе..."></textarea>
      </div>

      <div class="modal-actions">

        <button type="button"
                id="cancelProfile"
                class="secondary">
          Отмена
        </button>

        <button type="submit"
                class="primary">
          Сохранить
        </button>

      </div>

      <div id="profileError" class="error"></div>

    </form>

  </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
   ========================================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove,
  push,
  onValue,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================================================
   ТВОЙ FIREBASE CONFIG
   ========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyDUu20AAahXFB57envRSAFIDqA9H6YKIMg",
  authDomain: "meowl-messenger.firebaseapp.com",
  databaseURL: "https://meowl-messenger-default-rtdb.firebaseio.com",
  projectId: "meowl-messenger",
  storageBucket: "meowl-messenger.firebasestorage.app",
  messagingSenderId: "228165699456",
  appId: "1:228165699456:web:a33dfc849a553c01a36365",
  measurementId: "G-WBJM9L18VH"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getDatabase(firebaseApp);


/* =========================================================
   STATE
   ========================================================= */

let currentUser = null;
let currentProfile = null;

let authMode = "login";
let currentPage = "home";

let currentChatId = null;
let currentChatUser = null;

let currentMessagesUnsubscribe = null;
let usersUnsubscribe = null;
let chatIndexUnsubscribe = null;

let usersCache = {};


/* =========================================================
   DOM
   ========================================================= */

const authScreen = document.getElementById("authScreen");
const app = document.getElementById("app");
const page = document.getElementById("page");

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const authForm = document.getElementById("authForm");
const authButton = document.getElementById("authButton");
const authError = document.getElementById("authError");

const nicknameField = document.getElementById("nicknameField");
const usernameField = document.getElementById("usernameField");

const nicknameInput = document.getElementById("nicknameInput");
const usernameInput = document.getElementById("usernameInput");

const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");

const globalBadge = document.getElementById("globalBadge");

const chatScreen = document.getElementById("chatScreen");
const chatBack = document.getElementById("chatBack");
const chatName = document.getElementById("chatName");
const chatUsername = document.getElementById("chatUsername");

const messages = document.getElementById("messages");
const messagesInner = document.getElementById("messagesInner");

const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");

const profileModal = document.getElementById("profileModal");
const profileForm = document.getElementById("profileForm");
const cancelProfile = document.getElementById("cancelProfile");

const editNickname = document.getElementById("editNickname");
const editUsername = document.getElementById("editUsername");
const editDescription = document.getElementById("editDescription");
const profileError = document.getElementById("profileError");


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function normalizeUsername(value){

  let username =
    String(value || "")
      .trim()
      .toLowerCase();

  if(!username.startsWith("@")){
    username = "@" + username;
  }

  return username;
}


function validUsername(username){

  return /^@[a-z0-9_]{3,20}$/.test(username);
}


function chatIdFor(uid1,uid2){

  return [uid1,uid2].sort().join("_");
}


function formatTime(timestamp){

  if(!timestamp) return "";

  const date = new Date(timestamp);

  if(Number.isNaN(date.getTime())) return "";

  return date.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}


function formatDate(timestamp){

  if(!timestamp) return "";

  const date = new Date(timestamp);

  if(Number.isNaN(date.getTime())) return "";

  return date.toLocaleDateString([],{
    day:"2-digit",
    month:"2-digit"
  });
}


function firebaseError(error){

  const code = error?.code || "";

  const map = {

    "auth/email-already-in-use":
      "Этот email уже зарегистрирован.",

    "auth/invalid-email":
      "Неверный email.",

    "auth/weak-password":
      "Пароль должен быть минимум 6 символов.",

    "auth/invalid-credential":
      "Неверный email или пароль.",

    "auth/user-not-found":
      "Пользователь не найден.",

    "auth/wrong-password":
      "Неверный пароль.",

    "auth/network-request-failed":
      "Ошибка сети."

  };

  return map[code] || error?.message || "Произошла ошибка.";
}


/* =========================================================
   AUTH TABS
   ========================================================= */

loginTab.onclick = () => {

  authMode = "login";

  loginTab.classList.add("active");
  registerTab.classList.remove("active");

  nicknameField.classList.add("hidden");
  usernameField.classList.add("hidden");

  authButton.textContent = "Войти";

  authError.textContent = "";
};


registerTab.onclick = () => {

  authMode = "register";

  registerTab.classList.add("active");
  loginTab.classList.remove("active");

  nicknameField.classList.remove("hidden");
  usernameField.classList.remove("hidden");

  authButton.textContent = "Создать аккаунт";

  authError.textContent = "";
};


/* =========================================================
   LOGIN / REGISTER
   ========================================================= */

authForm.addEventListener("submit",async event => {

  event.preventDefault();

  authError.textContent = "";
  authButton.disabled = true;

  try{

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if(authMode === "login"){

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }else{

      const nickname =
        nicknameInput.value.trim();

      const username =
        normalizeUsername(usernameInput.value);

      if(nickname.length < 2){
        throw new Error("Введите имя.");
      }

      if(!validUsername(username)){
        throw new Error(
          "Username должен быть от 3 до 20 символов."
        );
      }

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      const uid =
        credential.user.uid;

      const usernameRef =
        ref(
          db,
          "usernameIndex/" +
          username
        );

      const transaction =
        await runTransaction(
          usernameRef,
          current => {

            if(current === null){
              return uid;
            }

            return;
          }
        );

      if(!transaction.committed){

        await signOut(auth);

        throw new Error(
          "Этот username уже занят."
        );
      }

      await set(
        ref(
          db,
          "users/" +
          uid
        ),
        {
          username,
          usernameLower:username,
          nickname,
          nicknameLower:nickname.toLowerCase(),
          description:"",
          createdAt:Date.now()
        }
      );

      await loadMyProfile();
    }

  }catch(error){

    console.error(error);

    authError.textContent =
      firebaseError(error);

  }finally{

    authButton.disabled = false;
  }

});

/* =========================================================
   PROFILE
   ========================================================= */

async function loadMyProfile(){

  const snapshot =
    await get(
      ref(
        db,
        "users/" +
        currentUser.uid
      )
    );

  if(snapshot.exists()){

    currentProfile =
      snapshot.val();

    return;
  }

  /*
   * Для старых аккаунтов.
   */

  let base =
    (
      currentUser.email ||
      "user"
    )
    .split("@")[0]
    .toLowerCase()
    .replace(/[^a-z0-9_]/g,"")
    .slice(0,14);

  if(base.length < 3){
    base = "user";
  }

  let username = "@" + base;
  let number = 1;

  while(true){

    const check =
      await get(
        ref(
          db,
          "usernameIndex/" +
          username
        )
      );

    if(!check.exists()){
      break;
    }

    username =
      "@" +
      base.slice(0,12) +
      number;

    number++;
  }

  await set(
    ref(
      db,
      "usernameIndex/" +
      username
    ),
    currentUser.uid
  );

  await set(
    ref(
      db,
      "users/" +
      currentUser.uid
    ),
    {
      username,
      usernameLower:username,
      nickname:
        currentUser.email?.split("@")[0] ||
        "User",
      nicknameLower:
        (
          currentUser.email?.split("@")[0] ||
          "User"
        ).toLowerCase(),
      description:"",
      createdAt:Date.now()
    }
  );

  const newSnapshot =
    await get(
      ref(
        db,
        "users/" +
        currentUser.uid
      )
    );

  currentProfile =
    newSnapshot.val();
}

function startChatIndexListener(){

  if(chatIndexUnsubscribe){

  chatIndexUnsubscribe =
    onValue(
      ref(
        db,
        "chatIndex/" +
        currentUser.uid

/* =========================================================
   RENDER MESSAGES
   ========================================================= */

function renderMessages(messageData){

  const entries =
    Object.entries(messageData)
      .sort((a,b) =>
        Number(
          a[1].createdAt || 0
        ) -
        Number(
          b[1].createdAt || 0
        )
      );

  if(!entries.length){

    messagesInner.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          💬
        </div>

        Напишите первое сообщение.

      </div>
    `;

    return;
  }

  messagesInner.innerHTML =
    entries.map(([id,message]) => {

      const mine =
        message.senderId ===
        currentUser.uid;

      return `

        <div class="message ${
          mine ? "mine" : ""
        }">

          <div class="bubble">

            ${escapeHtml(
              message.text
            )}

            <span class="message-time">
              ${formatTime(
                message.createdAt
              )}
            </span>

          </div>

        </div>
      `;

    }).join("");

  requestAnimationFrame(() => {

    messages.scrollTop =
      messages.scrollHeight;

  });

  markMessagesRead(entries);
}


/* =========================================================
   READ MESSAGES
   ========================================================= */

async function markMessagesRead(entries){

  const updates = {};

  for(
    const [messageId,message]
    of entries
  ){

    if(
      message.senderId !==
      currentUser.uid &&
      !message.readBy?.[
        currentUser.uid
      ]
    ){

      updates[
        "chats/" +
        currentChatId +
        "/messages/" +
        messageId +
        "/readBy/" +
        currentUser.uid
      ] = true;
    }
  }

  if(!Object.keys(updates).length){
    return;
  }

  try{

    await update(
      ref(db),
      updates
    );

  }catch(error){

    console.error(
      "read error",
      error
    );
  }
}

/* =========================================================

   ========================================================= */

async function getChats(){

  const indexSnapshot =
    await get(
      ref(
        db,
        "chatIndex/" +
        currentUser.uid
      )
    );

  if(!indexSnapshot.exists()){
    return [];
  }

  const index =
    indexSnapshot.val() || {};

  const result = [];

  for(
    const [chatId,otherUid]
    of Object.entries(index)
  ){

    const userSnapshot =
      await get(
        ref(
          db,
          "users/" +
          otherUid
        )
      );

    const chatSnapshot =
      await get(
        ref(
          db,
          "chats/" +
          chatId
        )
      );

    if(
      !userSnapshot.exists() ||
      !chatSnapshot.exists()
    ){
      continue;
    }

    const chat =
      chatSnapshot.val();

    const messageData =
      chat.messages || {};

    const entries =
      Object.entries(messageData)
        .sort((a,b) =>
          Number(
            b[1].createdAt || 0
          ) -
          Number(
            a[1].createdAt || 0
          )
        );

    const last =
      entries[0]?.[1];

    let unread = 0;

    for(
      const [,message]
      of entries
    ){

      if(
        message.senderId !==
        currentUser.uid &&
        !message.readBy?.[
          currentUser.uid
        ]
      ){

        unread++;
      }
    }

    result.push({

      chatId,
      otherUid,

      user:
        userSnapshot.val(),

      updatedAt:
        chat.updatedAt ||
        last?.createdAt ||
        0,

      lastMessage:
        last?.text ||
        "",

      lastMessageAt:
        last?.createdAt ||
        0,

      unread
    });
  }

  result.sort(
    (a,b) =>
      Number(b.updatedAt || 0) -
      Number(a.updatedAt || 0)
  );

  return result;
}

/* =========================================================

   ========================================================= */

async function updateGlobalUnread(){

  try{

    const snapshot =
      await get(
        ref(
          db,
          "chatIndex/" +
          currentUser.uid
        )
      );

    if(!snapshot.exists()){

      globalBadge.classList.add(
        "hidden"
      );

      return;
    }

    const index =
      snapshot.val() || {};

    let total = 0;

    for(
      const chatId
      of Object.keys(index)
    ){

      const messageSnapshot =
        await get(
          ref(
            db,
            "chats/" +
            chatId +
            "/messages"
          )
        );

      if(!messageSnapshot.exists()){
        continue;
      }

      const messageData =
        messageSnapshot.val();

      for(
        const message
        of Object.values(messageData)
      ){

        if(
          message.senderId !==
          currentUser.uid &&
          !message.readBy?.[
            currentUser.uid
          ]
        ){

          total++;
        }
      }
    }

    if(total > 0){

      globalBadge.textContent =
        total > 99
        ? "99+"
        : total;

      globalBadge.classList.remove(
        "hidden"
      );

    }else{

      globalBadge.classList.add(
        "hidden"
      );
    }

  }catch(error){

    console.error(
      "badge error",
      error
    );
  }
}

    const newUsername =
      normalizeUsername(
        editUsername.value
      );

    const description =
      editDescription.value.trim();

    if(nickname.length < 2){

      profileError.textContent =
        "Имя слишком короткое.";

      return;
    }

    if(!validUsername(newUsername)){

      profileError.textContent =
        "Неверный username.";

      return;
    }

    try{

      const oldUsername =
        currentProfile.username;

      if(newUsername === oldUsername){

        await update(
          ref(
            db,
            "users/" +
            currentUser.uid
          ),
          {
            nickname,
            nicknameLower:
              nickname.toLowerCase(),
            description
          }
        );

      }else{

        /*
         * Проверяем и резервируем
         * новый username.
         */

        const usernameRef =
          ref(
            db,
            "usernameIndex/" +
            newUsername
          );

        const transaction =
          await runTransaction(
            usernameRef,
            value => {

              if(value === null){
                return currentUser.uid;
              }

              return;
            }
          );

        if(!transaction.committed){

          throw new Error(
            "Этот username уже занят."
          );
        }

        await update(
          ref(
            db,
            "users/" +
            currentUser.uid
          ),
          {
            username:newUsername,
            usernameLower:newUsername,
            nickname,
            nicknameLower:
              nickname.toLowerCase(),
            description
          }
        );

        await remove(
          ref(
            db,
            "usernameIndex/" +
            oldUsername
          )
        );
      }

      await loadMyProfile();

      profileModal.classList.add(
        "hidden"
      );

      renderProfile();

    }catch(error){

      console.error(error);

      profileError.textContent =
        firebaseError(error);
    }

  }
);

  if(
    !confirm(
      "Выйти из аккаунта?"
    )
  ){
    return;
  }

  await signOut(auth);
};
