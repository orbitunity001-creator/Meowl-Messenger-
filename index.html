<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="authScreen">

  <div class="auth-card">

    <div class="logo">M</div>

    <h1>Meowl Messenger</h1>
    <p class="subtitle">&#1054;&#1073;&#1097;&#1072;&#1081;&#1089;&#1103;. &#1041;&#1099;&#1089;&#1090;&#1088;&#1086;. &#1050;&#1088;&#1072;&#1089;&#1080;&#1074;&#1086;.</p>

    <div class="tabs">
      <button id="loginTab" class="tab active">&#1042;&#1086;&#1081;&#1090;&#1080;</button>
      <button id="registerTab" class="tab">&#1056;&#1077;&#1075;&#1080;&#1089;&#1090;&#1088;&#1072;&#1094;&#1080;&#1103;</button>
    </div>

    <input
      id="emailInput"
      type="email"
      placeholder="&#1055;&#1086;&#1095;&#1090;&#1072;"
      autocomplete="email"
    >

    <input
      id="passwordInput"
      type="password"
      placeholder="&#1055;&#1072;&#1088;&#1086;&#1083;&#1100;"
      autocomplete="current-password"
    >

    <button id="authButton" class="main-button">
      &#1055;&#1088;&#1086;&#1076;&#1086;&#1083;&#1078;&#1080;&#1090;&#1100;
    </button>

    <p id="authError"></p>

  </div>

</div>


<div id="appScreen" class="hidden">

  <header>
    <div>
      <h2 id="pageTitle">&#1063;&#1072;&#1090;&#1099;</h2>
      <small id="emailLabel"></small>
    </div>

    <button id="logoutButton" class="logout-button">
      &#1042;&#1099;&#1081;&#1090;&#1080;
    </button>
  </header>


  <main>

    <section id="chatsPage">

      <div class="empty-card">
        <div class="chat-icon">💬</div>

        <h2>&#1063;&#1072;&#1090;&#1086;&#1074; &#1087;&#1086;&#1082;&#1072; &#1085;&#1077;&#1090;</h2>

        <p>&#1047;&#1076;&#1077;&#1089;&#1100; &#1073;&#1091;&#1076;&#1091;&#1090; &#1086;&#1090;&#1086;&#1073;&#1088;&#1072;&#1078;&#1072;&#1090;&#1100;&#1089;&#1103; &#1090;&#1074;&#1086;&#1080; &#1095;&#1072;&#1090;&#1099;</p>
      </div>

    </section>


    <section id="profilePage" class="hidden">

      <div class="profile-card">

        <div class="avatar">
          <img id="avatarImage" alt="">
          <span id="avatarDefault">👤</span>
        </div>

        <h2 id="profileNickname">&#1053;&#1080;&#1082;</h2>

        <p id="profileDescription">
          &#1054;&#1087;&#1080;&#1089;&#1072;&#1085;&#1080;&#1077; &#1087;&#1088;&#1086;&#1092;&#1080;&#1083;&#1103;
        </p>

        <button id="editProfileButton" class="main-button">
          ✏️ &#1048;&#1079;&#1084;&#1084;&#1077;&#1085;&#1080;&#1090;&#1100; &#1087;&#1088;&#1086;&#1092;&#1080;&#1083;&#1100;
        </button>

      </div>


      <div id="editProfile" class="profile-card hidden">

        <h2>&#1048;&#1079;&#1084;&#1077;&#1085;&#1080;&#1090;&#1100; &#1087;&#1088;&#1086;&#1092;&#1080;&#1083;&#1100;</h2>

        <button id="photoButton" class="secondary-button">
          📷 &#1042;&#1099;&#1073;&#1088;&#1072;&#1090;&#1100; &#1092;&#1086;&#1090;&#1086;
        </button>

        <input
          id="photoInput"
          type="file"
          accept="image/*"
          hidden
        >

        <input
          id="nicknameInput"
          type="text"
          placeholder="&#1053;&#1080;&#1082;"
        >

        <textarea
          id="descriptionInput"
          placeholder="&#1054;&#1087;&#1080;&#1089;&#1072;&#1085;&#1080;&#1077;"
        ></textarea>

        <input
          id="profileEmail"
          type="email"
          readonly
          disabled
        >

        <button id="saveProfileButton" class="main-button">
          💾 &#1057;&#1086;&#1093;&#1088;&#1072;&#1085;&#1080;&#1090;&#1100;
        </button>

        <button id="cancelProfileButton" class="cancel-button">
          &#1054;&#1090;&#1084;&#1077;&#1085;&#1072;
        </button>

      </div>

    </section>

  </main>


  <nav>

    <button id="chatsButton" class="nav-button active">
      <span>💬</span>
      &#1063;&#1072;&#1090;&#1099;
    </button>

    <button id="profileButton" class="nav-button">
      <span>👤</span>
      &#1055;&#1088;&#1086;&#1092;&#1080;&#1083;&#1100;
    </button>

  </nav>

</div>


<script src="script.js"></script>

</body>
</html>
