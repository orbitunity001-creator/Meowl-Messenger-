<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meowl Messenger</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#fff;background:radial-gradient(circle at 10% 10%,#38165c,transparent 35%),radial-gradient(circle at 90% 10%,#073b50,transparent 35%),#080914;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}
.card,.side,.main{background:#111326d9;border:1px solid #ffffff14;backdrop-filter:blur(20px);box-shadow:0 20px 60px #0006}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:560px;padding:35px;border-radius:30px}
.logo{text-align:center;font-size:42px;font-weight:900;background:linear-gradient(90deg,#39cfff,#9870ff,#ff3fd1);-webkit-background-clip:text;color:transparent}
.sub{text-align:center;color:#999db9;font-size:18px;margin:10px 0 28px}
.tabs{display:flex;background:#ffffff09;padding:5px;border-radius:16px;margin-bottom:20px}.tab{flex:1;border:0;background:none;color:#999db9;padding:14px;border-radius:12px}.tab.on{background:#864bea;color:white}
label{display:block;color:#999db9;margin:12px 0 7px}input,textarea{width:100%;padding:15px;border-radius:16px;border:1px solid #ffffff12;outline:0;background:#ffffff09;color:#fff}textarea{min-height:100px;resize:vertical}
.btn{width:100%;padding:15px;border:0;border-radius:17px;color:#fff;font-weight:bold;background:linear-gradient(135deg,#864bea,#f03bc9);margin-top:15px}.err{text-align:center;color:#ff6680;margin-top:12px;min-height:20px}
#app{height:100vh;padding:15px;display:flex;gap:15px}.side{width:330px;min-width:330px;border-radius:25px;display:flex;flex-direction:column;overflow:hidden}.brand{font-size:25px;font-weight:900;padding:20px;background:linear-gradient(90deg,#39cfff,#9870ff);-webkit-background-clip:text;color:transparent}
.search{margin:0 15px;width:calc(100% - 30px)}#results{padding:8px 15px;max-height:230px;overflow:auto}.user,.chat{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;cursor:pointer}.user:hover,.chat:hover{background:#864bea22}.avatar{width:43px;height:43px;min-width:43px;border-radius:50%;display:grid;place-items:center;font-weight:bold;background:linear-gradient(135deg,#864bea,#39cfff)}.name{font-weight:bold}.muted{color:#999db9;font-size:12px;margin-top:4px}
.title{padding:15px;color:#999db9;font-size:12px;text-transform:uppercase}.chats{flex:1;overflow:auto;padding:0 10px}.nav{display:grid;grid-template-columns:repeat(3,1fr);padding:10px;gap:5px;border-top:1px solid #ffffff10}.nav button{border:0;background:none;color:#999db9;padding:10px;border-radius:12px}.nav button.on{background:#864bea22;color:#fff}
.main{flex:1;border-radius:25px;overflow:hidden}.welcome,.page{height:100%;display:grid;place-items:center;text-align:center;padding:25px}.welcome h1{font-size:35px}.welcome p{color:#999db9;line-height:1.6}.page{display:block;text-align:left;overflow:auto}.box{max-width:600px;margin:auto;padding:25px;border-radius:22px;background:#ffffff06;border:1px solid #ffffff0d}
.chatview{height:100%;display:flex;flex-direction:column}.head{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid #ffffff10}.back{display:none;border:0;background:none;color:#fff;font-size:25px}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px}.msg{max-width:75%;padding:10px 14px;border-radius:17px;background:#ffffff0c;word-break:break-word}.mine{align-self:flex-end;background:linear-gradient(135deg,#864bea,#7139cf)}.send{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff10}.send input{flex:1}.send button{width:52px;border:0;border-radius:15px;background:#864bea;color:white}
@media(max-width:750px){#app{padding:0}.side{width:100%;min-width:100%;height:100vh;border:0;border-radius:0}.main{display:none;position:fixed;inset:0;z-index:5;width:100%;height:100vh;border:0;border-radius:0}.main.open{display:block}.back{display:block}.card{padding:25px}.logo{font-size:36px}}
</style>
</head>
<body>

<div id="auth">
<div class="card">
<div class="logo">🐱 Meowl<br>Messenger</div>
<div class="sub">Личные сообщения по @юзу</div>

<div class="tabs">
<button id="loginTab" class="tab on">Войти</button>
<button id="regTab" class="tab">Регистрация</button>
</div>

<label>Email</label>
<input id="email" type="email" placeholder="Email">

<label>Пароль</label>
<input id="pass" type="password" placeholder="Пароль">

<button id="authBtn" class="btn">Войти</button>
<div id="authErr" class="err"></div>
</div>
</div>

<div id="app" class="hide">

<aside class="side">
<div class="brand">🐱 Meowl Messenger</div>

<input id="search" class="search" placeholder="Найти по @юзу">
<div id="results"></div>

<div class="title">Мои чаты</div>
<div id="chats" class="chats">
<div class="muted" style="text-align:center;padding:25px">Найди человека по @юзу</div>
</div>

<div class="nav">
<button class="on" data-page="chats">💬<br>Чаты</button>
<button data-page="settings">⚙️<br>Настройки</button>
<button data-page="profile">👤<br>Профиль</button>
</div>
</aside>

<main id="main" class="main">

<section id="welcome" class="welcome">
<div>
<div style="font-size:75px">🐱</div>
<h1>Meowl Messenger</h1>
<p>Найди человека по его уникальному @юзу<br>и начни личную переписку.</p>
</div>
</section>

<section id="chat" class="chatview hide">
<div class="head">
<button id="back" class="back">←</button>
<div id="chatAvatar" class="avatar">?</div>
<div>
<div id="chatName" class="name">@user</div>
<div class="muted">Личный чат</div>
</div>
</div>
<div id="messages" class="messages"></div>
<form id="sendForm" class="send">
<input id="message" placeholder="Написать сообщение..." maxlength="2000">
<button>➤</button>
</form>
</section>

<section id="profile" class="page hide">
<div class="box">
<h2>👤 Профиль</h2>
<div id="bigAvatar" class="avatar" style="width:80px;height:80px;font-size:25px">?</div>

<label>Твой @юз</label>
<input id="username" placeholder="@ufjf">
<div class="muted">Например: @ufjf. Только латинские буквы, цифры и _.</div>

<label>Описание</label>
<textarea id="desc" placeholder="О себе..."></textarea>

<button id="save" class="btn">Сохранить</button>
<div id="profileErr" class="err"></div>
</div>
</section>

<section id="settings" class="page hide">
<div class="box">
<h2>⚙️ Настройки</h2>
<p class="muted">Meowl Messenger</p>
<button id="logout" class="btn">Выйти</button>
</div>
</section>

</main>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import{getDatabase,ref,set,get,push,onValue,serverTimestamp,query,orderByChild,startAt,endAt,limitToFirst}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDUu20AAahXFB57envRSAFIDqA9H6YKIM",
authDomain:"meowl-messenger.firebaseapp.com",
databaseURL:"https://meowl-messenger-default-rtdb.firebaseio.com",
projectId:"meowl-messenger",
storageBucket:"meowl-messenger.firebasestorage.app",
messagingSenderId:"228165699456",
appId:"1:228165699456:web:a33dfc849a553c01a36365",
measurementId:"G-WBJM9L18VH"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);

let mode="login",me=null,profile=null,chatId=null,other=null,stopMessages=null,stopChats=null;

$("loginTab").onclick=()=>{mode="login";$("loginTab").classList.add("on");$("regTab").classList.remove("on");$("authBtn").textContent="Войти"};
$("regTab").onclick=()=>{mode="register";$("regTab").classList.add("on");$("loginTab").classList.remove("on");$("authBtn").textContent="Создать аккаунт"};

$("authBtn").onclick=async()=>{
$("authErr").textContent="";
try{
if(mode==="login")await signInWithEmailAndPassword(auth,$("email").value,$("pass").value);
else{
let r=await createUserWithEmailAndPassword(auth,$("email").value,$("pass").value);
let u="@"+r.user.uid.slice(0,6).toLowerCase();
await set(ref(db,"users/"+r.user.uid),{username:u,usernameLower:u.slice(1),description:"",createdAt:serverTimestamp()});
}
}catch(e){$("authErr").textContent=err(e)}
};

function err(e){
if(e.code?.includes("invalid-credential"))return"Неверный email или пароль";
if(e.code?.includes("email-already"))return"Email уже зарегистрирован";
if(e.code?.includes("weak-password"))return"Пароль минимум 6 символов";
if(e.code?.includes("api-key"))return"Проверь Firebase API key";
return e.message||"Ошибка";
}

onAuthStateChanged(auth,async u=>{
if(!u){$("auth").classList.remove("hide");$("app").classList.add("hide");return}
me=u;$("auth").classList.add("hide");$("app").classList.remove("hide");
await loadProfile();loadChats();
});

async function loadProfile(){
let s=await get(ref(db,"users/"+me.uid));
profile=s.exists()?s.val():{};
$("username").value=profile.username||"";
$("desc").value=profile.description||"";
$("bigAvatar").textContent=(profile.username||"?").replace("@","")[0]?.toUpperCase()||"?";
}

$("save").onclick=async()=>{
let u=$("username").value.trim().toLowerCase();
if(!u.startsWith("@"))u="@"+u;
if(!/^@[a-z0-9_]{3,20}$/.test(u)){ $("profileErr").textContent="Пример: @ufjf";return}
let q=query(ref(db,"users"),orderByChild("usernameLower"),startAt(u.slice(1)),endAt(u.slice(1)+"\uf8ff"),limitToFirst(20));
let s=await get(q),busy=false;
s.forEach(x=>{if(x.key!==me.uid&&x.val().usernameLower===u.slice(1))busy=true});
if(busy){$("profileErr").textContent="Этот @юз уже занят";return}
profile={...profile,username:u,usernameLower:u.slice(1),description:$("desc").value.trim()};
await set(ref(db,"users/"+me.uid),profile);
$("profileErr").textContent="Сохранено ✓";
$("bigAvatar").textContent=u[1].toUpperCase();
};

$("search").oninput=async()=>{
let v=$("search").value.trim().toLowerCase();
if(v.startsWith("@"))v=v.slice(1);
if(v.length<2){$("results").innerHTML="";return}
let q=query(ref(db,"users"),orderByChild("usernameLower"),startAt(v),endAt(v+"\uf8ff"),limitToFirst(20));
let s=await get(q),html="";
s.forEach(x=>{
if(x.key===me.uid)return;
let u=x.val();
html+=`<div class="user" data-id="${x.key}"><div class="avatar">${(u.username||"?")[1]?.toUpperCase()||"?"}</div><div><div class="name">${u.username}</div><div class="muted">${u.description||"Пользователь"}</div></div></div>`;
});
$("results").innerHTML=html||'<div class="muted" style="padding:12px">Не найдено</div>';
document.querySelectorAll(".user").forEach(x=>x.onclick=async()=>{
let s=await get(ref(db,"users/"+x.dataset.id));openChat(x.dataset.id,s.val());
$("search").value="";$("results").innerHTML="";
});
};

function cid(a,b){return[a,b].sort().join("_")}

async function openChat(uid,u){
other={uid,...u};chatId=cid(me.uid,uid);
let r=ref(db,"chats/"+chatId),s=await get(r);
if(!s.exists())await set(r,{participants:{[me.uid]:true,[uid]:true},createdAt:serverTimestamp()});
$("chatName").textContent=u.username;$("chatAvatar").textContent=u.username[1]?.toUpperCase()||"?";
$("welcome").classList.add("hide");$("profile").classList.add("hide");$("settings").classList.add("hide");$("chat").classList.remove("hide");$("main").classList.add("open");
loadMessages();
}

function loadMessages(){
if(stopMessages)stopMessages();
stopMessages=onValue(ref(db,"chats/"+chatId+"/messages"),s=>{
$("messages").innerHTML="";
s.forEach(x=>{
let m=x.val(),d=document.createElement("div");
d.className="msg "+(m.senderId===me.uid?"mine":"");
d.textContent=m.text;$("messages").appendChild(d);
});
$("messages").scrollTop=$("messages").scrollHeight;
});
}

$("sendForm").onsubmit=async e=>{
e.preventDefault();
let text=$("message").value.trim();
if(!text||!chatId)return;
let m=push(ref(db,"chats/"+chatId+"/messages"));
await set(m,{senderId:me.uid,text,createdAt:serverTimestamp()});
$("message").value="";
};

function loadChats(){
if(stopChats)stopChats();
stopChats=onValue(ref(db,"chats"),async s=>{
$("chats").innerHTML="";
let arr=[];
s.forEach(x=>{let c=x.val();if(c.participants?.[me.uid])arr.push({id:x.key,p:Object.keys(c.participants).find(a=>a!==me.uid)})});
for(let c of arr){
let u=await get(ref(db,"users/"+c.p));
if(!u.exists())continue;
let d=u.val(),x=document.createElement("div");
x.className="chat";x.innerHTML=`<div class="avatar">${d.username[1]?.toUpperCase()||"?"}</div><div><div class="name">${d.username}</div><div class="muted">Личный чат</div></div>`;
x.onclick=()=>openChat(c.p,d);$("chats").appendChild(x);
}
});
}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
$("welcome").classList.add("hide");$("chat").classList.add("hide");$("profile").classList.add("hide");$("settings").classList.add("hide");
$(b.dataset.page==="chats"?(chatId?"chat":"welcome"):b.dataset.page).classList.remove("hide");
});

$("back").onclick=()=>{$("main").classList.remove("open");$("chat").classList.add("hide");$("welcome").classList.remove("hide")};
$("logout").onclick=()=>signOut(auth);
</script>
</body>
</html>
