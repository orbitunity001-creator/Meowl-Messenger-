<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- ВХОД -->
  <div id="authScreen" class="card">
    <div class="logo">M</div>
    <h1>Meowl Messenger</h1>
    <p class="subtitle">Общайся. Создавай. Будь собой.</p>

    <div class="tabs">
      <button id="loginTab" class="tab active" onclick="setMode('login')">
        Войти
      </button>
      <button id="registerTab" class="tab" onclick="setMode('register')">
        Регистрация
      </button>
    </div>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">

    <button class="main-btn" onclick="auth()">
      <span id="authButtonText">Войти</span>
    </button>

    <p id="error"></p>
  </div>

  <!-- ПРИЛОЖЕНИЕ -->
  <div id="appScreen" class="app hidden">

    <header>
      <div>
        <h2 id="pageTitle">Чаты</h2>
        <p id="userEmail"></p>
      </div>

      <button class="small-btn" onclick="logout()">Выйти</button>
    </header>

    <!-- ЧАТЫ -->
    <section id="chatsPage" class="page">
      <div class="empty-card">
        <div class="big-icon">💬</div>
        <h3>Пока нет чатов</h3>
        <p>Здесь появятся твои переписки.</p>
      </div>
    </section>

    <!-- ПРОФИЛЬ -->
    <section id="profilePage" class="page hidden">
      <div class="profile-card">

        <div class="avatar-wrapper">
          <img id="avatarPreview" src="" alt="Аватар">
        </div>

        <label class="main-btn avatar-btn">
          📷 Изменить аватар
          <input id="avatarInput" type="file" accept="image/*">
        </label>

        <label>Никнейм</label>
        <input id="nickname" type="text" placeholder="Твой никнейм">

        <label>Описание</label>
        <textarea id="description" placeholder="Расскажи о себе..."></textarea>

        <label>Email</label>
        <input id="profileEmail" type="email" disabled>

        <button class="main-btn" onclick="saveProfile()">
          💾 Сохранить профиль
        </button>

        <p id="profileMessage"></p>

      </div>
    </section>

    <!-- НИЖНЕЕ МЕНЮ -->
    <nav class="bottom-nav">
      <button id="chatsNav" class="nav-btn active" onclick="showChats()">
        <span>💬</span>
        <small>Чаты</small>
      </button>

      <button id="profileNav" class="nav-btn" onclick="showProfile()">
        <span>👤</span>
        <small>Профиль</small>
      </button>
    </nav>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
