<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meowl Messenger</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 20% 10%,#702cff55,transparent 35%),
    radial-gradient(circle at 80% 90%,#00eaff33,transparent 35%),
    #080812;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

.auth-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-card{
  width:100%;
  max-width:420px;
  padding:30px;
  border:1px solid #ffffff18;
  border-radius:28px;
  background:#ffffff0b;
  backdrop-filter:blur(20px);
  box-shadow:0 0 50px #7c3cff20;
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#a970ff;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:14px;
  color:#aaa;
  background:#ffffff08;
}

.tabs button.active{
  color:#fff;
  background:linear-gradient(135deg,#873cff,#00c8ff);
}

.field{
  margin-bottom:14px;
}

.field input,
.search{
  width:100%;
  padding:14px 16px;
  border:1px solid #ffffff15;
  outline:none;
  border-radius:15px;
  color:#fff;
  background:#ffffff09;
}

.field input:focus,
.search:focus{
  border-color:#8c4cff88;
  box-shadow:0 0 20px #7d42ff20;
}

.main-btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:15px;
  color:#fff;
  font-weight:700;
  background:linear-gradient(135deg,#873cff,#00c8ff);
}

.error{
  color:#ff6b8a;
  text-align:center;
  margin-top:12px;
  font-size:14px;
}

/* APP */

.app{
  min-height:100vh;
  padding-bottom:82px;
}

.topbar{
  padding:20px;
  border-bottom:1px solid #ffffff0d;
  background:#080812aa;
  backdrop-filter:blur(18px);
  position:sticky;
  top:0;
  z-index:5;
}

.topbar h1{
  font-size:25px;
}

.screen{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.search{
  margin-bottom:15px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.user-card,
.chat-card,
.profile-card,
.setting-card{
  padding:16px;
  border:1px solid #ffffff12;
  border-radius:20px;
  background:#ffffff09;
  backdrop-filter:blur(15px);
  transition:.2s;
}

.user-card:hover,
.chat-card:hover{
  transform:translateY(-1px);
  border-color:#8d52ff55;
  background:#ffffff0d;
}

.user-card,
.chat-card{
  cursor:pointer;
}

.user-name{
  font-weight:700;
  font-size:16px;
}

.user-handle{
  color:#9d83ff;
  margin-top:4px;
  font-size:14px;
}

.user-description{
  color:#999;
  font-size:13px;
  margin-top:7px;
}

.empty{
  text-align:center;
  color:#777;
  padding:40px 10px;
}

/* CHAT */

.chat-screen{
  height:calc(100vh - 82px);
  display:flex;
  flex-direction:column;
}

.chat-head{
  padding:15px 20px;
  border-bottom:1px solid #ffffff10;
  display:flex;
  align-items:center;
  gap:12px;
}

.back-btn{
  border:0;
  color:#fff;
  background:#ffffff0b;
  border-radius:12px;
  padding:10px 13px;
}

.chat-title{
  font-weight:700;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message{
  max-width:75%;
  padding:11px 14px;
  border-radius:17px;
  line-height:1.35;
  word-break:break-word;
}

.message.mine{
  align-self:flex-end;
  background:linear-gradient(135deg,#713cff,#9b55ff);
  border-bottom-right-radius:5px;
}

.message.other{
  align-self:flex-start;
  background:#ffffff0d;
  border:1px solid #ffffff0c;
  border-bottom-left-radius:5px;
}

.chat-form{
  padding:12px 15px;
  display:flex;
  gap:8px;
  background:#080812ee;
  border-top:1px solid #ffffff10;
}

.chat-form input{
  flex:1;
  min-width:0;
  padding:13px;
  color:#fff;
  background:#ffffff0b;
  border:1px solid #ffffff15;
  border-radius:15px;
  outline:none;
}

.send-btn{
  width:48px;
  border:0;
  border-radius:15px;
  color:#fff;
  background:linear-gradient(135deg,#873cff,#00c8ff);
}

/* SETTINGS */

.setting-title{
  margin-bottom:12px;
  color:#aaa;
  font-size:13px;
}

.setting-card{
  margin-bottom:12px;
}

.setting-card input,
.setting-card textarea{
  width:100%;
  padding:13px;
  border:1px solid #ffffff15;
  border-radius:14px;
  outline:none;
  color:#fff;
  background:#ffffff09;
  resize:none;
}

.setting-card input:focus,
.setting-card textarea:focus{
  border-color:#8d52ff77;
}

.save-btn{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,#873cff,#00c8ff);
}

.logout{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:1px solid #ff527055;
  border-radius:14px;
  color:#ff7190;
  background:#ff416015;
}

/* NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  display:flex;
  justify-content:center;
  gap:8px;
  padding:10px;
  border-top:1px solid #ffffff10;
  background:#080812eF;
  backdrop-filter:blur(20px);
  z-index:20;
}

.nav-btn{
  flex:1;
  max-width:180px;
  border:0;
  border-radius:16px;
  color:#777;
  background:transparent;
}

.nav-btn.active{
  color:#fff;
  background:#ffffff0d;
  box-shadow:inset 0 0 20px #873cff12;
}

@media(max-width:500px){
  .auth-card{
    padding:23px;
  }

  .screen{
    padding:15px;
  }

  .message{
    max-width:85%;
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="authScreen" class="auth-screen">
  <div class="auth-card">

    <div class="logo">🐱 Meowl <span>Messenger</span></div>
    <div class="subtitle">Общайся с людьми напрямую</div>

    <div class="tabs">
      <button id="loginTab" class="active">Войти</button>
      <button id="registerTab">Регистрация</button>
    </div>

    <form id="authForm">

      <div class="field">
        <input id="email" type="email" placeholder="Email" required>
      </div>

      <div class="field">
        <input id="password" type="password" placeholder="Пароль" minlength="6" required>
      </div>

      <button class="main-btn" id="authButton">
        Войти
      </button>

    </form>

    <div id="authError" class="error"></div>

  </div>
</div>


<!-- APP -->

<div id="app" class="app hidden">

  <!-- CHATS -->

  <section id="chatsScreen" class="screen">

    <div class="topbar">
      <h1>💬 Чаты</h1>
    </div>

    <input
      id="chatSearch"
      class="search"
      placeholder="🔎 Найти по @username"
      autocomplete="off"
    >

    <div id="chatsList" class="list"></div>

  </section>


  <!-- USERS -->

  <section id="usersScreen" class="screen hidden">

    <div class="topbar">
      <h1>👥 Пользователи</h1>
    </div>

    <input
      id="userSearch"
      class="search"
      placeholder="🔎 Найти по @username"
      autocomplete="off"
    >

    <div id="usersList" class="list"></div>

  </section>


  <!-- CHAT -->

  <section id="chatScreen" class="chat-screen hidden">

    <div class="chat-head">

      <button id="backChat" class="back-btn">
        ←
      </button>

      <div>
        <div id="chatTitle" class="chat-title"></div>
        <div id="chatHandle" class="user-handle"></div>
      </div>

    </div>

    <div id="messages" class="chat-messages"></div>

    <form id="messageForm" class="chat-form">

      <input
        id="messageInput"
        maxlength="2000"
        placeholder="Написать сообщение..."
        autocomplete="off"
      >

      <button class="send-btn">
        ➤
      </button>

    </form>

  </section>


  <!-- SETTINGS -->

  <section id="settingsScreen" class="screen hidden">

    <div class="topbar">
      <h1>⚙️ Настройки</h1>
    </div>

    <div class="setting-card">

      <div class="setting-title">Аккаунт</div>

      <div id="accountEmail" style="color:#bbb"></div>

    </div>

    <div class="setting-card">

      <div class="setting-title">Твой @username</div>

      <input
        id="usernameInput"
        placeholder="@username"
        maxlength="21"
      >

      <div style="color:#777;font-size:12px;margin-top:8px">
        3–20 символов: латинские буквы, цифры и _
      </div>

    </div>

    <div class="setting-card">

      <div class="setting-title">Никнейм</div>

      <input
        id="nicknameInput"
        maxlength="40"
        placeholder="Твой никнейм"
      >

    </div>

    <div class="setting-card">

      <div class="setting-title">Описание</div>

      <textarea
        id="descriptionInput"
        rows="3"
        maxlength="160"
        placeholder="Расскажи немного о себе..."
      ></textarea>

    </div>

    <button id="saveProfile" class="save-btn">
      💾 Сохранить
    </button>

    <div id="profileMessage" class="error"></div>

    <button id="logoutButton" class="logout">
      🚪 Выйти из аккаунта
    </button>

  </section>


  <!-- BOTTOM NAV -->

  <nav id="bottomNav" class="bottom-nav">

    <button id="navChats" class="nav-btn active">
      💬<br>Чаты
    </button>

    <button id="navUsers" class="nav-btn">
      👥<br>Пользователи
    </button>

    <button id="navSettings" class="nav-btn">
      ⚙️<br>Настройки
    </button>

  </nav>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  get,
  push,
  onValue,
  serverTimestamp,
  update,
  remove,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDUu20AAahXFB57envRSAFIDqA9H6YKIM",
  authDomain: "meowl-messenger.firebaseapp.com",
  databaseURL: "https://meowl-messenger-default-rtdb.firebaseio.com",
  projectId: "meowl-messenger",
  storageBucket: "meowl-messenger.firebasestorage.app",
  messagingSenderId: "228165699456",
  appId: "1:228165699456:web:a33dfc849a553c01a36365",
  measurementId: "G-WBJM9L18VH"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getDatabase(appFirebase);


/* =========================
   STATE
========================= */

let currentUser = null;
let currentProfile = null;

let allUsers = {};
let chats = {};

let currentChatId = null;
let currentChatUser = null;

let unsubscribeUsers = null;
let unsubscribeChats = null;
let unsubscribeMessages = null;

let registerMode = false;


/* =========================
   ELEMENTS
========================= */

const authScreen = document.getElementById("authScreen");
const app = document.getElementById("app");

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const authForm = document.getElementById("authForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authButton = document.getElementById("authButton");
const authError = document.getElementById("authError");

const chatsScreen = document.getElementById("chatsScreen");
const usersScreen = document.getElementById("usersScreen");
const chatScreen = document.getElementById("chatScreen");
const settingsScreen = document.getElementById("settingsScreen");

const chatsList = document.getElementById("chatsList");
const usersList = document.getElementById("usersList");

const chatSearch = document.getElementById("chatSearch");
const userSearch = document.getElementById("userSearch");

const chatTitle = document.getElementById("chatTitle");
const chatHandle = document.getElementById("chatHandle");
const messagesBox = document.getElementById("messages");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");

const usernameInput = document.getElementById("usernameInput");
const nicknameInput = document.getElementById("nicknameInput");
const descriptionInput = document.getElementById("descriptionInput");

const accountEmail = document.getElementById("accountEmail");
const profileMessage = document.getElementById("profileMessage");


/* =========================
   AUTH TABS
========================= */

loginTab.onclick = () => {
  registerMode = false;

  loginTab.classList.add("active");
  registerTab.classList.remove("active");

  authButton.textContent = "Войти";
  authError.textContent = "";
};

registerTab.onclick = () => {
  registerMode = true;

  registerTab.classList.add("active");
  loginTab.classList.remove("active");

  authButton.textContent = "Создать аккаунт";
  authError.textContent = "";
};


/* =========================
   AUTH
========================= */

authForm.addEventListener("submit", async e => {

  e.preventDefault();

  authError.textContent = "";

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  try {

    if(registerMode){

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      await createInitialProfile(credential.user);

    }else{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

  }catch(error){

    console.error(error);

    authError.textContent =
      firebaseError(error.code);

  }

});


/* =========================
   REGISTER PROFILE
========================= */

async function createInitialProfile(user){

  const generated =
    "@user_" + user.uid.slice(0,8).toLowerCase();

  let username = generated;

  let counter = 1;

  while(true){

    const usernameRef =
      ref(db,"usernameIndex/" + username);

    const result =
      await runTransaction(
        usernameRef,
        value => value === null
          ? user.uid
          : undefined
      );

    if(result.committed){
      break;
    }

    username =
      generated + "_" + counter++;

  }

  await set(
    ref(db,"users/" + user.uid),
    {
      username: username,
      usernameLower: username.toLowerCase(),
      nickname: user.email.split("@")[0],
      nicknameLower: user.email.split("@")[0].toLowerCase(),
      description: "",
      createdAt: serverTimestamp()
    }
  );

}


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, async user => {

  if(user){

    currentUser = user;

    authScreen.classList.add("hidden");
    app.classList.remove("hidden");

    await loadProfile();

    startUsersListener();
    startChatsListener();

    showScreen("chats");

  }else{

    currentUser = null;
    currentProfile = null;

    authScreen.classList.remove("hidden");
    app.classList.add("hidden");

    stopListeners();

  }

});


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  const snapshot =
    await get(ref(db,"users/" + currentUser.uid));

  if(!snapshot.exists()){

    await createInitialProfile(currentUser);

    return loadProfile();

  }

  currentProfile = snapshot.val();

  usernameInput.value =
    currentProfile.username || "";

  nicknameInput.value =
    currentProfile.nickname || "";

  descriptionInput.value =
    currentProfile.description || "";

  accountEmail.textContent =
    currentUser.email || "";

}


/* =========================
   SAVE PROFILE
========================= */

document.getElementById("saveProfile").onclick =
async () => {

  if(!currentUser || !currentProfile) return;

  profileMessage.textContent = "";

  let username =
    usernameInput.value.trim().toLowerCase();

  if(!username.startsWith("@")){
    username = "@" + username;
  }

  const usernameRegex =
    /^@[a-z0-9_]{3,20}$/;

  if(!usernameRegex.test(username)){

    profileMessage.textContent =
      "❌ Username должен быть @ + 3–20 символов: a-z, 0-9, _";

    return;
  }

  const oldUsername =
    (currentProfile.username || "").toLowerCase();

  try{

    /*
      Если username изменился —
      сначала занимаем новый.
    */

    if(username !== oldUsername){

      const usernameRef =
        ref(db,"usernameIndex/" + username);

      const result =
        await runTransaction(
          usernameRef,
          value => {

            if(value === null){
              return currentUser.uid;
            }

            if(value === currentUser.uid){
              return value;
            }

            return;

          }
        );

      if(!result.committed){

        profileMessage.textContent =
          "❌ Такой @username уже занят.";

        return;
      }

      try{

        await update(
          ref(db,"users/" + currentUser.uid),
          {
            username: username,
            usernameLower: username,
            nickname: nicknameInput.value.trim(),
            nicknameLower:
              nicknameInput.value.trim().toLowerCase(),
            description:
              descriptionInput.value.trim()
          }
        );

      }catch(error){

        await remove(
          ref(db,"usernameIndex/" + username)
        );

        throw error;
      }

      if(oldUsername){

        await remove(
          ref(db,"usernameIndex/" + oldUsername)
        );

      }

    }else{

      await update(
        ref(db,"users/" + currentUser.uid),
        {
          nickname:
            nicknameInput.value.trim(),

          nicknameLower:
            nicknameInput.value.trim().toLowerCase(),

          description:
            descriptionInput.value.trim()
        }
      );

    }

    await loadProfile();

    profileMessage.style.color = "#6dffb0";
    profileMessage.textContent =
      "✅ Профиль сохранён";

    setTimeout(() => {
      profileMessage.textContent = "";
    },2500);

  }catch(error){

    console.error(error);

    profileMessage.style.color = "#ff7190";

    profileMessage.textContent =
      "❌ Не удалось сохранить профиль";

  }

};


/* =========================
   USERS LIST
========================= */

function startUsersListener(){

  if(unsubscribeUsers){
    unsubscribeUsers();
  }

  unsubscribeUsers =
    onValue(
      ref(db,"users"),
      snapshot => {

        allUsers =
          snapshot.val() || {};

        renderUsers();
        renderChats();

      }
    );

}


function renderUsers(){

  const query =
    userSearch.value.trim().toLowerCase();

  usersList.innerHTML = "";

  const users =
    Object.entries(allUsers)
      .filter(([uid,user]) => {

        if(uid === currentUser?.uid){
          return false;
        }

        const username =
          (user.usernameLower || "").toLowerCase();

        if(!query){
          return true;
        }

        return username.includes(query);

      })
      .sort((a,b) => {

        const ua =
          a[1].usernameLower || "";

        const ub =
          b[1].usernameLower || "";

        return ua.localeCompare(ub);

      });

  if(!users.length){

    usersList.innerHTML =
      `<div class="empty">Пользователи не найдены</div>`;

    return;
  }

  users.forEach(([uid,user]) => {

    const card =
      document.createElement("div");

    card.className = "user-card";

    card.innerHTML = `
      <div class="user-name">
        ${escapeHtml(user.nickname || "Пользователь")}
      </div>

      <div class="user-handle">
        ${escapeHtml(user.username || "")}
      </div>

      ${
        user.description
        ? `<div class="user-description">
             ${escapeHtml(user.description)}
           </div>`
        : ""
      }
    `;

    card.onclick = () =>
      openChat(uid);

    usersList.appendChild(card);

  });

}


userSearch.addEventListener(
  "input",
  renderUsers
);


/* =========================
   CHATS
========================= */

function startChatsListener(){

  if(unsubscribeChats){
    unsubscribeChats();
  }

  unsubscribeChats =
    onValue(
      ref(db,"chats"),
      snapshot => {

        chats =
          snapshot.val() || {};

        renderChats();

      }
    );

}


function renderChats(){

  chatsList.innerHTML = "";

  const query =
    chatSearch.value.trim().toLowerCase();

  const result = [];

  Object.entries(chats).forEach(
    ([chatId,chat]) => {

      if(
        !chat.participants ||
        !chat.participants[currentUser?.uid]
      ){
        return;
      }

      const ids =
        Object.keys(chat.participants);

      const otherId =
        ids.find(
          id => id !== currentUser.uid
        );

      if(!otherId) return;

      const other =
        allUsers[otherId];

      if(!other) return;

      const username =
        (other.usernameLower || "").toLowerCase();

      if(
        query &&
        !username.includes(query)
      ){
        return;
      }

      result.push({
        chatId,
        otherId,
        other
      });

    }
  );

  if(!result.length){

    chatsList.innerHTML =
      `<div class="empty">
        Пока нет чатов.<br>
        Открой «Пользователи» и выбери человека.
      </div>`;

    return;
  }

  result.forEach(item => {

    const card =
      document.createElement("div");

    card.className = "chat-card";

    card.innerHTML = `
      <div class="user-name">
        ${escapeHtml(
          item.other.nickname || "Пользователь"
        )}
      </div>

      <div class="user-handle">
        ${escapeHtml(
          item.other.username || ""
        )}
      </div>
    `;

    card.onclick =
      () => openChat(item.otherId);

    chatsList.appendChild(card);

  });

}


chatSearch.addEventListener(
  "input",
  renderChats
);


/* =========================
   OPEN CHAT
========================= */

async function openChat(otherUid){

  if(!currentUser || !otherUid) return;

  const other =
    allUsers[otherUid];

  if(!other) return;

  const chatId =
    makeChatId(currentUser.uid,otherUid);

  currentChatId = chatId;
  currentChatUser = other;

  chatTitle.textContent =
    other.nickname || "Пользователь";

  chatHandle.textContent =
    other.username || "";

  showScreen("chat");

  const chatRef =
    ref(db,"chats/" + chatId);

  const snapshot =
    await get(chatRef);

  if(!snapshot.exists()){

    await set(chatRef,{
      participants:{
        [currentUser.uid]:true,
        [otherUid]:true
      },
      createdAt:serverTimestamp()
    });

  }

  listenMessages(chatId);

}


function makeChatId(a,b){

  return [a,b]
    .sort()
    .join("_");

}


/* =========================
   MESSAGES
========================= */

function listenMessages(chatId){

  if(unsubscribeMessages){
    unsubscribeMessages();
  }

  unsubscribeMessages =
    onValue(
      ref(db,
        "chats/" + chatId + "/messages"
      ),
      snapshot => {

        messagesBox.innerHTML = "";

        const data =
          snapshot.val() || {};

        const list =
          Object.values(data)
            .sort(
              (a,b) =>
                (a.createdAt || 0) -
                (b.createdAt || 0)
            );

        list.forEach(message => {

          const div =
            document.createElement("div");

          div.className =
            "message " +
            (
              message.senderId === currentUser.uid
              ? "mine"
              : "other"
            );

          div.textContent =
            message.text || "";

          messagesBox.appendChild(div);

        });

        messagesBox.scrollTop =
          messagesBox.scrollHeight;

      }
    );

}


/* =========================
   SEND MESSAGE
========================= */

messageForm.addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    const text =
      messageInput.value.trim();

    if(!text || !currentChatId){
      return;
    }

    if(text.length > 2000){
      return;
    }

    const messageRef =
      push(
        ref(
          db,
          "chats/" +
          currentChatId +
          "/messages"
        )
      );

    await set(messageRef,{
      text:text,
      senderId:currentUser.uid,
      createdAt:serverTimestamp()
    });

    messageInput.value = "";

    messageInput.focus();

  }
);


/* =========================
   NAVIGATION
========================= */

const navChats =
  document.getElementById("navChats");

const navUsers =
  document.getElementById("navUsers");

const navSettings =
  document.getElementById("navSettings");


navChats.onclick =
  () => showScreen("chats");

navUsers.onclick =
  () => showScreen("users");

navSettings.onclick =
  () => {

    loadProfile();
    showScreen("settings");

  };


function showScreen(screen){

  chatsScreen.classList.add("hidden");
  usersScreen.classList.add("hidden");
  chatScreen.classList.add("hidden");
  settingsScreen.classList.add("hidden");

  navChats.classList.remove("active");
  navUsers.classList.remove("active");
  navSettings.classList.remove("active");

  if(screen === "chats"){

    chatsScreen.classList.remove("hidden");
    navChats.classList.add("active");

  }

  if(screen === "users"){

    usersScreen.classList.remove("hidden");
    navUsers.classList.add("active");

    renderUsers();

  }

  if(screen === "settings"){

    settingsScreen.classList.remove("hidden");
    navSettings.classList.add("active");

  }

  if(screen === "chat"){

    chatScreen.classList.remove("hidden");

  }

}


/* =========================
   BACK FROM CHAT
========================= */

document.getElementById("backChat").onclick =
() => {

  if(unsubscribeMessages){
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  currentChatId = null;
  currentChatUser = null;

  showScreen("chats");

};


/* =========================
   LOGOUT
========================= */

document.getElementById("logoutButton").onclick =
async () => {

  await signOut(auth);

};


/* =========================
   STOP LISTENERS
========================= */

function stopListeners(){

  if(unsubscribeUsers){
    unsubscribeUsers();
    unsubscribeUsers = null;
  }

  if(unsubscribeChats){
    unsubscribeChats();
    unsubscribeChats = null;
  }

  if(unsubscribeMessages){
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

}


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function firebaseError(code){

  const errors = {

    "auth/email-already-in-use":
      "Этот Email уже зарегистрирован.",

    "auth/invalid-email":
      "Неверный Email.",

    "auth/weak-password":
      "Пароль слишком слабый.",

    "auth/invalid-credential":
      "Неверный Email или пароль.",

    "auth/user-not-found":
      "Пользователь не найден.",

    "auth/wrong-password":
      "Неверный пароль.",

    "auth/api-key-not-valid":
      "Firebase API key недействителен. Проверь конфигурацию Firebase."

  };

  return errors[code] ||
    "Ошибка: " + code;

}
