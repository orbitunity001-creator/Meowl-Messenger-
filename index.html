<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b18">
  <title>Meowl Messenger</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070914;
      --card: rgba(18, 21, 43, 0.78);
      --card2: rgba(25, 29, 58, 0.72);
      --border: rgba(255,255,255,0.09);
      --text: #f5f7ff;
      --muted: #9298b7;
      --purple: #9b5cff;
      --cyan: #31e6ff;
      --pink: #ff4fcf;
      --danger: #ff5d7d;
      --green: #48e6a4;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(155,92,255,.20), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(49,230,255,.15), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(255,79,207,.10), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
    }

    /* ================= AUTH ================= */

    #authScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px);
      box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        0 0 50px rgba(155,92,255,.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-cat {
      font-size: 58px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 18px rgba(155,92,255,.65));
    }

    .logo h1 {
      font-size: 30px;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo p {
      color: var(--muted);
      margin-top: 7px;
      font-size: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      background: rgba(0,0,0,.22);
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .tab {
      border: 0;
      padding: 12px;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
    }

    .tab.active {
      color: white;
      background: linear-gradient(
        135deg,
        rgba(155,92,255,.3),
        rgba(49,230,255,.16)
      );
      box-shadow: 0 0 18px rgba(155,92,255,.12);
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 7px 4px;
    }

    .field input,
    .field textarea,
    .search-input {
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 15px;
      background: rgba(5,7,18,.62);
      color: white;
      padding: 14px 15px;
      transition: .2s;
    }

    .field textarea {
      min-height: 95px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .search-input:focus {
      border-color: rgba(155,92,255,.65);
      box-shadow: 0 0 20px rgba(155,92,255,.10);
    }

    .main-btn {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 14px;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, var(--purple), #6e55ff);
      box-shadow: 0 10px 25px rgba(111,85,255,.20);
      transition: .2s;
    }

    .main-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(111,85,255,.30);
    }

    .error {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(255,93,125,.10);
      border: 1px solid rgba(255,93,125,.20);
      color: #ff9aae;
      font-size: 13px;
    }

    .success {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(72,230,164,.10);
      border: 1px solid rgba(72,230,164,.20);
      color: #7cf5c3;
      font-size: 13px;
    }

    /* ================= APP ================= */

    #appScreen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    #appScreen.active {
      display: flex;
    }

    .app-header {
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,9,20,.65);
      backdrop-filter: blur(20px);
    }

    .header-title {
      font-size: 21px;
      font-weight: 800;
    }

    .header-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .header-logo {
      font-size: 27px;
    }

    .content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .page {
      display: none;
      height: 100%;
      overflow-y: auto;
      padding: 18px;
      padding-bottom: 95px;
    }

    .page.active {
      display: block;
    }

    .search-wrap {
      margin-bottom: 15px;
    }

    .search-input {
      font-size: 14px;
    }

    /* ================= LISTS ================= */

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty {
      padding: 35px 15px;
      text-align: center;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .user-card,
    .chat-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px;
      border-radius: 19px;
      border: 1px solid var(--border);
      background: var(--card);
      color: white;
      text-align: left;
      transition: .2s;
    }

    .user-card:hover,
    .chat-card:hover {
      border-color: rgba(155,92,255,.35);
      transform: translateY(-1px);
      background: var(--card2);
    }

    .avatar {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      background:
        linear-gradient(
          135deg,
          rgba(155,92,255,.35),
          rgba(49,230,255,.18)
        );
      border: 1px solid rgba(255,255,255,.08);
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-name {
      font-weight: 700;
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-handle {
      color: var(--cyan);
      font-size: 13px;
      margin-top: 4px;
    }

    .user-desc {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .arrow {
      color: var(--muted);
      font-size: 19px;
    }

    /* ================= CHAT ================= */

    #chatPage {
      padding: 0;
      padding-bottom: 0;
      overflow: hidden;
      flex-direction: column;
    }

    #chatPage.active {
      display: flex;
    }

    .chat-top {
      height: 65px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,9,20,.65);
      backdrop-filter: blur(18px);
    }

    .back-btn {
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(255,255,255,.06);
      color: white;
      font-size: 21px;
    }

    .chat-person {
      min-width: 0;
      flex: 1;
    }

    .chat-person-name {
      font-weight: 800;
      font-size: 15px;
    }

    .chat-person-handle {
      color: var(--cyan);
      font-size: 12px;
      margin-top: 2px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-row {
      display: flex;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message {
      max-width: min(78%, 500px);
      padding: 10px 13px;
      border-radius: 17px;
      background: rgba(30,34,65,.9);
      border: 1px solid var(--border);
      word-break: break-word;
      line-height: 1.4;
      font-size: 14px;
    }

    .message-row.mine .message {
      background: linear-gradient(
        135deg,
        rgba(125,72,221,.82),
        rgba(83,81,219,.78)
      );
      border-color: rgba(155,92,255,.35);
    }

    .message-time {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      color: rgba(255,255,255,.48);
      text-align: right;
    }

    .message-input-area {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: rgba(7,9,20,.82);
      backdrop-filter: blur(18px);
    }

    .message-input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.30);
      color: white;
      outline: none;
      border-radius: 16px;
      padding: 12px 14px;
      max-height: 110px;
      resize: none;
    }

    .send-btn {
      width: 47px;
      height: 47px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      color: white;
      font-size: 20px;
      flex-shrink: 0;
    }

    /* ================= SETTINGS ================= */

    .settings-card {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 13px;
    }

    .settings-title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .account-email {
      color: var(--muted);
      font-size: 14px;
      word-break: break-all;
    }

    .username-row {
      display: flex;
      gap: 8px;
    }

    .username-row input {
      flex: 1;
    }

    .save-btn {
      border: 0;
      border-radius: 14px;
      padding: 0 15px;
      color: white;
      background: linear-gradient(135deg, var(--purple), #7056ff);
      font-weight: 700;
    }

    .logout-btn {
      width: 100%;
      border: 1px solid rgba(255,93,125,.25);
      background: rgba(255,93,125,.08);
      color: #ff91a7;
      border-radius: 15px;
      padding: 13px;
      font-weight: 700;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 7px;
      line-height: 1.4;
    }

    /* ================= NAV ================= */

    .bottom-nav {
      height: 76px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
      background: rgba(7,9,20,.78);
      backdrop-filter: blur(22px);
      padding: 7px 9px;
      gap: 7px;
    }

    .nav-btn {
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      transition: .2s;
    }

    .nav-icon {
      font-size: 21px;
    }

    .nav-btn.active {
      color: white;
      background: linear-gradient(
        135deg,
        rgba(155,92,255,.22),
        rgba(49,230,255,.10)
      );
      box-shadow: inset 0 0 20px rgba(155,92,255,.06);
    }

    /* ================= TOAST ================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      max-width: calc(100% - 30px);
      padding: 12px 17px;
      border-radius: 14px;
      background: rgba(20,23,45,.94);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 15px 45px rgba(0,0,0,.35);
      transition: .25s;
      font-size: 13px;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 520px) {
      .auth-card {
        padding: 22px;
      }

      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .message {
        max-width: 84%;
      }
    }
  </style>
</head>

<body>

  <!-- ================= AUTH ================= -->

  <section id="authScreen" class="screen">

    <div class="auth-card">

      <div class="logo">
        <div class="logo-cat">🐱</div>
        <h1>Meowl Messenger</h1>
        <p>Личные сообщения между людьми</p>
      </div>

      <div class="tabs">
        <button id="loginTab" class="tab active">Войти</button>
        <button id="registerTab" class="tab">Регистрация</button>
      </div>

      <form id="authForm">

        <div class="field">
          <label>Email</label>
          <input
            id="authEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label>Пароль</label>
          <input
            id="authPassword"
            type="password"
            placeholder="Минимум 6 символов"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="main-btn" type="submit" id="authSubmit">
          Войти
        </button>

        <div id="authMessage"></div>

      </form>

    </div>

  </section>


  <!-- ================= APP ================= -->

  <section id="appScreen" class="screen">

    <header class="app-header">
      <div>
        <div class="header-title" id="headerTitle">💬 Чаты</div>
        <div class="header-subtitle" id="headerSubtitle">
          Твои личные сообщения
        </div>
      </div>

      <div class="header-logo">🐱</div>
    </header>


    <main class="content">

      <!-- ================= CHATS ================= -->

      <section id="chatsPage" class="page active">

        <div class="search-wrap">
          <input
            id="chatSearch"
            class="search-input"
            type="text"
            placeholder="🔎 Найти чат по @username"
            autocomplete="off"
          >
        </div>

        <div id="chatList" class="list"></div>

      </section>


      <!-- ================= USERS ================= -->

      <section id="usersPage" class="page">

        <div class="search-wrap">
          <input
            id="userSearch"
            class="search-input"
            type="text"
            placeholder="🔎 Найти по @username"
            autocomplete="off"
          >
        </div>

        <div id="userList" class="list"></div>

      </section>


      <!-- ================= CHAT ================= -->

      <section id="chatPage" class="page">

        <div class="chat-top">

          <button class="back-btn" id="backFromChat">
            ←
          </button>

          <div class="avatar" id="chatAvatar">
            🐱
          </div>

          <div class="chat-person">
            <div class="chat-person-name" id="chatName">
              Пользователь
            </div>

            <div class="chat-person-handle" id="chatUsername">
              @username
            </div>
          </div>

        </div>

        <div id="messages" class="messages"></div>

        <form id="messageForm" class="message-input-area">

          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Напиши сообщение..."
            rows="1"
            maxlength="2000"
          ></textarea>

          <button class="send-btn" type="submit">
            ➤
          </button>

        </form>

      </section>


      <!-- ================= SETTINGS ================= -->

      <section id="settingsPage" class="page">

        <div class="settings-card">

          <div class="settings-title">
            👤 Аккаунт
          </div>

          <div class="account-email" id="accountEmail">
            —
          </div>

        </div>


        <div class="settings-card">

          <div class="settings-title">
            🪪 Профиль
          </div>

          <div class="field">
            <label>Никнейм</label>
            <input
              id="nicknameInput"
              type="text"
              maxlength="40"
              placeholder="Твой никнейм"
            >
          </div>


          <div class="field">

            <label>Уникальный @username</label>

            <div class="username-row">

              <input
                id="usernameInput"
                type="text"
                maxlength="21"
                placeholder="@username"
                autocomplete="off"
              >

              <button
                type="button"
                class="save-btn"
                id="saveUsernameBtn"
              >
                Сохранить
              </button>

            </div>

            <div class="hint">
              3–20 символов после @. Разрешены латинские буквы,
              цифры и символ _.
              Одинаковые username создать нельзя.
            </div>

          </div>


          <div class="field">
            <label>Описание</label>

            <textarea
              id="descriptionInput"
              maxlength="160"
              placeholder="Немного о себе..."
            ></textarea>
          </div>

          <button
            type="button"
            class="main-btn"
            id="saveProfileBtn"
          >
            Сохранить профиль
          </button>

          <div id="profileMessage"></div>

        </div>


        <div class="settings-card">

          <div class="settings-title">
            🚪 Аккаунт
          </div>

          <button
            type="button"
            class="logout-btn"
            id="logoutBtn"
          >
            Выйти из аккаунта
          </button>

        </div>

      </section>

    </main>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottom-nav">

      <button
        class="nav-btn active"
        data-page="chatsPage"
        data-title="💬 Чаты"
        data-subtitle="Твои личные сообщения"
      >
        <span class="nav-icon">💬</span>
        <span>Чаты</span>
      </button>

      <button
        class="nav-btn"
        data-page="usersPage"
        data-title="👥 Пользователи"
        data-subtitle="Все пользователи Meowl"
      >
        <span class="nav-icon">👥</span>
        <span>Пользователи</span>
      </button>

      <button
        class="nav-btn"
        data-page="settingsPage"
        data-title="⚙️ Настройки"
        data-subtitle="Профиль и аккаунт"
      >
        <span class="nav-icon">⚙️</span>
        <span>Настройки</span>
      </button>

    </nav>

  </section>


  <div id="toast"></div>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,

    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
      getDatabase,

    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    /* =====================================================
       FIREBASE CONFIG
       ===================================================== */

    const firebaseConfig = {

      authDomain: "meowl-messenger.firebaseapp.com",
      databaseURL: "https://meowl-messenger-default-rtdb.firebaseio.com",
      projectId: "meowl-messenger",

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);


    /* =====================================================
       STATE
       ===================================================== */

    let currentUser = null;

    let currentProfile = null;

    let allUsers = {};

    let allChats = {};

    let currentChatId = null;

    let currentChatUserId = null;

    let unsubscribeMessages = null;

    let authMode = "login";


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const authScreen = document.getElementById("authScreen");

    const appScreen = document.getElementById("appScreen");

    const authForm = document.getElementById("authForm");

    const authEmail = document.getElementById("authEmail");

    const authPassword = document.getElementById("authPassword");

    const authSubmit = document.getElementById("authSubmit");

    const authMessage = document.getElementById("authMessage");

    const loginTab = document.getElementById("loginTab");

    const registerTab = document.getElementById("registerTab");

    const headerTitle = document.getElementById("headerTitle");

    const headerSubtitle = document.getElementById("headerSubtitle");

    const chatList = document.getElementById("chatList");

    const userList = document.getElementById("userList");

    const chatSearch = document.getElementById("chatSearch");

    const userSearch = document.getElementById("userSearch");

    const chatPage = document.getElementById("chatPage");

    const messages = document.getElementById("messages");

    const chatName = document.getElementById("chatName");

    const chatUsername = document.getElementById("chatUsername");

    const messageForm = document.getElementById("messageForm");

    const messageInput = document.getElementById("messageInput");

    const backFromChat = document.getElementById("backFromChat");

    const accountEmail = document.getElementById("accountEmail");

    const usernameInput = document.getElementById("usernameInput");

    const nicknameInput = document.getElementById("nicknameInput");

    const descriptionInput = document.getElementById("descriptionInput");

    const saveUsernameBtn = document.getElementById("saveUsernameBtn");

    const saveProfileBtn = document.getElementById("saveProfileBtn");

    const profileMessage = document.getElementById("profileMessage");

    const logoutBtn = document.getElementById("logoutBtn");

    const toast = document.getElementById("toast");


    /* =====================================================
       HELPERS
       ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function showToast(text) {

      toast.textContent = text;

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);

    }


    function showAuthMessage(text, type = "error") {

      authMessage.innerHTML = `
        <div class="${type}">
          ${escapeHtml(text)}
        </div>
      `;

    }


    function showProfileMessage(text, type = "success") {

      profileMessage.innerHTML = `
        <div class="${type}">
          ${escapeHtml(text)}
        </div>
      `;

      setTimeout(() => {
        profileMessage.innerHTML = "";
      }, 3500);

    }


    function normalizeUsername(value) {

      let username = String(value || "")
        .trim()
        .toLowerCase();

      if (!username.startsWith("@")) {
        username = "@" + username;
      }

      return username;

    }


    function validUsername(username) {

      return /^@[a-z0-9_]{3,20}$/.test(username);

    }


    function usernameKey(username) {

      return normalizeUsername(username).replace("@", "");

    }


    function generateUsername(uid, attempt = 0) {

      const base = uid
        .replace(/[^a-z0-9]/gi, "")
        .toLowerCase()
        .slice(0, 10);

      const suffix = attempt > 0
        ? String(attempt)
        : "";

      return "@meow" + base + suffix;

    }


    function formatTime(timestamp) {

      if (!timestamp) {
        return "";
      }

      const date = new Date(timestamp);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });

    }


    function getUser(uid) {

      return allUsers[uid] || null;

    }


    function chatIdForUsers(uid1, uid2) {

      return [uid1, uid2]
        .sort()
        .join("_");

    }

    /* =====================================================
       AUTH
       ===================================================== */

    authForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = authEmail.value.trim();

      const password = authPassword.value;

      if (!email || !password) {
        return;
      }

          );

        } else {

            );

        }

      } catch (error) {

        console.error(error);

        showAuthMessage(firebaseError(error));

      } finally {

        authSubmit.disabled = false;

        authSubmit.textContent =
          authMode === "login"
            ? "Войти"
            : "Создать аккаунт";

    function firebaseError(error) {

      const code = error?.code || "";

      const map = {

        "auth/email-already-in-use":
          "Этот email уже зарегистрирован.",

        "auth/invalid-email":
          "Неверный email.",

        "auth/weak-password":
          "Пароль слишком слабый. Используй минимум 6 символов.",

        "auth/invalid-credential":
          "Неверный email или пароль.",

        "auth/user-not-found":
          "Пользователь не найден.",

        "auth/wrong-password":
          "Неверный пароль.",

        "auth/api-key-not-valid":
          "Firebase API key недействителен. Проверь конфигурацию Firebase.",

        "auth/network-request-failed":
          "Ошибка сети. Проверь интернет-соединение.",

        "permission-denied":
          "Firebase Security Rules запретили это действие."

      };

      return map[code] ||
        error?.message ||
        "Произошла неизвестная ошибка.";

    }


    /* =====================================================
       USERNAME INDEX
       ===================================================== */

    async function claimUsername(username, uid) {

      const key = usernameKey(username);

      const usernameRef =
        ref(db, "usernameIndex/" + key);

      const result = await runTransaction(
        usernameRef,
        current => {

          if (current === null) {
            return uid;
          }

          if (current === uid) {
            return current;
          }

          return;
        }
      );

      return result.committed;

    }


    /* =====================================================
       INITIAL PROFILE
       ===================================================== */

    async function createInitialProfile(user) {

      let username = "";

      let claimed = false;

      for (let attempt = 0; attempt < 100; attempt++) {

        username = generateUsername(
          user.uid,
          attempt
        );

        claimed = await claimUsername(
          username,
          user.uid
        );

        if (claimed) {
          break;
        }

      }

      if (!claimed) {

        await signOut(auth);

        throw new Error(
          "Не удалось автоматически создать уникальный username."
        );

      }


      const profile = {

        username: username,

        usernameLower: username,

        nickname:
          user.email?.split("@")[0] ||
          "Meowl User",

        nicknameLower:
          (
            user.email?.split("@")[0] ||
            "Meowl User"
          ).toLowerCase(),

        description: "",

        createdAt: serverTimestamp()

      };


      try {

        await set(
          ref(db, "users/" + user.uid),
          profile
        );

      } catch (error) {

        await remove(
          ref(
            db,
            "usernameIndex/" + usernameKey(username)
          )
        );

        throw error;
      }

    }

    /* =====================================================
       CURRENT PROFILE
       ===================================================== */

    async function loadCurrentProfile() {

      if (!currentUser) {
        return;
      }

      const snapshot =
        await get(
          ref(db, "users/" + currentUser.uid)
        );

      if (!snapshot.exists()) {

        await createInitialProfile(currentUser);

        const retry =
          await get(
            ref(db, "users/" + currentUser.uid)
          );

        currentProfile = retry.val();

      } else {

        currentProfile = snapshot.val();

      }


      usernameInput.value =
        currentProfile?.username || "";

      nicknameInput.value =
        currentProfile?.nickname || "";

      descriptionInput.value =
        currentProfile?.description || "";


      /*
        Если пользователь был создан старой версией приложения,
        пытаемся зарегистрировать его старый username в index.
      */

      if (
        currentProfile?.username &&
        currentUser
      ) {

        const oldUsername =
          normalizeUsername(
            currentProfile.username
          );

        if (validUsername(oldUsername)) {

          const claimed =
            await claimUsername(
              oldUsername,
              currentUser.uid
            );

          if (!claimed) {

            for (
              let attempt = 1;
              attempt < 100;
              attempt++
            ) {

              const newUsername =
                generateUsername(
                  currentUser.uid,
                  attempt
                );

              const ok =
                await claimUsername(
                  newUsername,
                  currentUser.uid
                );

              if (ok) {

                await update(
                  ref(
                    db,
                    "users/" + currentUser.uid
                  ),
                  {
                    username: newUsername,
                    usernameLower: newUsername
                  }
                );

                currentProfile.username =
                  newUsername;

                currentProfile.usernameLower =
                  newUsername;

                usernameInput.value =
                  newUsername;

                break;
              }

            }

          }

        }

      }

    }

      );

       USERS PAGE
       ===================================================== */

    function renderUsers() {

      if (!currentUser) {
        return;
      }

      const search =
        normalizeUsername(
          userSearch.value
        );

      const hasSearch =
        userSearch.value.trim().length > 0;


      let users =
        Object.entries(allUsers)
          .filter(([uid]) => uid !== currentUser.uid)
          .map(([uid, data]) => ({
            uid,
            ...data
          }));


      users.sort((a, b) => {

        const aa =
          (a.nickname || a.username || "")
            .toLowerCase();

        const bb =
          (b.nickname || b.username || "")
            .toLowerCase();

        return aa.localeCompare(bb);

      });


      if (hasSearch) {

        users =
          users.filter(user => {

            const username =
              normalizeUsername(
                user.username || ""
              );

            return username.startsWith(search);

          });

      }


      if (users.length === 0) {

        userList.innerHTML = `
          <div class="empty">
            <div class="empty-icon">
              ${hasSearch ? "🔎" : "👥"}

                hasSearch

                  : "Пока нет других пользователей"
              }
            </div>
          </div>
        `;

        return;

      }


      userList.innerHTML =
        users.map(user => `

          <button
            class="user-card"
            data-user-id="${escapeHtml(user.uid)}"
          >

            <div class="avatar">
              🐱
            </div>

            <div class="user-info">

              <div class="user-name">
                ${escapeHtml(
                  user.nickname ||
                  "Без имени"
                )}
              </div>

              <div class="user-handle">
                ${escapeHtml(
                  user.username ||
                  "@unknown"
                )}
              </div>

              ${
                user.description
                  ? `
                    <div class="user-desc">
                      ${escapeHtml(user.description)}
                    </div>
                  `
                  : ""
              }

            </div>

            <div class="arrow">
              ›
            </div>

        `).join("");

       CHATS REALTIME
       ===================================================== */

    function listenChats() {

      if (!currentUser) {
        return;
      }

      onValue(
        ref(db, "chats"),
        snapshot => {

          allChats = snapshot.val() || {};

          renderChats();

    /* =====================================================
       CHAT LIST
       ===================================================== */

    function renderChats() {

      if (!currentUser) {
        return;
      }


      const search =
        normalizeUsername(
          chatSearch.value
        );


      let chats =
        Object.entries(allChats)
          .filter(([chatId, chat]) => {

            return (
              chat &&
              chat.participants &&
              chat.participants[currentUser.uid] === true
            );

          })
          .map(([chatId, chat]) => {

            const otherUid =
              Object.keys(
                chat.participants || {}
              ).find(
                uid => uid !== currentUser.uid
              );

            return {
              chatId,
              chat,
              otherUid,
              otherUser:
                otherUid
                  ? getUser(otherUid)
                  : null
            };

          })
          .filter(item => item.otherUser);


      if (chatSearch.value.trim()) {

        chats =
          chats.filter(item => {

            const username =
              normalizeUsername(
                item.otherUser.username || ""
              );

            return username.startsWith(search);

          });

      }


      chats.sort((a, b) => {

        const aa =
          a.chat.updatedAt || 0;

        const bb =
          b.chat.updatedAt || 0;

        return bb - aa;

      });


      if (chats.length === 0) {

        chatList.innerHTML = `
          <div class="empty">
            <div class="empty-icon">
              💬
            </div>

            <div>
              ${
                chatSearch.value.trim()
                  ? "Чат не найден"
                  : "Пока нет чатов"
              }
            </div>

            <div style="margin-top:7px;font-size:12px;">
              Открой «Пользователи» и выбери человека
            </div>
          </div>
        `;

        return;

      }


      chatList.innerHTML =
        chats.map(item => {

          const user = item.otherUser;

          return `

            <button
              class="chat-card"
              data-chat-user="${escapeHtml(item.otherUid)}"
            >

              <div class="avatar">
                🐱
              </div>

              <div class="user-info">

                <div class="user-name">
                  ${escapeHtml(
                    user.nickname ||
                    "Без имени"
                  )}
                </div>

                <div class="user-handle">
                  ${escapeHtml(
                    user.username ||
                    "@unknown"
                  )}
                </div>

              </div>

              <div class="arrow">
                ›
              </div>

            </button>

          `;

        }).join("");


      chatList
        .querySelectorAll("[data-chat-user]")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              openChatWithUser(
                button.dataset.chatUser
              );

            }
          );

        });

    }


    chatSearch.addEventListener(
      "input",
      renderChats
    );


    /* =====================================================
       OPEN CHAT
       ===================================================== */

    async function openChatWithUser(uid) {

      if (!currentUser || uid === currentUser.uid) {
        return;
      }

      const user = getUser(uid);

      if (!user) {

        showToast(
          "Пользователь не найден"
        );

        return;

      }


      const chatId =
        chatIdForUsers(
          currentUser.uid,
          uid
        );


      currentChatId = chatId;

      currentChatUserId = uid;


      chatName.textContent =
        user.nickname ||
        "Без имени";

      chatUsername.textContent =
        user.username ||
        "";


      try {

        const chatRef =
          ref(db, "chats/" + chatId);

        const existing =
          await get(chatRef);


        if (!existing.exists()) {

          await set(
            chatRef,
            {
              participants: {
                [currentUser.uid]: true,
                [uid]: true
              },

              createdAt:
                serverTimestamp(),

              updatedAt:
                serverTimestamp()
            }
          );

        }


        openChatPage();

        listenMessages(chatId);

      } catch (error) {

        console.error(error);

        showToast(
          "Не удалось открыть чат: " +
          firebaseError(error)
        );

      }

    }

    /* =====================================================
       MESSAGES
       ===================================================== */

    function listenMessages(chatId) {

      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
      }


      const messagesRef =
        ref(
          db,
          "chats/" +
          chatId +
          "/messages"
        );


      unsubscribeMessages =
        onValue(
          messagesRef,
          snapshot => {

            const data =
              snapshot.val() || {};


            const list =
              Object.entries(data)
                .map(([id, message]) => ({
                  id,
                  ...message
                }))
                .sort(
                  (a, b) =>
                    (a.createdAt || 0) -
                    (b.createdAt || 0)
                );


            if (list.length === 0) {

              messages.innerHTML = `
                <div class="empty">
                  <div class="empty-icon">
                    🐱
                  </div>

                  <div>
                    Напиши первое сообщение
                  </div>
                </div>
              `;

              return;

            }


            messages.innerHTML =
              list.map(message => {

                const mine =
                  message.senderId ===
                  currentUser.uid;


                return `

                  <div
                    class="message-row ${
                      mine ? "mine" : ""
                    }"
                  >

                    <div class="message">

                      <div>
                        ${escapeHtml(
                          message.text
                        )}
                      </div>

                      <span class="message-time">
                        ${formatTime(
                          message.createdAt
                        )}
                      </span>

                    </div>

                  </div>

                `;

              }).join("");


            messages.scrollTop =
              messages.scrollHeight;

          },
          error => {

            console.error(error);

            showToast(
              "Не удалось загрузить сообщения"
            );

          }
        );

    }

    /* =====================================================
       SAVE USERNAME
       ===================================================== */

    saveUsernameBtn.addEventListener(
      "click",
      async () => {

        if (!currentUser) {
          return;
        }


        const newUsername =
          normalizeUsername(
            usernameInput.value
          );


        if (!validUsername(newUsername)) {

          showProfileMessage(
            "Username должен выглядеть так: @meowl_123",
            "error"
          );

          return;

        }


        const oldUsername =
          normalizeUsername(
            currentProfile?.username || ""
          );


        if (newUsername === oldUsername) {

          showProfileMessage(
            "Username уже такой.",
            "success"
          );

          return;

        }


        saveUsernameBtn.disabled = true;

        saveUsernameBtn.textContent =
          "Проверяем...";


        try {

          const claimed =
            await claimUsername(
              newUsername,
              currentUser.uid
            );


          if (!claimed) {

            showProfileMessage(
              "Этот @username уже занят.",
              "error"
            );

            return;

          }


          try {

            await update(
              ref(
                db,
                "users/" +
                currentUser.uid
              ),
              {
                username: newUsername,
                usernameLower: newUsername
              }
            );

          } catch (profileError) {

            await remove(
              ref(
                db,
                "usernameIndex/" +
                usernameKey(newUsername)
              )
            );

            throw profileError;

          }


          if (
            oldUsername &&
            validUsername(oldUsername)
          ) {

            await remove(
              ref(
                db,
                "usernameIndex/" +
                usernameKey(oldUsername)
              )
            );

          }


          currentProfile.username =
            newUsername;

          currentProfile.usernameLower =
            newUsername;

          usernameInput.value =
            newUsername;


          showProfileMessage(
            "Username успешно изменён.",
            "success"
          );


          showToast(
            "Новый @username сохранён"
          );


        } catch (error) {

          console.error(error);

          showProfileMessage(
            firebaseError(error),
            "error"
          );

        } finally {

          saveUsernameBtn.disabled = false;

          saveUsernameBtn.textContent =
            "Сохранить";

        }

      }
    );


    /* =====================================================
       SAVE PROFILE
       ===================================================== */

    saveProfileBtn.addEventListener(
      "click",
      async () => {

        if (!currentUser) {
          return;
        }


        const nickname =
          nicknameInput.value.trim()
            .slice(0, 40);


        const description =
          descriptionInput.value.trim()
            .slice(0, 160);


        try {

          await update(
            ref(
              db,
              "users/" +
              currentUser.uid
            ),
            {
              nickname:
                nickname ||
                currentProfile?.username ||
                "Meowl User",

              nicknameLower:
                (
                  nickname ||
                  currentProfile?.username ||
                  "Meowl User"
                ).toLowerCase(),

              description:
                description
            }
          );


          currentProfile.nickname =
            nickname;

          currentProfile.nicknameLower =
            nickname.toLowerCase();

          currentProfile.description =
            description;


          showProfileMessage(
            "Профиль сохранён.",
            "success"
          );


          showToast(
            "Профиль обновлён"
          );

        } catch (error) {

          console.error(error);

          showProfileMessage(
            firebaseError(error),
            "error"
          );

        }

      }
    );


    /* =====================================================
       LOGOUT
       ===================================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

          authEmail.value = "";

          authPassword.value = "";

          authMessage.innerHTML = "";

          showToast(
            "Ты вышел из аккаунта"
          );

        } catch (error) {

          console.error(error);

          showToast(
            firebaseError(error)
          );

        }

      }
    );


    /* =====================================================
       START
       ===================================================== */

    console.log(
      "Meowl Messenger started"
    );

  </script>

</body>
</html>
