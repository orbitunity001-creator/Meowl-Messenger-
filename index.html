<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Meowl Messenger</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: white;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(139, 92, 246, .25),
      transparent 32%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(34, 211, 238, .15),
      transparent 30%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(168, 85, 247, .12),
      transparent 35%
    ),
    #08090e;
}

body {
  overflow: hidden;
}

button,
input,
textarea {
  font: inherit;
}

button {
  border: 0;
  outline: none;
}

.hidden {
  display: none !important;
}


/* =====================================================
   LOADER
===================================================== */

#loader {
  position: fixed;
  inset: 0;

  z-index: 999;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #08090e;
}

.loader-logo {
  font-size: 32px;
  font-weight: 800;

  background:
    linear-gradient(
      90deg,
      #a855f7,
      #22d3ee
    );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  animation: loaderPulse 1.2s infinite alternate;
}

@keyframes loaderPulse {

  from {
    opacity: .4;
    transform: scale(.95);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}


/* =====================================================
   AUTH
===================================================== */

#authScreen {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.auth-card {

  width: 100%;
  max-width: 430px;

  padding: 28px;

  border-radius: 30px;

  background:
    rgba(18, 20, 29, .76);

  border:
    1px solid
    rgba(255,255,255,.09);

  box-shadow:
    0 0 60px rgba(139,92,246,.12),
    inset 0 1px 0 rgba(255,255,255,.06);

  backdrop-filter: blur(25px);
}

.logo {

  text-align: center;

  font-size: 34px;
  font-weight: 900;

  background:
    linear-gradient(
      90deg,
      #a855f7,
      #22d3ee
    );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  margin-bottom: 7px;
}

.logo-subtitle {

  text-align: center;

  color: #858b9e;

  margin-bottom: 25px;
}

.auth-tabs {

  display: flex;

  gap: 8px;

  margin-bottom: 18px;
}

.auth-tab {

  flex: 1;

  padding: 13px;

  color: #858b9e;

  background:
    rgba(255,255,255,.045);

  border-radius: 15px;
}

.auth-tab.active {

  color: white;

  background:
    linear-gradient(
      135deg,
      rgba(168,85,247,.42),
      rgba(34,211,238,.22)
    );

  box-shadow:
    0 0 20px
    rgba(168,85,247,.08);
}

.input {

  width: 100%;

  padding: 15px 16px;

  margin-bottom: 12px;

  border-radius: 16px;

  color: white;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid
    rgba(255,255,255,.08);

  outline: none;
}

.input::placeholder {
  color: #696f81;
}

.input:focus {

  border-color:
    rgba(168,85,247,.55);

  box-shadow:
    0 0 20px
    rgba(168,85,247,.1);
}

.main-button {

  width: 100%;

  padding: 15px;

  border-radius: 16px;

  color: white;

  font-weight: 800;

  background:
    linear-gradient(
      135deg,
      #9333ea,
      #06b6d4
    );

  box-shadow:
    0 10px 30px
    rgba(124,58,237,.2);
}

.error {

  min-height: 20px;

  margin-top: 12px;

  text-align: center;

  color: #ff6b81;

  font-size: 14px;
}


/* =====================================================
   APP
===================================================== */

#app {

  width: 100%;
  height: 100%;

  display: flex;
  flex-direction: column;
}

.topbar {

  height: 70px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  padding:
    0 18px;

  background:
    rgba(8,9,14,.72);

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

  backdrop-filter:
    blur(22px);
}

.top-title {

  font-size: 21px;

  font-weight: 800;
}

.top-subtitle {

  margin-top: 3px;

  color: #72788b;

  font-size: 12px;
}

.content {

  flex: 1;

  overflow-y: auto;

  padding:
    18px;

  padding-bottom:
    100px;
}

.page {

  width: 100%;

  max-width: 700px;

  margin: 0 auto;
}


/* =====================================================
   HOME
===================================================== */

.hero {

  position: relative;

  overflow: hidden;

  padding: 26px;

  border-radius: 28px;

  background:
    linear-gradient(
      135deg,
      rgba(168,85,247,.18),
      rgba(34,211,238,.08)
    );

  border:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 0 45px
    rgba(139,92,246,.08);
}

.hero::after {

  content: "";

  position: absolute;

  width: 150px;
  height: 150px;

  right: -50px;
  top: -50px;

  border-radius: 50%;

  background:
    rgba(34,211,238,.09);

  filter: blur(10px);
}

.hero h1 {

  position: relative;

  margin: 0 0 10px;

  font-size: 29px;

  z-index: 1;
}

.hero p {

  position: relative;

  margin: 0;

  color: #999fb0;

  line-height: 1.55;

  z-index: 1;
}

.home-grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 12px;

  margin-top: 18px;
}

.home-card {

  min-height: 125px;

  padding: 18px;

  text-align: left;

  color: white;

  border-radius: 23px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.07);

  transition: .2s;
}

.home-card:active {
  transform: scale(.97);
}

.home-icon {

  font-size: 28px;

  margin-bottom: 12px;
}

.home-card-title {

  font-size: 16px;

  font-weight: 800;

  margin-bottom: 5px;
}

.home-card-text {

  color: #777d90;

  font-size: 12px;

  line-height: 1.4;
}


/* =====================================================
   SECTION
===================================================== */

.section-title {

  margin:
    25px 4px 12px;

  color: #9298aa;

  font-size: 13px;

  text-transform: uppercase;

  letter-spacing: .7px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-container {

  position: relative;

  margin-bottom: 17px;
}

.search-icon {

  position: absolute;

  left: 17px;
  top: 50%;

  transform:
    translateY(-50%);

  font-size: 19px;

  opacity: .7;
}

.search-input {

  width: 100%;

  padding:
    16px 16px 16px 48px;

  color: white;

  outline: none;

  border-radius: 18px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid
    rgba(255,255,255,.08);
}

.search-input::placeholder {
  color: #686e80;
}

.search-input:focus {

  border-color:
    rgba(34,211,238,.5);

  box-shadow:
    0 0 25px
    rgba(34,211,238,.08);
}


/* =====================================================
   PEOPLE
===================================================== */

.person-card {

  width: 100%;

  display: flex;

  align-items: center;

  gap: 13px;

  padding: 15px;

  margin-bottom: 10px;

  text-align: left;

  color: white;

  border-radius: 21px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.07);

  transition: .2s;
}

.person-card:active {

  transform:
    scale(.98);
}

.person-card:hover {

  background:
    rgba(168,85,247,.07);

  border-color:
    rgba(168,85,247,.25);
}

.avatar {

  width: 53px;
  height: 53px;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  font-size: 22px;

  font-weight: 800;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #06b6d4
    );

  box-shadow:
    0 0 22px
    rgba(124,58,237,.2);
}

.person-info {

  flex: 1;

  min-width: 0;
}

.person-name {

  font-size: 16px;

  font-weight: 800;

  margin-bottom: 4px;
}

.person-username {

  color: #22d3ee;

  font-size: 13px;
}

.person-description {

  margin-top: 5px;

  color: #777d8f;

  font-size: 12px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.person-arrow {

  color: #6d7283;

  font-size: 24px;
}

.empty {

  padding:
    45px 20px;

  text-align: center;

  color: #71778a;

  line-height: 1.5;
}


/* =====================================================
   PROFILE
===================================================== */

.profile-card {

  padding:
    28px 20px;

  text-align: center;

  border-radius: 28px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.08);

  box-shadow:
    0 0 40px
    rgba(168,85,247,.06);
}

.big-avatar {

  width: 92px;
  height: 92px;

  margin:
    0 auto 16px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  font-size: 38px;

  font-weight: 900;

  background:
    linear-gradient(
      135deg,
      #9333ea,
      #06b6d4
    );

  box-shadow:
    0 0 35px
    rgba(147,51,234,.28);
}

.profile-name {

  font-size: 25px;

  font-weight: 900;
}

.profile-username {

  margin-top: 6px;

  color: #22d3ee;
}

.profile-description {

  max-width: 500px;

  margin:
    16px auto 0;

  color: #9096a8;

  line-height: 1.5;
}

.profile-button-row {

  display: flex;

  gap: 10px;

  margin-top: 22px;
}

.secondary-button {

  flex: 1;

  padding: 14px;

  color: white;

  border-radius: 16px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.08);
}

.write-button {

  flex: 1;

  padding: 14px;

  color: white;

  font-weight: 800;

  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      #9333ea,
      #06b6d4
    );
}


/* =====================================================
   EDIT PROFILE
===================================================== */

.edit-card {

  margin-top: 16px;

  padding: 20px;

  border-radius: 24px;

  background:
    rgba(255,255,255,.04);

  border:
    1px solid
    rgba(255,255,255,.07);
}

.textarea {

  width: 100%;

  min-height: 100px;

  resize: none;

  padding: 15px;

  margin-bottom: 10px;

  color: white;

  outline: none;

  border-radius: 16px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid
    rgba(255,255,255,.08);
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav {

  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 78px;

  z-index: 100;

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  background:
    rgba(8,9,14,.9);

  border-top:
    1px solid
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(24px);
}

.nav-button {

  position: relative;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 4px;

  color: #676d80;

  background: transparent;

  font-size: 11px;
}

.nav-icon {

  font-size: 21px;

  transition: .2s;
}

.nav-button.active {

  color: white;
}

.nav-button.active .nav-icon {

  filter:
    drop-shadow(
      0 0 8px
      rgba(168,85,247,.9)
    );
}

.nav-badge {

  position: absolute;

  top: 8px;

  right:
    calc(50% - 26px);

  min-width: 18px;
  height: 18px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0 5px;

  border-radius: 20px;

  background: #ff3b72;

  color: white;

  font-size: 10px;

  font-weight: 900;
}


/* =====================================================
   TOAST
===================================================== */

#toast {

  position: fixed;

  left: 50%;
  bottom: 95px;

  transform:
    translateX(-50%)
    translateY(20px);

  z-index: 300;

  max-width: calc(100% - 40px);

  padding:
    13px 18px;

  border-radius: 16px;

  color: white;

  background:
    rgba(24,26,37,.94);

  border:
    1px solid
    rgba(255,255,255,.1);

  box-shadow:
    0 10px 40px
    rgba(0,0,0,.35);

  opacity: 0;

  pointer-events: none;

  transition: .25s;
}

#toast.show {

  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 420px) {

  .auth-card {
    padding: 22px;
  }

  .logo {
    font-size: 30px;
  }

  .home-grid {
    gap: 9px;
  }

  .home-card {
    min-height: 115px;
    padding: 15px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     LOADER
===================================================== -->

<div id="loader">
  <div class="loader-logo">
    🐱 Meowl
  </div>
</div>


<!-- =====================================================
     AUTH
===================================================== -->

<section id="authScreen" class="hidden">

  <div class="auth-card">

    <div class="logo">
      🐱 Meowl Messenger
    </div>

    <div class="logo-subtitle">
      Общайся красиво
    </div>


    <div class="auth-tabs">

      <button
        id="loginTab"
        class="auth-tab active"
      >
        Войти
      </button>

      <button
        id="registerTab"
        class="auth-tab"
      >
        Регистрация
      </button>

    </div>


    <input
      id="emailInput"
      class="input"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >


    <input
      id="passwordInput"
      class="input"
      type="password"
      placeholder="Пароль"
      autocomplete="current-password"
    >


    <div
      id="registerFields"
      class="hidden"
    >

      <input
        id="usernameInput"
        class="input"
        type="text"
        maxlength="20"
        placeholder="Username"
        autocomplete="off"
      >

      <input
        id="nicknameInput"
        class="input"
        type="text"
        maxlength="50"
        placeholder="Имя / никнейм"
        autocomplete="off"
      >

    </div>


    <button
      id="authButton"
      class="main-button"
    >
      Войти
    </button>


    <div
      id="authError"
      class="error"
    ></div>

  </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<section
  id="app"
  class="hidden"
>


  <header class="topbar">

    <div>

      <div
        id="topTitle"
        class="top-title"
      >
        Meowl
      </div>

      <div
        id="topSubtitle"
        class="top-subtitle"
      >
        Messenger
      </div>

    </div>

  </header>


  <main
    id="content"
    class="content"
  ></main>


  <!-- ===================================================
       BOTTOM NAV
  =================================================== -->

  <nav class="bottom-nav">


    <button
      class="nav-button active"
      data-page="home"
    >

      <span class="nav-icon">
        🏠
      </span>

      <span>
        Главная
      </span>

    </button>


    <button
      class="nav-button"
      data-page="chats"
    >

      <span class="nav-icon">
        💬
      </span>

      <span>
        Чаты
      </span>

      <span
        id="chatBadge"
        class="nav-badge hidden"
      >
        0
      </span>

    </button>


    <button
      class="nav-button"
      data-page="people"
    >

      <span class="nav-icon">
        👥
      </span>

      <span>
        Люди
      </span>

    </button>


    <button
      class="nav-button"
      data-page="profile"
    >

      <span class="nav-icon">
        👤
      </span>

      <span>
        Профиль
      </span>

    </button>


  </nav>

</section>


<div id="toast"></div>


<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  set,
  query,
  orderByChild,
  equalTo
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDUu20AAahXFB57envRSAFIDa9H6YKIMg",

  authDomain:
    "meowl-messenger.firebaseapp.com",

  databaseURL:
    "https://meowl-messenger-default-rtdb.firebaseio.com",

  projectId:
    "meowl-messenger",

  storageBucket:
    "meowl-messenger.firebasestorage.app",

  messagingSenderId:
    "228165699456",

  appId:
    "1:228165699456:web:a33dfc849a553c01a36365",

  measurementId:
    "G-WBJM9L18VH"

};


const firebaseApp =
  initializeApp(firebaseConfig);


const auth =
  getAuth(firebaseApp);


const db =
  getDatabase(firebaseApp);


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let currentProfile = null;

let registerMode = false;

let currentPage = "home";

let selectedPerson = null;


/* =====================================================
   DOM
===================================================== */

const loader =
  document.getElementById("loader");

const authScreen =
  document.getElementById("authScreen");

const app =
  document.getElementById("app");

const content =
  document.getElementById("content");

const topTitle =
  document.getElementById("topTitle");

const topSubtitle =
  document.getElementById("topSubtitle");

const authButton =
  document.getElementById("authButton");

const authError =
  document.getElementById("authError");

const loginTab =
  document.getElementById("loginTab");

const registerTab =
  document.getElementById("registerTab");

const registerFields =
  document.getElementById("registerFields");


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {

  return String(value ?? "")

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


function normalizeUsername(value) {

  return String(value || "")

    .trim()

    .toLowerCase()

    .replace(/^@/, "");

}


function validUsername(username) {

  return /^[a-z0-9_]{3,20}$/
    .test(username);

}


function getAvatarLetter(profile) {

  return (
    profile?.nickname ||
    profile?.username ||
    "?"
  )
    .charAt(0)
    .toUpperCase();

}


function showToast(text) {

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  }, 2200);

}


/* =====================================================
   AUTH TABS
===================================================== */

loginTab.onclick = () => {

  registerMode = false;

  loginTab.classList.add("active");

  registerTab.classList.remove("active");

  registerFields.classList.add("hidden");

  authButton.textContent = "Войти";

  authError.textContent = "";

};


registerTab.onclick = () => {

  registerMode = true;

  registerTab.classList.add("active");

  loginTab.classList.remove("active");

  registerFields.classList.remove("hidden");

  authButton.textContent =
    "Создать аккаунт";

  authError.textContent = "";

};


/* =====================================================
   LOGIN / REGISTER
===================================================== */

authButton.onclick = async () => {

  authError.textContent = "";

  const email =
    document
      .getElementById("emailInput")
      .value
      .trim();

  const password =
    document
      .getElementById("passwordInput")
      .value;


  if (!email || !password) {

    authError.textContent =
      "Введите email и пароль.";

    return;

  }


  authButton.disabled = true;


  try {


    /* =========================================
       REGISTER
    ========================================= */

    if (registerMode) {

      const username =
        normalizeUsername(
          document
            .getElementById("usernameInput")
            .value
        );


      const nickname =
        document
          .getElementById("nicknameInput")
          .value
          .trim();


      if (!validUsername(username)) {

        throw new Error(
          "Username: 3–20 символов, только a-z, 0-9 и _."
        );

      }


      if (!nickname) {

        throw new Error(
          "Введите имя или никнейм."
        );

      }


      /* Проверяем username */

      const usernameSnapshot =
        await get(
          ref(
            db,
            "usernameIndex/" +
            username
          )
        );


      if (usernameSnapshot.exists()) {

        throw new Error(
          "Этот username уже занят."
        );

      }


      /* Создаём аккаунт */

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const uid =
        credential.user.uid;


      /* Индекс username */

      await set(
        ref(
          db,
          "usernameIndex/" +
          username
        ),
        uid
      );


      /* Профиль */

      await set(
        ref(
          db,
          "users/" +
          uid
        ),
        {

          username:
            username,

          usernameLower:
            username,

          nickname:
            nickname,

          nicknameLower:
            nickname.toLowerCase(),

          description:
            "",

          createdAt:
            Date.now()

        }
      );


      currentProfile = {

        username,
        usernameLower: username,
        nickname,
        nicknameLower: nickname.toLowerCase(),
        description: "",
        createdAt: Date.now()

      };


    }


    /* =========================================
       LOGIN
    ========================================= */

    else {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }


  } catch (error) {

    console.error(error);

    authError.textContent =
      getFirebaseError(error);

  } finally {

    authButton.disabled = false;

  }

};


/* =====================================================
   FIREBASE ERRORS
===================================================== */

function getFirebaseError(error) {

  const code =
    error?.code || "";


  if (
    code === "auth/invalid-credential" ||
    code === "auth/wrong-password" ||
    code === "auth/user-not-found"
  ) {

    return "Неверный email или пароль.";

  }


  if (
    code === "auth/email-already-in-use"
  ) {

    return "Этот email уже зарегистрирован.";

  }


  if (
    code === "auth/weak-password"
  ) {

    return "Пароль должен быть минимум 6 символов.";

  }


  if (
    code === "auth/invalid-email"
  ) {

    return "Неверный email.";

  }


  return (
    error?.message ||
    "Произошла ошибка."
  );

}


/* =====================================================
   LOAD MY PROFILE
===================================================== */

async function loadMyProfile() {

  if (!currentUser) return;


  const profileSnapshot =
    await get(
      ref(
        db,
        "users/" +
        currentUser.uid
      )
    );


  if (profileSnapshot.exists()) {

    currentProfile =
      profileSnapshot.val();

    return;

  }


  /*
    Если аккаунт был создан раньше,
    создаём профиль автоматически.
  */

  let baseUsername =
    normalizeUsername(
      currentUser.email
        ?.split("@")[0] ||
      "user"
    );


  baseUsername =
    baseUsername
      .replace(
        /[^a-z0-9_]/g,
        ""
      )
      .slice(0, 20);


  if (baseUsername.length < 3) {

    baseUsername =
      "user" +
      Math.floor(
        1000 +
        Math.random() * 9000
      );

  }


  let username =
    baseUsername;

  let number = 1;


  while (true) {

    const exists =
      await get(
        ref(
          db,
          "usernameIndex/" +
          username
        )
      );


    if (!exists.exists()) {
      break;
    }


    username =
      (
        baseUsername
          .slice(0, 17) +
        number
      );

    number++;

  }


  const nickname =
    currentUser.email
      ?.split("@")[0] ||
    "Meowl User";


  await set(
    ref(
      db,
      "usernameIndex/" +
      username
    ),
    currentUser.uid
  );


  await set(
    ref(
      db,
      "users/" +
      currentUser.uid
    ),
    {

      username,

      usernameLower:
        username,

      nickname,

      nicknameLower:
        nickname.toLowerCase(),

      description: "",

      createdAt:
        Date.now()

    }
  );


  currentProfile = {

    username,

    usernameLower:
      username,

    nickname,

    nicknameLower:
      nickname.toLowerCase(),

    description: "",

    createdAt:
      Date.now()

  };

}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;


    if (user) {

      try {

        await loadMyProfile();

        authScreen
          .classList
          .add("hidden");

        app
          .classList
          .remove("hidden");

        loader
          .classList
          .add("hidden");

        showPage("home");

      } catch (error) {

        console.error(error);

        loader
          .classList
          .add("hidden");

        authScreen
          .classList
          .remove("hidden");

        app
          .classList
          .add("hidden");

      }

    } else {

      currentProfile = null;

      app
        .classList
        .add("hidden");

      authScreen
        .classList
        .remove("hidden");

      loader
        .classList
        .add("hidden");

    }

  }
);

/* =====================================================
   SEARCH PEOPLE
===================================================== */

async function searchPeople(value) {

  const username =
    normalizeUsername(value);


  const results =
    document.getElementById(
      "peopleResults"
    );


  if (!results) return;


  if (!username) {

    results.innerHTML = `

      <div class="empty">

        👥

        <br><br>

        Введи username человека.

      </div>

    `;

    return;

  }


  if (!/^[a-z0-9_]{1,20}$/.test(username)) {

    results.innerHTML = `

      <div class="empty">

        ❌

        <br><br>

        Используй только:
        a-z, 0-9 и _

      </div>

    `;

    return;

  }


  results.innerHTML = `

    <div class="empty">

      🔎 Ищу
      <b>@${escapeHTML(username)}</b>...

    </div>

  `;


  try {


    /*
      Ищем пользователей
      по usernameLower.
    */

    const peopleQuery =
      query(
        ref(db, "users"),
        orderByChild("usernameLower"),
        equalTo(username)
      );


    const snapshot =
      await get(peopleQuery);


    if (!snapshot.exists()) {

      results.innerHTML = `

        <div class="empty">

          😿

          <br><br>

          Пользователь
          <b>
            @${escapeHTML(username)}
          </b>

          <br>

          не найден.

        </div>

      `;

      return;

    }


    let found = [];


    snapshot.forEach(
      child => {

        found.push({

          uid:
            child.key,

          ...child.val()

        });

      }
    );


    /*
      Не показываем себя
    */

    found =
      found.filter(
        person =>
          person.uid !==
          currentUser?.uid
      );


    if (!found.length) {

      results.innerHTML = `

        <div class="empty">

          👤

          <br><br>

          Это твой собственный username.

        </div>

      `;

      return;

    }


    results.innerHTML =
      found
        .map(personHTML)
        .join("");


    found.forEach(
      person => {

        const button =
          document.querySelector(
            `[data-user-id="${person.uid}"]`
          );


        if (button) {

          button.onclick = () => {

            openPerson(
              person
            );

          };

        }

      }
    );


  } catch (error) {

    console.error(error);


    results.innerHTML = `

      <div class="empty">

        ❌

        <br><br>

        Ошибка поиска.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}

/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile() {

  if (!currentUser) return;


  const nickname =
    document
      .getElementById(
        "editNickname"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "editDescription"
      )
      .value
      .trim();


  if (!nickname) {

    showToast(
      "Введите имя"
    );

    return;

  }


  try {

    await set(
      ref(
        db,
        "users/" +
        currentUser.uid
      ),
      {

        ...currentProfile,

        nickname,

        nicknameLower:
          nickname.toLowerCase(),

        description

      }
    );


    currentProfile = {

      ...currentProfile,

      nickname,

      nicknameLower:
        nickname.toLowerCase(),

      description

    };


    showToast(
      "✓ Профиль сохранён"
    );


    setTimeout(
      () => {

        renderProfile();

      },
      400
    );


  } catch (error) {

    console.error(error);

    showToast(
      "Ошибка сохранения"
    );

  }

}
