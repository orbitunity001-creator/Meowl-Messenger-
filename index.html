<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meowl Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ВХОД -->
    <section id="authScreen" class="screen">

        <div class="auth-card">

            <div class="logo">M</div>

            <h1>Meowl Messenger</h1>

            <p class="subtitle">Общайся с друзьями</p>

            <div class="tabs">
                <button id="loginTab" class="tab active">Войти</button>
                <button id="registerTab" class="tab">Регистрация</button>
            </div>

            <form id="authForm">

                <input id="email"
                       type="email"
                       placeholder="Email"
                       required>

                <input id="password"
                       type="password"
                       placeholder="Пароль"
                       minlength="6"
                       required>

                <button type="submit" class="main-button">
                    Войти
                </button>

            </form>

            <p id="errorMessage" class="error"></p>

        </div>

    </section>


    <!-- МЕССЕНДЖЕР -->
    <section id="chatScreen" class="screen hidden">

        <header class="header">

            <div>
                <h2 id="pageTitle">Чаты</h2>
                <span id="userEmail"></span>
            </div>

            <button id="logoutButton" class="logout">
                Выйти
            </button>

        </header>


        <!-- ЧАТЫ -->
        <main id="chatsPage" class="page">

            <div class="empty-chat">

                <div class="chat-icon">💬</div>

                <h3>Пока нет чатов</h3>

                <p>
                    Здесь будут отображаться твои переписки
                </p>

            </div>

        </main>


        <!-- ПРОФИЛЬ -->
        <main id="profilePage" class="page hidden">

            <div class="profile-card">

                <h2>Мой профиль</h2>

                <p class="profile-subtitle">
                    Настрой свой профиль
                </p>


                <div class="avatar-section">

                    <div id="avatarPreview" class="avatar">
                        👤
                    </div>

                    <label for="avatarInput"
                           class="avatar-button">
                        Изменить аватар
                    </label>

                    <input id="avatarInput"
                           type="file"
                           accept="image/*"
                           hidden>

                </div>


                <div class="field">

                    <label for="nickname">
                        Никнейм
                    </label>

                    <input id="nickname"
                           type="text"
                           maxlength="24"
                           placeholder="Введите ник">

                </div>


                <div class="field">

                    <label for="description">
                        О себе
                    </label>

                    <textarea id="description"
                              maxlength="120"
                              placeholder="Расскажите о себе..."></textarea>

                </div>


                <div class="field">

                    <label>Email</label>

                    <div id="profileEmail"
                         class="email-box">
                    </div>

                </div>


                <button id="saveProfile"
                        class="main-button">
                    Сохранить профиль
                </button>

                <p id="profileMessage"
                   class="profile-message"></p>

            </div>

        </main>


        <!-- НИЖНЕЕ МЕНЮ -->
        <nav class="bottom-nav">

            <button id="chatsButton"
                    class="nav-button active">

                <span class="nav-icon">💬</span>
                <span>Чаты</span>

            </button>


            <button id="profileButton"
                    class="nav-button">

                <span class="nav-icon">👤</span>
                <span>Профиль</span>

            </button>

        </nav>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
