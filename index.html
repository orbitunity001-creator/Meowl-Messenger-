<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f4f4f7;
      color: #222;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 5px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 0 0 25px;
    }

    .form-title {
      font-size: 21px;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      background: #fafafa;
    }

    .field input:focus {
      border-color: #888;
      background: white;
    }

    .main-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      background: #222;
      color: white;
      font-weight: bold;
      margin-top: 5px;
    }

    .main-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #777;
      font-size: 14px;
    }

    .switch button {
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      font-weight: bold;
      color: #222;
    }

    .message {
      min-height: 20px;
      margin: 12px 0 0;
      text-align: center;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    /* Messenger */

    #messenger {
      min-height: 100vh;
      width: 100%;
      background: #f4f4f7;
    }

    .messenger-header {
      width: 100%;
      height: 64px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .messenger-title {
      font-size: 21px;
      font-weight: bold;
    }

    .logout-button {
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      background: #eee;
      cursor: pointer;
    }

    .messenger-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .welcome-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.05);
    }

    .welcome-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .welcome-card h2 {
      margin: 0 0 10px;
    }

    .welcome-card p {
      color: #777;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .page {
        padding: 12px;
        align-items: flex-start;
        padding-top: 35px;
      }

      .auth-card {
        padding: 25px 18px;
        border-radius: 20px;
      }

      .messenger-content {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- АВТОРИЗАЦИЯ -->
  <section id="authPage" class="page">

    <div class="auth-card">

      <div class="logo">🐱</div>

      <h1>Meowl Messenger</h1>

      <p class="subtitle">
        Общайся с друзьями
      </p>

      <!-- ВХОД -->
      <div id="loginForm">

        <div class="form-title">
          Вход
        </div>

        <div class="field">
          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="Введите email"
            autocomplete="email"
          >
        </div>

        <div class="field">
          <label for="loginPassword">Пароль</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Введите пароль"
            autocomplete="current-password"
          >
        </div>

        <button
          id="loginButton"
          class="main-button"
          onclick="login()"
        >
          Войти
        </button>

        <div class="switch">
          Нет аккаунта?
          <button onclick="showRegister()">
            Зарегистрироваться
          </button>
        </div>

      </div>

      <!-- РЕГИСТРАЦИЯ -->
      <div id="registerForm" class="hidden">

        <div class="form-title">
          Регистрация
        </div>

        <div class="field">
          <label for="registerUsername">Имя пользователя</label>
          <input
            id="registerUsername"
            type="text"
            placeholder="Например: MeowlCat"
            autocomplete="username"
          >
        </div>

        <div class="field">
          <label for="registerEmail">Email</label>
          <input
            id="registerEmail"
            type="email"
            placeholder="Введите email"
            autocomplete="email"
          >
        </div>

        <div class="field">
          <label for="registerPassword">Пароль</label>
          <input
            id="registerPassword"
            type="password"
            placeholder="Минимум 6 символов"
            autocomplete="new-password"
          >
        </div>

        <div class="field">
          <label for="registerPassword2">Повторите пароль</label>
          <input
            id="registerPassword2"
            type="password"
            placeholder="Повторите пароль"
            autocomplete="new-password"
          >
        </div>

        <button
          id="registerButton"
          class="main-button"
          onclick="register()"
        >
          Зарегистрироваться
        </button>

        <div class="switch">
          Уже есть аккаунт?
          <button onclick="showLogin()">
            Войти
          </button>
        </div>

      </div>

      <div id="message" class="message"></div>

    </div>

  </section>


  <!-- MESSENGER -->
  <section id="messenger" class="hidden">

    <header class="messenger-header">

      <div class="messenger-title">
        🐱 Meowl Messenger
      </div>

      <button
        class="logout-button"
        onclick="logout()"
      >
        Выйти
      </button>

    </header>

    <main class="messenger-content">

      <div class="welcome-card">

        <div class="welcome-icon">
          🐱
        </div>

        <h2>
          Добро пожаловать в Meowl Messenger!
        </h2>

        <p>
          Ты успешно вошёл в свой аккаунт.
        </p>

        <p>
          💬 Следующим шагом мы добавим сюда
          настоящие чаты и сообщения.
        </p>

      </div>

    </main>

  </section>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ehkdidgjiszpqqajsxsu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_5-1jR2q3JRmXTAjksWFndA_yraWCUD2";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const authPage =
      document.getElementById("authPage");

    const messenger =
      document.getElementById("messenger");

    const loginForm =
      document.getElementById("loginForm");

    const registerForm =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");


    function showMessage(text) {
      message.textContent = text;
    }


    function showLogin() {

      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");

      showMessage("");

    }


    function showRegister() {

      loginForm.classList.add("hidden");
      registerForm.classList.remove("hidden");

      showMessage("");

    }


    function openMessenger() {

      authPage.classList.add("hidden");
      messenger.classList.remove("hidden");

    }


    function openAuth() {

      messenger.classList.add("hidden");
      authPage.classList.remove("hidden");

    }


    async function register() {

      const username =
        document
          .getElementById("registerUsername")
          .value
          .trim();

      const email =
        document
          .getElementById("registerEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("registerPassword")
          .value;

      const password2 =
        document
          .getElementById("registerPassword2")
          .value;

      const button =
        document.getElementById("registerButton");


      if (!username || !email || !password || !password2) {

        showMessage("Заполни все поля.");

        return;
      }


      if (password.length < 6) {

        showMessage("Пароль должен быть минимум 6 символов.");

        return;
      }


      if (password !== password2) {

        showMessage("Пароли не совпадают.");

        return;
      }


      button.disabled = true;
      showMessage("Создаём аккаунт...");


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                username: username
              }
            }

          });


        if (error) {
          throw error;
        }


        if (data.session) {

          await saveProfile(
            data.user.id,
            username
          );

          showMessage("Аккаунт создан!");

          openMessenger();

        } else {

          showMessage(
            "Аккаунт создан. Проверь почту и подтверди email, затем войди."
          );

          showLogin();

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "Ошибка: " + error.message
        );

      } finally {

        button.disabled = false;

      }

    }


    async function saveProfile(userId, username) {

      const { error } =
        await supabaseClient
          .from("profiles")
          .upsert(
            {
              id: userId,
              username: username
            },
            {
              onConflict: "id"
            }
          );


      if (error) {
        console.error(
          "Ошибка профиля:",
          error
        );
      }

    }


    async function login() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const button =
        document.getElementById("loginButton");


      if (!email || !password) {

        showMessage("Заполни email и пароль.");

        return;
      }


      button.disabled = true;
      showMessage("Выполняем вход...");


      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {
          throw error;
        }


        showMessage("Вход выполнен!");

        openMessenger();

      } catch (error) {

        console.error(error);

        showMessage(
          "Ошибка: " + error.message
        );

      } finally {

        button.disabled = false;

      }

    }


    async function logout() {

      await supabaseClient.auth.signOut();

      openAuth();

      showLogin();

      document.getElementById("loginPassword").value = "";

      showMessage("Вы вышли из аккаунта.");

    }


    async function checkUser() {

      const { data } =
        await supabaseClient.auth.getSession();


      if (data.session) {

        openMessenger();

      } else {

        openAuth();

      }

    }


    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        if (session) {

          openMessenger();

        }

      }
    );


    checkUser();

  </script>

</body>
</html>
