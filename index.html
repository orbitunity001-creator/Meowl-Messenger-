<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080b16;
      --card: rgba(20, 25, 45, .72);
      --border: rgba(255,255,255,.1);
      --text: #fff;
      --muted: #9ca3b8;
      --purple: #9b5cff;
      --cyan: #35e8ff;
      --danger: #ff5577;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(155,92,255,.22), transparent 35%),
        radial-gradient(circle at 85% 20%, rgba(53,232,255,.16), transparent 35%),
        radial-gradient(circle at 50% 100%, rgba(155,92,255,.12), transparent 40%),
        var(--bg);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    #authScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 50px rgba(155,92,255,.12),
        inset 0 0 30px rgba(255,255,255,.025);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(53,232,255,.5);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      color: var(--muted);
    }

    .tab.active {
      color: white;
      border-color: rgba(155,92,255,.55);
      background: rgba(155,92,255,.18);
      box-shadow: 0 0 20px rgba(155,92,255,.12);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      color: white;
      background: rgba(255,255,255,.045);
      border-radius: 15px;
      padding: 13px 15px;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(53,232,255,.55);
      box-shadow: 0 0 18px rgba(53,232,255,.08);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .primary {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 14px;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, var(--purple), #6740ff);
      box-shadow: 0 0 25px rgba(155,92,255,.22);
    }

    .primary:hover {
      filter: brightness(1.1);
    }

    .error {
      color: #ff7c99;
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
    }

    /* APP */

    #appScreen {
      min-height: 100vh;
      padding-bottom: 85px;
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,11,22,.55);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-title {
      font-size: 21px;
      font-weight: 800;
    }

    .online {
      color: var(--cyan);
      font-size: 12px;
    }

    .content {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .glass {
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(20px);
      border-radius: 22px;
      box-shadow: inset 0 0 30px rgba(255,255,255,.02);
    }

    /* USERS */

    .search {
      margin-bottom: 15px;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      transition: .2s;
      cursor: pointer;
    }

    .user-card:hover {
      border-color: rgba(53,232,255,.35);
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(53,232,255,.07);
    }

    .avatar {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      color: white;
      font-size: 21px;
      font-weight: 800;
      box-shadow: 0 0 20px rgba(155,92,255,.2);
    }

    .user-name {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .username {
      color: var(--cyan);
      font-size: 13px;
    }

    .description {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 35px 15px;
    }

    /* CHATS */

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-card {
      padding: 15px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      cursor: pointer;
    }

    .chat-card:hover {
      border-color: rgba(155,92,255,.4);
    }

    /* CHAT */

    .chat-page {
      height: calc(100vh - 155px);
      display: flex;
      flex-direction: column;
    }

    .back-btn {
      border: 1px solid var(--border);
      color: white;
      background: rgba(255,255,255,.05);
      padding: 9px 13px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .message {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 17px;
      word-break: break-word;
    }

    .message.mine {
      align-self: flex-end;
      background: linear-gradient(135deg, #7140df, #8d55ff);
      border-bottom-right-radius: 5px;
    }

    .message.other {
      align-self: flex-start;
      background: rgba(255,255,255,.08);
      border-bottom-left-radius: 5px;
    }

    .message-time {
      font-size: 10px;
      opacity: .6;
      margin-top: 4px;
      text-align: right;
    }

    .send-box {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--border);
    }

    .send-box input {
      flex: 1;
    }

    .send-btn {
      width: 52px;
      border: none;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      font-size: 20px;
    }

    /* SETTINGS */

    .settings-card {
      padding: 20px;
    }

    .settings-card h3 {
      margin-bottom: 18px;
    }

    .danger {
      margin-top: 12px;
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,85,119,.35);
      border-radius: 14px;
      background: rgba(255,85,119,.08);
      color: #ff8aa2;
    }

    /* NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 9px;
      z-index: 100;
      border-top: 1px solid var(--border);
      background: rgba(8,11,22,.78);
      backdrop-filter: blur(20px);
    }

    .nav-btn {
      width: min(30%, 180px);
      border: 1px solid transparent;
      border-radius: 15px;
      color: var(--muted);
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .nav-btn.active {
      color: white;
      background: rgba(155,92,255,.14);
      border-color: rgba(155,92,255,.28);
    }

    .nav-icon {
      font-size: 19px;
    }

    .nav-text {
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .content {
        padding: 15px;
      }

      .auth-card {
        padding: 22px;
      }

      .page-title {
        font-size: 24px;
      }

      .message {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <!-- AUTH -->
  <section id="authScreen">
    <div class="auth-card">

      <div class="logo">🐱 Meowl <span>Messenger</span></div>
      <div class="subtitle">Общайся с людьми в реальном времени</div>

      <div class="tabs">
        <button id="loginTab" class="tab active">Войти</button>
        <button id="registerTab" class="tab">Регистрация</button>
      </div>

      <form id="authForm">

        <div class="field">
          <label>Email</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="example@mail.com"
            required
          >
        </div>

        <div class="field">
          <label>Пароль</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Минимум 6 символов"
            required
          >
        </div>

        <div id="nicknameField" class="field hidden">
          <label>Имя</label>
          <input
            id="registerNickname"
            type="text"
            maxlength="40"
            placeholder="Твоё имя"
          >
        </div>

        <button id="authButton" class="primary" type="submit">
          Войти
        </button>

        <div id="authError" class="error"></div>

      </form>
    </div>
  </section>


  <!-- APP -->
  <section id="appScreen" class="hidden">

    <header class="topbar">
      <div class="top-title">🐱 Meowl Messenger</div>
      <div class="online">● online</div>
    </header>

    <main class="content">

      <!-- CHATS PAGE -->
      <section id="chatsPage" class="page">

        <div class="page-title">Чаты</div>

        <div id="chatList" class="chat-list">
          <div class="empty">Загрузка чатов...</div>
        </div>

      </section>


      <!-- USERS PAGE -->
      <section id="usersPage" class="page hidden">

        <div class="page-title">Пользователи</div>

        <input
          id="userSearch"
          class="search"
          type="text"
          placeholder="Поиск по @username"
          autocomplete="off"
        >

        <div id="userList" class="user-list">
          <div class="empty">Загрузка пользователей...</div>
        </div>

      </section>


      <!-- SETTINGS PAGE -->
      <section id="settingsPage" class="page hidden">

        <div class="page-title">Настройки</div>

        <div class="glass settings-card">

          <h3>Мой профиль</h3>

          <div class="field">
            <label>Username</label>
            <input
              id="settingsUsername"
              type="text"
              maxlength="21"
              placeholder="@username"
            >
          </div>

          <div class="field">
            <label>Имя</label>
            <input
              id="settingsNickname"
              type="text"
              maxlength="40"
              placeholder="Имя"
            >
          </div>

          <div class="field">
            <label>Описание</label>
            <textarea
              id="settingsDescription"
              maxlength="160"
              placeholder="Расскажи немного о себе"
            ></textarea>
          </div>

          <button id="saveProfile" class="primary">
            Сохранить
          </button>

          <button id="logoutButton" class="danger">
            Выйти из аккаунта
          </button>

          <div id="settingsError" class="error"></div>

        </div>

      </section>


      <!-- CHAT PAGE -->
      <section id="chatPage" class="page hidden">

        <button id="backFromChat" class="back-btn">
          ← Назад
        </button>

        <div class="glass chat-page">

          <div id="chatHeader" style="padding:15px;border-bottom:1px solid var(--border);font-weight:700;">
            Чат
          </div>

          <div id="messages" class="messages">
            <div class="empty">Загрузка...</div>
          </div>

          <form id="sendForm" class="send-box">

            <input
              id="messageInput"
              type="text"
              maxlength="2000"
              placeholder="Написать сообщение..."
              autocomplete="off"
            >

            <button class="send-btn" type="submit">
              ➤
            </button>

          </form>

        </div>

      </section>

    </main>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

      <button id="navChats" class="nav-btn active">
        <span class="nav-icon">💬</span>
        <span class="nav-text">Чаты</span>
      </button>

      <button id="navUsers" class="nav-btn">
        <span class="nav-icon">👥</span>
        <span class="nav-text">Пользователи</span>
      </button>

      <button id="navSettings" class="nav-btn">
        <span class="nav-icon">⚙️</span>
        <span class="nav-text">Настройки</span>
      </button>

    </nav>

  </section>


<script type="module">

  /* =========================================================
     FIREBASE
  ========================================================= */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    set,
    get,
    update,
    remove,
    push,
    onValue,
    serverTimestamp,
    runTransaction
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


  const firebaseConfig = {
    apiKey: "AIzaSyDUu20AAahXFB57envRSAFID9A9H6YKIM",
    authDomain: "meowl-messenger.firebaseapp.com",
    databaseURL: "https://meowl-messenger-default-rtdb.firebaseio.com",
    projectId: "meowl-messenger",
    storageBucket: "meowl-messenger.firebasestorage.app",
    messagingSenderId: "228165699456",
    appId: "1:228165699456:web:a33dfc849a553c01a36365",
    measurementId: "G-WBJM9L18VH"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);


  /* =========================================================
     STATE
  ========================================================= */

  let currentUser = null;
  let currentProfile = null;

  let usersCache = {};
  let chatsCache = {};

  let currentChatId = null;
  let currentChatUser = null;

  let unsubscribeUsers = null;
  let unsubscribeChats = null;
  let unsubscribeMessages = null;


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const authScreen = document.getElementById("authScreen");
  const appScreen = document.getElementById("appScreen");

  const authForm = document.getElementById("authForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const nicknameInput = document.getElementById("registerNickname");

  const loginTab = document.getElementById("loginTab");
  const registerTab = document.getElementById("registerTab");

  const authButton = document.getElementById("authButton");
  const authError = document.getElementById("authError");
  const nicknameField = document.getElementById("nicknameField");

  const chatsPage = document.getElementById("chatsPage");
  const usersPage = document.getElementById("usersPage");
  const settingsPage = document.getElementById("settingsPage");
  const chatPage = document.getElementById("chatPage");

  const chatList = document.getElementById("chatList");
  const userList = document.getElementById("userList");
  const userSearch = document.getElementById("userSearch");

  const settingsUsername = document.getElementById("settingsUsername");
  const settingsNickname = document.getElementById("settingsNickname");
  const settingsDescription = document.getElementById("settingsDescription");
  const settingsError = document.getElementById("settingsError");

  const messages = document.getElementById("messages");
  const chatHeader = document.getElementById("chatHeader");
  const messageInput = document.getElementById("messageInput");
  const sendForm = document.getElementById("sendForm");


  /* =========================================================
     AUTH MODE
  ========================================================= */

  let authMode = "login";


  loginTab.addEventListener("click", () => {
    authMode = "login";

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    nicknameField.classList.add("hidden");
    authButton.textContent = "Войти";
    authError.textContent = "";
  });


  registerTab.addEventListener("click", () => {
    authMode = "register";

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    nicknameField.classList.remove("hidden");
    authButton.textContent = "Создать аккаунт";
    authError.textContent = "";
  });


  /* =========================================================
     USERNAME
  ========================================================= */

  function normalizeUsername(value) {

    let username = String(value || "")
      .trim()
      .toLowerCase();

    if (!username.startsWith("@")) {
      username = "@" + username;
    }

    return username;
  }


  function usernameKey(username) {
    /*
      ВАЖНО:
      ключ содержит весь username вместе с @.
      Например:
      @vasya
    */

    return normalizeUsername(username);
  }


  function validUsername(username) {
    return /^@[a-z0-9_]{3,20}$/.test(username);
  }


  function generateUsername(uid) {

    const shortUid = uid
      .replace(/[^a-zA-Z0-9]/g, "")
      .slice(-8)
      .toLowerCase();

    return "@meow" + shortUid;
  }


  /* =========================================================
     CLAIM USERNAME
  ========================================================= */

  async function claimUsername(username, uid) {

    const normalized = normalizeUsername(username);

    if (!validUsername(normalized)) {
      throw new Error(
        "Username: 3–20 символов после @. Только a-z, 0-9 и _."
      );
    }

    const key = usernameKey(normalized);

    const usernameRef = ref(
      db,
      "usernameIndex/" + key
    );

    const result = await runTransaction(
      usernameRef,
      current => {

        /*
          null = username свободен
          uid = username уже принадлежит нам
          другой uid = username занят
        */

        if (current === null) {
          return uid;
        }

        if (current === uid) {
          return current;
        }

        return;
      }
    );

    if (!result.committed) {
      throw new Error("Этот username уже занят.");
    }

    return normalized;
  }


  /* =========================================================
     CREATE PROFILE
  ========================================================= */

  async function createInitialProfile(user, nickname) {

    const uid = user.uid;

    /*
      Firebase Auth уже создал пользователя.
      UID берём ТОЛЬКО из Firebase Auth.
    */

    let username = generateUsername(uid);

    /*
      На случай совпадения пробуем несколько вариантов.
    */

    for (let i = 0; i < 10; i++) {

      try {

        const candidate =
          i === 0
            ? username
            : "@meow" + uid.slice(-5).toLowerCase() + i;

        username = await claimUsername(
          candidate,
          uid
        );

        break;

      } catch (error) {

        if (i === 9) {
          throw error;
        }
      }
    }


    const profileRef = ref(
      db,
      "users/" + uid
    );


    const profile = {

      /*
        Самое главное:
        UID пользователя = auth.currentUser.uid
      */

      uid: uid,

      username: username,

      usernameLower: username,

      nickname:
        String(nickname || "Пользователь")
          .trim()
          .slice(0, 40),

      nicknameLower:
        String(nickname || "Пользователь")
          .trim()
          .toLowerCase()
          .slice(0, 40),

      description: "",

      email: user.email || "",

      createdAt: serverTimestamp()

    };


    try {

      await set(
        profileRef,
        profile
      );

    } catch (error) {

      /*
        Если профиль не создался,
        освобождаем username.
      */

      try {
        await remove(
          ref(
            db,
            "usernameIndex/" + usernameKey(username)
          )
        );
      } catch (_) {}

      throw error;
    }


    return profile;
  }


  /* =========================================================
     LOAD PROFILE
  ========================================================= */

  async function loadCurrentProfile() {

    if (!currentUser) {
      return null;
    }

    /*
      Никогда не используем email или username
      как ID пользователя.

      ID = Firebase Auth UID.
    */

    const uid = currentUser.uid;

    const snapshot = await get(
      ref(db, "users/" + uid)
    );


    if (!snapshot.exists()) {

      return await createInitialProfile(
        currentUser,
        currentUser.email
          ? currentUser.email.split("@")[0]
          : "Пользователь"
      );
    }


    return snapshot.val();
  }


  /* =========================================================
     AUTH FORM
  ========================================================= */

  authForm.addEventListener("submit", async event => {

    event.preventDefault();

    authError.textContent = "";

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!email || !password) {
      authError.textContent =
        "Заполни email и пароль.";
      return;
    }


    authButton.disabled = true;

    try {

      if (authMode === "login") {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } else {

        if (password.length < 6) {
          throw new Error(
            "Пароль должен быть минимум 6 символов."
          );
        }

        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        /*
          Здесь credential.user.uid —
          настоящий Firebase UID.
        */

        await createInitialProfile(
          credential.user,
          nicknameInput.value
        );
      }

    } catch (error) {

      console.error(error);

      let message = error.message;

      if (error.code === "auth/email-already-in-use") {
        message = "Этот email уже зарегистрирован.";
      }

      if (error.code === "auth/invalid-email") {
        message = "Неверный email.";
      }

      if (error.code === "auth/invalid-credential") {
        message = "Неверный email или пароль.";
      }

      if (error.code === "auth/weak-password") {
        message = "Слишком слабый пароль.";
      }

      if (error.code === "PERMISSION_DENIED") {
        message = "Firebase Rules запретили действие.";
      }

      authError.textContent = message;

    } finally {

      authButton.disabled = false;
    }
  });


  /* =========================================================
     AUTH STATE
  ========================================================= */

  onAuthStateChanged(auth, async user => {

    currentUser = user;

    if (!user) {

      authScreen.classList.remove("hidden");
      appScreen.classList.add("hidden");

      cleanupListeners();

      return;
    }


    /*
      Здесь Firebase уже подтвердил пользователя.
      ID token используется Firebase SDK автоматически.
    */

    console.log(
      "Firebase authenticated UID:",
      user.uid
    );


    try {

      currentProfile =
        await loadCurrentProfile();


      authScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");


      fillSettings();

      startUsersListener();
      startChatsListener();

      openPage("chats");

    } catch (error) {

      console.error(error);

      alert(
        "Не удалось загрузить профиль: " +
        error.message
      );
    }
  });


  /* =========================================================
     USERS
  ========================================================= */

  function startUsersListener() {

    if (unsubscribeUsers) {
      unsubscribeUsers();
    }


    const usersRef =
      ref(db, "users");


    unsubscribeUsers =
      onValue(
        usersRef,
        snapshot => {

          usersCache =
            snapshot.val() || {};

          renderUsers();
        },

        error => {

          console.error(
            "Users listener:",
            error
          );
        }
      );
  }


  function renderUsers() {

    userList.innerHTML = "";


    const search =
      userSearch.value
        .trim()
        .toLowerCase();


    const allUsers =
      Object.entries(usersCache);


    const filtered =
      allUsers.filter(([uid, user]) => {

        /*
          Себя в список не показываем.
        */

        if (
          currentUser &&
          uid === currentUser.uid
        ) {
          return false;
        }


        if (!user) {
          return false;
        }


        const username =
          String(
            user.username || ""
          ).toLowerCase();


        /*
          Поиск только по username.
        */

        if (!search) {
          return true;
        }


        return username.includes(
          search.startsWith("@")
            ? search
            : "@" + search
        );
      });


    if (!filtered.length) {

      userList.innerHTML =
        `<div class="empty">
          Пользователи не найдены
        </div>`;

      return;
    }


    filtered
      .sort((a, b) => {

        const aa =
          a[1].username || "";

        const bb =
          b[1].username || "";

        return aa.localeCompare(bb);
      })
      .forEach(([uid, user]) => {

        const card =
          document.createElement("div");

        card.className =
          "user-card";


        const nickname =
          user.nickname ||
          "Пользователь";


        const username =
          user.username ||
          "@unknown";


        const description =
          user.description || "";


        card.innerHTML = `

          <div class="avatar">
            ${escapeHtml(
              nickname.charAt(0).toUpperCase()
            )}
          </div>

          <div style="min-width:0">

            <div class="user-name">
              ${escapeHtml(nickname)}
            </div>

            <div class="username">
              ${escapeHtml(username)}
            </div>

            ${
              description
                ? `<div class="description">
                    ${escapeHtml(description)}
                   </div>`
                : ""
            }

          </div>
        `;


        card.addEventListener(
          "click",
          () => openChatWithUser(
            uid,
            user
          )
        );


        userList.appendChild(card);
      });
  }


  userSearch.addEventListener(
    "input",
    renderUsers
  );


  /* =========================================================
     CHAT ID
  ========================================================= */

  function makeChatId(uid1, uid2) {

    return [
      uid1,
      uid2
    ]
      .sort()
      .join("_");
  }


  /* =========================================================
     OPEN PRIVATE CHAT
  ========================================================= */

  async function openChatWithUser(
    uid,
    user
  ) {

    if (!currentUser) {
      return;
    }


    if (uid === currentUser.uid) {
      return;
    }


    const chatId =
      makeChatId(
        currentUser.uid,
        uid
      );


    currentChatId = chatId;
    currentChatUser = user;


    const chatRef =
      ref(
        db,
        "chats/" + chatId
      );


    const snapshot =
      await get(chatRef);


    if (!snapshot.exists()) {

      /*
        Создаём приватный чат.
        Участники — реальные Firebase UID.
      */

      await set(
        chatRef,
        {

          participants: {

            [currentUser.uid]: true,

            [uid]: true

          },

          createdAt:
            serverTimestamp(),

          updatedAt:
            serverTimestamp()

        }
      );
    }


    chatHeader.textContent =
      (
        user.nickname ||
        user.username ||
        "Пользователь"
      );


    openPage(
      "chat",
      false
    );


    startMessagesListener(
      chatId
    );
  }


  /* =========================================================
     MESSAGES
  ========================================================= */

  function startMessagesListener(chatId) {

    if (unsubscribeMessages) {
      unsubscribeMessages();
    }


    const messagesRef =
      ref(
        db,
        "chats/" +
        chatId +
        "/messages"
      );


    unsubscribeMessages =
      onValue(
        messagesRef,
        snapshot => {

          messages.innerHTML = "";


          const data =
            snapshot.val();


          if (!data) {

            messages.innerHTML =
              `<div class="empty">
                Пока нет сообщений
              </div>`;

            return;
          }


          Object.entries(data)
            .sort((a, b) => {

              const ta =
                Number(
                  a[1].createdAt || 0
                );

              const tb =
                Number(
                  b[1].createdAt || 0
                );

              return ta - tb;
            })
            .forEach(([id, message]) => {

              const div =
                document.createElement("div");


              const mine =
                message.senderId ===
                currentUser.uid;


              div.className =
                "message " +
                (
                  mine
                    ? "mine"
                    : "other"
                );


              const date =
                message.createdAt
                  ? new Date(
                      message.createdAt
                    )
                  : new Date();


              div.innerHTML = `

                <div>
                  ${escapeHtml(
                    message.text || ""
                  )}
                </div>

                <div class="message-time">
                  ${date.toLocaleTimeString(
                    "ru-RU",
                    {
                      hour: "2-digit",
                      minute: "2-digit"
                    }
                  )}
                </div>

              `;


              messages.appendChild(div);
            });


          messages.scrollTop =
            messages.scrollHeight;
        }
      );
  }


  /* =========================================================
     SEND MESSAGE
  ========================================================= */

  sendForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if (
        !currentUser ||
        !currentChatId
      ) {
        return;
      }


      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      if (text.length > 2000) {
        return;
      }


      messageInput.disabled = true;


      try {

        /*
          push создаёт уникальный ID сообщения.
        */

        const messageRef =
          push(
            ref(
              db,
              "chats/" +
              currentChatId +
              "/messages"
            )
          );


        await set(
          messageRef,
          {

            text: text,

            /*
              Только настоящий Firebase UID.
            */

            senderId:
              currentUser.uid,

            createdAt:
              serverTimestamp()

          }
        );


        /*
          ВАЖНО:
          обновляем только updatedAt,
          чтобы Rules не разрешали менять
          участников или сообщения.
        */

        await set(
          ref(
            db,
            "chats/" +
            currentChatId +
            "/updatedAt"
          ),
          serverTimestamp()
        );


        messageInput.value = "";

      } catch (error) {

        console.error(
          "Send message error:",
          error
        );

        alert(
          "Не удалось отправить сообщение: " +
          error.message
        );

      } finally {

        messageInput.disabled = false;
        messageInput.focus();
      }
    }
  );


  /* =========================================================
     CHATS LIST
  ========================================================= */

  function startChatsListener() {

    if (unsubscribeChats) {
      unsubscribeChats();
    }


    const chatsRef =
      ref(db, "chats");


    unsubscribeChats =
      onValue(
        chatsRef,
        snapshot => {

          chatsCache =
            snapshot.val() || {};

          renderChats();
        }
      );
  }


  function renderChats() {

    chatList.innerHTML = "";


    if (!currentUser) {
      return;
    }


    const chats =
      Object.entries(chatsCache)
        .filter(([chatId, chat]) => {

          return (
            chat &&
            chat.participants &&
            chat.participants[
              currentUser.uid
            ] === true
          );
        });


    if (!chats.length) {

      chatList.innerHTML =
        `<div class="empty">
          Пока нет чатов.<br>
          Открой «Пользователи» и выбери человека.
        </div>`;

      return;
    }


    chats
      .sort((a, b) => {

        const ta =
          Number(
            a[1].updatedAt || 0
          );

        const tb =
          Number(
            b[1].updatedAt || 0
          );

        return tb - ta;
      })
      .forEach(([chatId, chat]) => {

        const otherUid =
          Object.keys(
            chat.participants || {}
          ).find(
            uid =>
              uid !== currentUser.uid
          );


        if (!otherUid) {
          return;
        }


        const user =
          usersCache[otherUid];


        if (!user) {
          return;
        }


        const card =
          document.createElement("div");


        card.className =
          "chat-card";


        card.innerHTML = `

          <div style="display:flex;align-items:center;gap:12px">

            <div class="avatar">
              ${escapeHtml(
                (
                  user.nickname ||
                  user.username ||
                  "?"
                )
                  .charAt(0)
                  .toUpperCase()
              )}
            </div>

            <div>

              <div class="user-name">
                ${escapeHtml(
                  user.nickname ||
                  "Пользователь"
                )}
              </div>

              <div class="username">
                ${escapeHtml(
                  user.username ||
                  "@unknown"
                )}
              </div>

            </div>

          </div>
        `;


        card.addEventListener(
          "click",
          () => openChatWithUser(
            otherUid,
            user
          )
        );


        chatList.appendChild(card);
      });
  }


  /* =========================================================
     SETTINGS
  ========================================================= */

  function fillSettings() {

    if (!currentProfile) {
      return;
    }


    settingsUsername.value =
      currentProfile.username || "";


    settingsNickname.value =
      currentProfile.nickname || "";


    settingsDescription.value =
      currentProfile.description || "";
  }


  document
    .getElementById("saveProfile")
    .addEventListener(
      "click",
      saveProfile
    );


  async function saveProfile() {

    if (!currentUser) {
      return;
    }


    settingsError.textContent = "";


    const newUsername =
      normalizeUsername(
        settingsUsername.value
      );


    const nickname =
      settingsNickname.value
        .trim()
        .slice(0, 40);


    const description =
      settingsDescription.value
        .trim()
        .slice(0, 160);


    if (!validUsername(newUsername)) {

      settingsError.textContent =
        "Username должен быть @ и 3–20 символов: a-z, 0-9, _";

      return;
    }


    if (!nickname) {

      settingsError.textContent =
        "Укажи имя.";

      return;
    }


    const oldUsername =
      currentProfile.username;


    const usernameChanged =
      newUsername !==
      oldUsername;


    try {

      /*
        Сначала резервируем новый username.
      */

      if (usernameChanged) {

        await claimUsername(
          newUsername,
          currentUser.uid
        );
      }


      /*
        Пишем профиль только под
        настоящим Firebase UID.
      */

      await update(
        ref(
          db,
          "users/" +
          currentUser.uid
        ),
        {

          username:
            newUsername,

          usernameLower:
            newUsername,

          nickname:
            nickname,

          nicknameLower:
            nickname.toLowerCase(),

          description:
            description

        }
      );


      /*
        Старый username освобождаем
        только после успешного обновления профиля.
      */

      if (
        usernameChanged &&
        oldUsername
      ) {

        await remove(
          ref(
            db,
            "usernameIndex/" +
            usernameKey(oldUsername)
          )
        );
      }


      currentProfile = {

        ...currentProfile,

        username: newUsername,

        usernameLower: newUsername,

        nickname: nickname,

        nicknameLower:
          nickname.toLowerCase(),

        description: description

      };


      fillSettings();


      settingsError.style.color =
        "#66ffbb";

      settingsError.textContent =
        "Профиль сохранён.";

      setTimeout(() => {

        settingsError.textContent = "";

        settingsError.style.color = "";

      }, 2500);


    } catch (error) {

      console.error(error);

      settingsError.style.color =
        "#ff7c99";

      settingsError.textContent =
        error.message ||
        "Не удалось сохранить профиль.";
    }
  }


  /* =========================================================
     NAVIGATION
  ========================================================= */

  const navChats =
    document.getElementById("navChats");

  const navUsers =
    document.getElementById("navUsers");

  const navSettings =
    document.getElementById("navSettings");


  navChats.addEventListener(
    "click",
    () => openPage("chats")
  );


  navUsers.addEventListener(
    "click",
    () => openPage("users")
  );


  navSettings.addEventListener(
    "click",
    () => openPage("settings")
  );


  document
    .getElementById("backFromChat")
    .addEventListener(
      "click",
      () => {

        if (unsubscribeMessages) {
          unsubscribeMessages();
          unsubscribeMessages = null;
        }

        openPage("chats");
      }
    );


  function openPage(
    page,
    updateNav = true
  ) {

    chatsPage.classList.add("hidden");
    usersPage.classList.add("hidden");
    settingsPage.classList.add("hidden");
    chatPage.classList.add("hidden");


    navChats.classList.remove("active");
    navUsers.classList.remove("active");
    navSettings.classList.remove("active");


    if (page === "chats") {

      chatsPage.classList.remove("hidden");

      if (updateNav) {
        navChats.classList.add("active");
      }

    } else if (page === "users") {

      usersPage.classList.remove("hidden");

      if (updateNav) {
        navUsers.classList.add("active");
      }

    } else if (page === "settings") {

      settingsPage.classList.remove("hidden");

      if (updateNav) {
        navSettings.classList.add("active");
      }

    } else if (page === "chat") {

      chatPage.classList.remove("hidden");

      /*
        Во время чата оставляем навигацию
        визуально без активной страницы.
      */
    }
  }


  /* =========================================================
     LOGOUT
  ========================================================= */

  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

        } catch (error) {

          console.error(error);

          alert(
            "Ошибка выхода: " +
            error.message
          );
        }
      }
    );


  /* =========================================================
     CLEANUP
  ========================================================= */

  function cleanupListeners() {

    if (unsubscribeUsers) {
      unsubscribeUsers();
      unsubscribeUsers = null;
    }

    if (unsubscribeChats) {
      unsubscribeChats();
      unsubscribeChats = null;
    }

    if (unsubscribeMessages) {
      unsubscribeMessages();
      unsubscribeMessages = null;
    }

    usersCache = {};
    chatsCache = {};

    currentChatId = null;
    currentChatUser = null;
    currentProfile = null;
  }


  /* =========================================================
     HTML ESCAPE
  ========================================================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

</script>
