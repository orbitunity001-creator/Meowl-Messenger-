<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meowl Messenger</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f3f7;
  color: #222;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  height: 64px;
  background: white;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 20px;
  font-weight: bold;
}

.content {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 5px 25px #00000012;
}

h1, h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  margin: 6px 0 12px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 16px;
  background: #222;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.full {
  width: 100%;
}

.chat {
  margin-top: 20px;
  display: none;
}

.messages {
  min-height: 250px;
  max-height: 400px;
  overflow-y: auto;
  padding: 10px 0;
}

.message {
  background: #eee;
  padding: 10px 14px;
  border-radius: 14px;
  margin: 8px 0;
  width: fit-content;
  max-width: 80%;
}

.mine {
  margin-left: auto;
  background: #222;
  color: white;
}

.send {
  display: flex;
  gap: 8px;
}

.send input {
  margin: 0;
}

.send button {
  width: 60px;
}

.status {
  margin-top: 15px;
  color: #666;
  text-align: center;
}

@media (max-width: 500px) {
  .content {
    padding: 12px;
  }

  .card {
    padding: 20px 16px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    🐱 Meowl Messenger
  </div>

  <div class="content">

    <div class="card">

      <h2>💬 Мои чаты</h2>

      <input
        id="chatName"
        type="text"
        placeholder="Имя пользователя"
      >

      <button class="full" onclick="openChat()">
        Открыть чат
      </button>

      <div id="chat" class="chat">

        <h2 id="title">Чат</h2>

        <div id="messages" class="messages"></div>

        <div class="send">

          <input
            id="text"
            type="text"
            placeholder="Написать сообщение"
            onkeydown="if(event.key==='Enter') sendMessage()"
          >

          <button onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

      <div id="status" class="status">
        Выбери пользователя, чтобы начать чат.
      </div>

    </div>

  </div>

</div>

<script>

let currentChat = "";

function openChat() {

  const name =
    document.getElementById("chatName").value.trim();

  if (!name) {
    alert("Введи имя пользователя");
    return;
  }

  currentChat = name;

  document.getElementById("title").textContent =
    "💬 " + name;

  document.getElementById("chat").style.display =
    "block";

  document.getElementById("status").style.display =
    "none";

  loadMessages();
}

function getKey() {
  return "meowl_chat_" + currentChat;
}

function loadMessages() {

  const messages =
    JSON.parse(localStorage.getItem(getKey()) || "[]");

  const box =
    document.getElementById("messages");

  box.innerHTML = "";

  messages.forEach(function(message) {
