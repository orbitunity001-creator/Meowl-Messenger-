<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <header class="header">
    <div class="logo">🐱</div>
    <div>
      <h1>Meowl Messenger</h1>
      <p>Общайся с друзьями</p>
    </div>
  </header>

  <main class="home">

    <div class="welcome">

      <h2>Добро пожаловать!</h2>
      <p>Войди или создай аккаунт</p>

      <div id="auth">

        <input
          id="username"
          type="text"
          placeholder="Имя пользователя"
        >

        <input
          id="email"
          type="email"
          placeholder="Email"
        >

        <input
          id="password"
          type="password"
          placeholder="Пароль"
        >

        <button class="full" onclick="registerUser()">
          📝 Зарегистрироваться
        </button>

        <br><br>

        <button class="full" onclick="loginUser()">
          🔑 Войти
        </button>

        <div id="authMessage"></div>

      </div>

    </div>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
