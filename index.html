<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowl Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div id="authScreen" class="card">

    <div class="logo">M</div>

    <h1>Meowl Messenger</h1>
    <p class="subtitle">Общайся. Создавай. Будь собой.</p>

    <div class="tabs">
      <button id="loginTab" class="tab active" onclick="setMode('login')">
        Войти
      </button>

      <button id="registerTab" class="tab" onclick="setMode('register')">
        Регистрация
      </button>
    </div>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">

    <button class="main-btn" onclick="auth()">
      <span id="authButtonText">Войти</span>
    </button>

    <p id="error"></p>
  </div>


  <div id="appScreen" class="app hidden">

    <header>
      <div>
        <h2 id="pageTitle">Чаты</h2>
        <p id="userEmail"></p>
      </div>

      <button class="logout-btn" onclick="logout()">
        Выйти
      </button>
    </header>


    <section id="chatsPage">

      <div class="empty-card">
        <div class="chat-icon">💬</div>

        <h3>Пока нет чатов</h3>

        <p>Здесь появятся твои переписки.</p>
      </div>

    </section>


    <section id="profilePage" class="hidden">

      <div class="profile-card">

        <div class="avatar">
          <img id="avatarPreview" alt="Аватар">
        </div>

        <h2 id="profileNickname">Профиль</h2>

        <p id="profileDescription">
          Описание профиля
        </p>

        <button class="main-btn" onclick="editProfile()">
          ✏️ Изменить профиль
        </button>

      </div>


      <div id="editBox" class="edit-card hidden">

        <h2>Изменить профиль</h2>

        <label>Аватар</label>

        <button class="main-btn" onclick="chooseAvatar()">
          📷 Выбрать фото
        </button>

        <input
          id="avatarInput"
          type="file"
          accept="image/*"
          style="display:none"
          onchange="changeAvatar(event)"
        >

        <label>Никнейм</label>

        <input
          id="nickname"
          type="text"
          maxlength="30"
          placeholder="Твой никнейм"
        >

        <label>Описание</label>

        <textarea
          id="description"
          maxlength="200"
          placeholder="Расскажи о себе..."
        ></textarea>

        <label>Почта</label>

        <input
          id="profileEmail"
          type="email"
          disabled
          readonly
        >

        <button class="main-btn" onclick="saveProfile()">
          💾 Сохранить
        </button>

        <button class="cancel-btn" onclick="closeEdit()">
          Отмена
        </button>

        <p id="profileMessage"></p>

      </div>

    </section>


    <nav class="bottom-nav">

      <button
        id="chatsButton"
        class="nav-btn active"
        onclick="showChats()"
      >
        <span>💬</span>
        Чаты
      </button>

      <button
        id="profileButton"
        class="nav-btn"
        onclick="showProfile()"
      >
        <span>👤</span>
        Профиль
      </button>

    </nav>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
