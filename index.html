<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meowl Messenger</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 15% 10%,#702cff55,transparent 35%),
        radial-gradient(circle at 85% 90%,#00eaff33,transparent 35%),
        #080812;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* AUTH */

.auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-card{
    width:100%;
    max-width:430px;
    padding:30px;
    border:1px solid #ffffff18;
    border-radius:30px;
    background:#ffffff0b;
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:0 0 60px #7c3cff22;
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:800;
    line-height:1.15;
}

.logo span{
    color:#a365ff;
}

.subtitle{
    margin:14px 0 25px;
    text-align:center;
    color:#aaa;
    font-size:18px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.tabs button{
    flex:1;
    padding:14px;
    border:0;
    border-radius:16px;
    color:#999;
    background:#ffffff08;
}

.tabs button.active{
    color:#fff;
    background:linear-gradient(135deg,#813cff,#00caff);
}

.field{
    margin-bottom:14px;
}

.field input{
    width:100%;
    padding:16px;
    border:1px solid #ffffff15;
    border-radius:17px;
    outline:none;
    color:#fff;
    background:#ffffff09;
}

.field input::placeholder{
    color:#777;
}

.field input:focus{
    border-color:#974cffaa;
    box-shadow:0 0 20px #873cff22;
}

.main-btn{
    width:100%;
    padding:16px;
    border:0;
    border-radius:17px;
    color:#fff;
    font-weight:700;
    background:linear-gradient(135deg,#813cff,#00caff);
}

.error{
    min-height:22px;
    margin-top:14px;
    text-align:center;
    color:#ff6687;
}

/* APP */

.app{
    min-height:100vh;
    padding-bottom:82px;
}

.screen{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:20px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:5;
    margin:-20px -20px 20px;
    padding:20px;
    border-bottom:1px solid #ffffff0c;
    background:#080812dd;
    backdrop-filter:blur(20px);
}

.topbar h1{
    font-size:25px;
}

.search{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #ffffff15;
    border-radius:16px;
    outline:none;
    color:#fff;
    background:#ffffff09;
}

.search::placeholder{
    color:#777;
}

.list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.user-card,
.chat-card,
.setting-card{
    padding:16px;
    border:1px solid #ffffff12;
    border-radius:20px;
    background:#ffffff09;
    backdrop-filter:blur(15px);
}

.user-card,
.chat-card{
    cursor:pointer;
    transition:.2s;
}

.user-card:hover,
.chat-card:hover{
    transform:translateY(-1px);
    border-color:#8d52ff55;
    background:#ffffff0d;
}

.user-name{
    font-size:16px;
    font-weight:700;
}

.user-handle{
    margin-top:5px;
    color:#9c72ff;
    font-size:14px;
}

.user-description{
    margin-top:8px;
    color:#999;
    font-size:13px;
}

.empty{
    padding:45px 10px;
    text-align:center;
    color:#777;
    line-height:1.6;
}

/* CHAT */

.chat-screen{
    height:calc(100vh - 82px);
    max-width:850px;
    margin:auto;
    display:flex;
    flex-direction:column;
}

.chat-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 20px;
    border-bottom:1px solid #ffffff0d;
    background:#080812dd;
    backdrop-filter:blur(20px);
}

.back-btn{
    padding:10px 14px;
    border:0;
    border-radius:13px;
    color:#fff;
    background:#ffffff0a;
}

.chat-title{
    font-weight:700;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:20px;
}

.message{
    max-width:75%;
    padding:11px 14px;
    border-radius:17px;
    line-height:1.4;
    word-break:break-word;
    white-space:pre-wrap;
}

.message.mine{
    align-self:flex-end;
    border-bottom-right-radius:5px;
    background:linear-gradient(135deg,#713cff,#9b55ff);
}

.message.other{
    align-self:flex-start;
    border:1px solid #ffffff0c;
    border-bottom-left-radius:5px;
    background:#ffffff0b;
}

.chat-form{
    display:flex;
    gap:8px;
    padding:12px 15px;
    border-top:1px solid #ffffff0d;
    background:#080812f2;
}

.chat-form input{
    flex:1;
    min-width:0;
    padding:14px;
    border:1px solid #ffffff15;
    border-radius:15px;
    outline:none;
    color:#fff;
    background:#ffffff09;
}

.send-btn{
    width:50px;
    border:0;
    border-radius:15px;
    color:#fff;
    background:linear-gradient(135deg,#813cff,#00caff);
}

/* SETTINGS */

.setting-card{
    margin-bottom:12px;
}

.setting-title{
    margin-bottom:10px;
    color:#aaa;
    font-size:13px;
}

.setting-card input,
.setting-card textarea{
    width:100%;
    padding:14px;
    border:1px solid #ffffff15;
    border-radius:15px;
    outline:none;
    color:#fff;
    background:#ffffff09;
}

.setting-card textarea{
    resize:none;
}

.setting-hint{
    margin-top:8px;
    color:#777;
    font-size:12px;
}

.save-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:15px;
    color:#fff;
    font-weight:700;
    background:linear-gradient(135deg,#813cff,#00caff);
}

.logout{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:1px solid #ff527055;
    border-radius:15px;
    color:#ff7190;
    background:#ff416012;
}

/* NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:20;
    height:75px;
    display:flex;
    justify-content:center;
    gap:8px;
    padding:10px;
    border-top:1px solid #ffffff10;
    background:#080812ef;
    backdrop-filter:blur(20px);
}

.nav-btn{
    flex:1;
    max-width:180px;
    border:0;
    border-radius:16px;
    color:#777;
    background:transparent;
    line-height:1.35;
}

.nav-btn.active{
    color:#fff;
    background:#ffffff0d;
}

@media(max-width:500px){

    .auth-card{
        padding:23px;
    }

    .screen{
        padding:15px;
    }

    .topbar{
        margin:-15px -15px 15px;
        padding:17px 15px;
    }

    .message{
        max-width:85%;
    }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="authScreen" class="auth-screen">

    <div class="auth-card">

        <div class="logo">
            🐱 Meowl <span>Messenger</span>
        </div>

        <div class="subtitle">
            Общайся с людьми напрямую
        </div>

        <div class="tabs">

            <button id="loginTab" class="active">
                Войти
            </button>

            <button id="registerTab">
                Регистрация
            </button>

        </div>

        <form id="authForm">

            <div class="field">
                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                    required
                >
            </div>

            <div class="field">
                <input
                    id="password"
                    type="password"
                    placeholder="Пароль"
                    minlength="6"
                    required
                >
            </div>

            <button
                id="authButton"
                class="main-btn"
                type="submit"
            >
                Войти
            </button>

        </form>

        <div id="authError" class="error"></div>

    </div>

</div>


<!-- APP -->

<div id="app" class="app hidden">

    <!-- CHATS -->

    <section id="chatsScreen" class="screen">

        <div class="topbar">
            <h1>💬 Чаты</h1>
        </div>

        <input
            id="chatSearch"
            class="search"
            placeholder="🔎 Найти по @username"
            autocomplete="off"
        >

        <div id="chatsList" class="list"></div>

    </section>


    <!-- USERS -->

    <section id="usersScreen" class="screen hidden">

        <div class="topbar">
            <h1>👥 Пользователи</h1>
        </div>

        <input
            id="userSearch"
            class="search"
            placeholder="🔎 Найти по @username"
            autocomplete="off"
        >

        <div id="usersList" class="list"></div>

    </section>


    <!-- CHAT -->

    <section id="chatScreen" class="chat-screen hidden">

        <div class="chat-head">

            <button id="backChat" class="back-btn">
                ←
            </button>

            <div>

                <div
                    id="chatTitle"
                    class="chat-title"
                ></div>

                <div
                    id="chatHandle"
                    class="user-handle"
                ></div>

            </div>

        </div>

        <div
            id="messages"
            class="chat-messages"
        ></div>

        <form
            id="messageForm"
            class="chat-form"
        >

            <input
                id="messageInput"
                maxlength="2000"
                placeholder="Написать сообщение..."
                autocomplete="off"
            >

            <button
                class="send-btn"
                type="submit"
            >
                ➤
            </button>

        </form>

    </section>


    <!-- SETTINGS -->

    <section
        id="settingsScreen"
        class="screen hidden"
    >

        <div class="topbar">
            <h1>⚙️ Настройки</h1>
        </div>

        <div class="setting-card">

            <div class="setting-title">
                Аккаунт
            </div>

            <div id="accountEmail"></div>

        </div>

        <div class="setting-card">

            <div class="setting-title">
                Твой @username
            </div>

            <input
                id="usernameInput"
                maxlength="21"
                placeholder="@username"
                autocomplete="off"
            >

            <div class="setting-hint">
                3–20 символов после @: a-z, 0-9 и _
            </div>

        </div>

        <div class="setting-card">

            <div class="setting-title">
                Никнейм
            </div>

            <input
                id="nicknameInput"
                maxlength="40"
                placeholder="Твой никнейм"
            >

        </div>

        <div class="setting-card">

            <div class="setting-title">
                Описание
            </div>

            <textarea
                id="descriptionInput"
                rows="3"
                maxlength="160"
                placeholder="Расскажи немного о себе..."
            ></textarea>

        </div>

        <button
            id="saveProfile"
            class="save-btn"
        >
            💾 Сохранить
        </button>

        <div
            id="profileMessage"
            class="error"
        ></div>

        <button
            id="logoutButton"
            class="logout"
        >
            🚪 Выйти
        </button>

    </section>


    <!-- NAV -->

    <nav class="bottom-nav">

        <button
            id="navChats"
            class="nav-btn active"
        >
            💬<br>Чаты
        </button>

        <button
            id="navUsers"
            class="nav-btn"
        >
            👥<br>Пользователи
        </button>

        <button
            id="navSettings"
            class="nav-btn"
        >
            ⚙️<br>Настройки
        </button>

    </nav>

</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    set,
    get,
    push,
    onValue,
    update,
    remove,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =========================================
   ВОТ ТВОЙ API KEY
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDUu20AAahXFB57envRSAFIDqA9H6YKIM",

    authDomain:
        "meowl-messenger.firebaseapp.com",

    databaseURL:
        "https://meowl-messenger-default-rtdb.firebaseio.com",

    projectId:
        "meowl-messenger",

    storageBucket:
        "meowl-messenger.firebasestorage.app",

    messagingSenderId:
        "228165699456",

    appId:
        "1:228165699456:web:a33dfc849a553c01a36365",

    measurementId:
        "G-WBJM9L18VH"
};


/* =========================================
   INIT
========================================= */

const firebaseApp =
    initializeApp(firebaseConfig);

const auth =
    getAuth(firebaseApp);

const db =
    getDatabase(firebaseApp);


/* =========================================
   STATE
========================================= */

let currentUser = null;
let currentProfile = null;

let users = {};
let chats = {};

let currentChatId = null;

let stopUsers = null;
let stopChats = null;
let stopMessages = null;

let registerMode = false;


/* =========================================
   ELEMENTS
========================================= */

const authScreen =
    document.getElementById("authScreen");

const app =
    document.getElementById("app");

const authForm =
    document.getElementById("authForm");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const authButton =
    document.getElementById("authButton");

const authError =
    document.getElementById("authError");

const loginTab =
    document.getElementById("loginTab");

const registerTab =
    document.getElementById("registerTab");

const chatsScreen =
    document.getElementById("chatsScreen");

const usersScreen =
    document.getElementById("usersScreen");

const chatScreen =
    document.getElementById("chatScreen");

const settingsScreen =
    document.getElementById("settingsScreen");

const usersList =
    document.getElementById("usersList");

const chatsList =
    document.getElementById("chatsList");

const userSearch =
    document.getElementById("userSearch");

const chatSearch =
    document.getElementById("chatSearch");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const chatTitle =
    document.getElementById("chatTitle");

const chatHandle =
    document.getElementById("chatHandle");

const usernameInput =
    document.getElementById("usernameInput");

const nicknameInput =
    document.getElementById("nicknameInput");

const descriptionInput =
    document.getElementById("descriptionInput");

const accountEmail =
    document.getElementById("accountEmail");

const profileMessage =
    document.getElementById("profileMessage");


/* =========================================
   AUTH MODE
========================================= */

loginTab.onclick = () => {

    registerMode = false;

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    authButton.textContent = "Войти";

    authError.textContent = "";

};


registerTab.onclick = () => {

    registerMode = true;

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    authButton.textContent =
        "Создать аккаунт";

    authError.textContent = "";

};


/* =========================================
   LOGIN / REGISTER
========================================= */

authForm.onsubmit = async event => {

    event.preventDefault();

    authError.textContent = "";

    const mail =
        email.value.trim();

    const pass =
        password.value;

    try {

        if(registerMode){

            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    mail,
                    pass
                );

            await createProfile(
                result.user
            );

        }else{

            await signInWithEmailAndPassword(
                auth,
                mail,
                pass
            );

        }

    }catch(error){

        console.error(error);

        authError.textContent =
            firebaseError(error.code);

    }

};


/* =========================================
   CREATE PROFILE
========================================= */

async function createProfile(user){

    let username =
        "@user_" +
        user.uid
            .substring(0,8)
            .toLowerCase();

    let i = 1;

    while(true){

        const usernameRef =
            ref(
                db,
                "usernameIndex/" +
                username
            );

        const result =
            await runTransaction(
                usernameRef,
                value => {

                    if(value === null){

                        return user.uid;

                    }

                    return;

                }
            );

        if(result.committed){
            break;
        }

        username =
            "@user_" +
            user.uid.substring(0,8) +
            "_" +
            i++;

    }

    const nickname =
        user.email
            ? user.email.split("@")[0]
            : "Пользователь";

    await set(
        ref(
            db,
            "users/" +
            user.uid
        ),
        {

            username,
            usernameLower:
                username.toLowerCase(),

            nickname,
            nicknameLower:
                nickname.toLowerCase(),

            description:"",

            createdAt:
                serverTimestamp()

        }
    );

}


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            currentUser = null;

            authScreen.classList.remove(
                "hidden"
            );

            app.classList.add(
                "hidden"
            );

            stopAll();

            return;
        }

        currentUser = user;

        authScreen.classList.add(
            "hidden"
        );

        app.classList.remove(
            "hidden"
        );

        try{

            await loadProfile();

            listenUsers();

            listenChats();

            showScreen("chats");

        }catch(error){

            console.error(error);

        }

    }
);


/* =========================================
   PROFILE
========================================= */

async function loadProfile(){

    const snapshot =
        await get(
            ref(
                db,
                "users/" +
                currentUser.uid
            )
        );

    if(!snapshot.exists()){

        await createProfile(
            currentUser
        );

        return loadProfile();

    }

    currentProfile =
        snapshot.val();

    usernameInput.value =
        currentProfile.username || "";

    nicknameInput.value =
        currentProfile.nickname || "";

    descriptionInput.value =
        currentProfile.description || "";

    accountEmail.textContent =
        currentUser.email || "";

}


/* =========================================
   SAVE PROFILE
========================================= */

document.getElementById(
    "saveProfile"
).onclick = async () => {

    let username =
        usernameInput.value
            .trim()
            .toLowerCase();

    if(!username.startsWith("@")){
        username = "@" + username;
    }

    if(!/^@[a-z0-9_]{3,20}$/.test(username)){

        profileMessage.textContent =
            "❌ Неверный @username";

        return;
    }

    const old =
        String(
            currentProfile.username || ""
        ).toLowerCase();

    try{

        if(username !== old){

            const newRef =
                ref(
                    db,
                    "usernameIndex/" +
                    username
                );

            const result =
                await runTransaction(
                    newRef,
                    value => {

                        if(value === null){
                            return currentUser.uid;
                        }

                        if(
                            value ===
                            currentUser.uid
                        ){
                            return value;
                        }

                        return;

                    }
                );

            if(!result.committed){

                profileMessage.textContent =
                    "❌ Такой @username уже занят";

                return;
            }

            try{

                await update(
                    ref(
                        db,
                        "users/" +
                        currentUser.uid
                    ),
                    {

                        username,
                        usernameLower:
                            username,

                        nickname:
                            nicknameInput.value.trim(),

                        nicknameLower:
                            nicknameInput.value
                                .trim()
                                .toLowerCase(),

                        description:
                            descriptionInput.value.trim()

                    }
                );

            }catch(error){

                await remove(newRef);

                throw error;

            }

            if(old){

                await remove(
                    ref(
                        db,
                        "usernameIndex/" +
                        old
                    )
                );

            }

        }else{

            await update(
                ref(
                    db,
                    "users/" +
                    currentUser.uid
                ),
                {

                    nickname:
                        nicknameInput.value.trim(),

                    nicknameLower:
                        nicknameInput.value
                            .trim()
                            .toLowerCase(),

                    description:
                        descriptionInput.value.trim()

                }
            );

        }

        await loadProfile();

        profileMessage.style.color =
            "#65ffad";

        profileMessage.textContent =
            "✅ Сохранено";

        setTimeout(
            () => {
                profileMessage.textContent = "";
            },
            2000
        );

    }catch(error){

        console.error(error);

        profileMessage.style.color =
            "#ff6687";

        profileMessage.textContent =
            "❌ Не удалось сохранить";

    }

};


/* =========================================
   USERS
========================================= */

function listenUsers(){

    if(stopUsers){
        stopUsers();
    }

    stopUsers =
        onValue(
            ref(db,"users"),
            snapshot => {

                users =
                    snapshot.val() || {};

                renderUsers();

                renderChats();

            }
        );

}


function renderUsers(){

    usersList.innerHTML = "";

    const query =
        userSearch.value
            .trim()
            .toLowerCase();

    const list =
        Object.entries(users)
            .filter(
                ([uid,user]) => {

                    if(
                        uid ===
                        currentUser.uid
                    ){
                        return false;
                    }

                    const name =
                        (
                            user.usernameLower ||
                            ""
                        ).toLowerCase();

                    return !query ||
                        name.includes(query);

                }
            )
            .sort(
                ([,a],[,b]) =>
                    (
                        a.usernameLower || ""
                    ).localeCompare(
                        b.usernameLower || ""
                    )
            );

    if(!list.length){

        usersList.innerHTML =
            `<div class="empty">
                Пользователи не найдены
            </div>`;

        return;
    }

    list.forEach(
        ([uid,user]) => {

            const div =
                document.createElement("div");

            div.className =
                "user-card";

            div.innerHTML = `

                <div class="user-name">
                    ${escapeHtml(
                        user.nickname ||
                        "Пользователь"
                    )}
                </div>

                <div class="user-handle">
                    ${escapeHtml(
                        user.username || ""
                    )}
                </div>

                ${
                    user.description
                    ?
                    `<div class="user-description">
                        ${escapeHtml(
                            user.description
                        )}
                    </div>`
                    :
                    ""
                }

            `;

            div.onclick =
                () => openChat(uid);

            usersList.appendChild(div);

        }
    );

}

userSearch.oninput =
    renderUsers;


/* =========================================
   CHATS
========================================= */

function listenChats(){

    if(stopChats){
        stopChats();
    }

    stopChats =
        onValue(
            ref(db,"chats"),
            snapshot => {

                chats =
                    snapshot.val() || {};

                renderChats();

            }
        );

}


function renderChats(){

    chatsList.innerHTML = "";

    const query =
        chatSearch.value
            .trim()
            .toLowerCase();

    const list = [];

    Object.entries(chats)
        .forEach(
            ([chatId,chat]) => {

                if(
                    !chat.participants ||
                    !chat.participants[
                        currentUser.uid
                    ]
                ){
                    return;
                }

                const ids =
                    Object.keys(
                        chat.participants
                    );

                const otherId =
                    ids.find(
                        id =>
                            id !==
                            currentUser.uid
                    );

                if(!otherId){
                    return;
                }

                const user =
                    users[otherId];

                if(!user){
                    return;
                }

                const username =
                    (
                        user.usernameLower ||
                        ""
                    ).toLowerCase();

                if(
                    query &&
                    !username.includes(query)
                ){
                    return;
                }

                list.push({
                    chatId,
                    otherId,
                    user
                });

            }
        );

    if(!list.length){

        chatsList.innerHTML =
            `<div class="empty">
                Пока нет чатов.<br>
                Открой «Пользователи».
            </div>`;

        return;
    }

    list.forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "chat-card";

        div.innerHTML = `

            <div class="user-name">
                ${escapeHtml(
                    item.user.nickname ||
                    "Пользователь"
                )}
            </div>

            <div class="user-handle">
                ${escapeHtml(
                    item.user.username || ""
                )}
            </div>

        `;

        div.onclick =
            () => openChat(
                item.otherId
            );

        chatsList.appendChild(div);

    });

}

chatSearch.oninput =
    renderChats;


/* =========================================
   OPEN CHAT
========================================= */

async function openChat(otherUid){

    const other =
        users[otherUid];

    if(!other){
        return;
    }

    currentChatId =
        [currentUser.uid,otherUid]
            .sort()
            .join("_");

    chatTitle.textContent =
        other.nickname ||
        "Пользователь";

    chatHandle.textContent =
        other.username || "";

    showScreen("chat");

    const chatRef =
        ref(
            db,
            "chats/" +
            currentChatId
        );

    const snapshot =
        await get(chatRef);

    if(!snapshot.exists()){

        await set(
            chatRef,
            {

                participants:{
                    [currentUser.uid]:true,
                    [otherUid]:true
                },

                createdAt:
                    serverTimestamp()

            }
        );

    }

    listenMessages();

}


/* =========================================
   MESSAGES
========================================= */

function listenMessages(){

    if(stopMessages){
        stopMessages();
    }

    stopMessages =
        onValue(
            ref(
                db,
                "chats/" +
                currentChatId +
                "/messages"
            ),
            snapshot => {

                messages.innerHTML = "";

                const data =
                    snapshot.val() || {};

                Object.values(data)
                    .sort(
                        (a,b) =>
                            Number(
                                a.createdAt || 0
                            ) -
                            Number(
                                b.createdAt || 0
                            )
                    )
                    .forEach(
                        message => {

                            const div =
                                document.createElement(
                                    "div"
                                );

                            div.className =
                                "message " +
                                (
                                    message.senderId ===
                                    currentUser.uid
                                    ?
                                    "mine"
                                    :
                                    "other"
                                );

                            div.textContent =
                                message.text || "";

                            messages.appendChild(
                                div
                            );

                        }
                    );

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

}


/* =========================================
   SEND
========================================= */

document.getElementById(
    "messageForm"
).onsubmit = async event => {

    event.preventDefault();

    const text =
        messageInput.value.trim();

    if(!text || !currentChatId){
        return;
    }

    const messageRef =
        push(
            ref(
                db,
                "chats/" +
                currentChatId +
                "/messages"
            )
        );

    await set(
        messageRef,
        {

            text,

            senderId:
                currentUser.uid,

            createdAt:
                serverTimestamp()

        }
    );

    messageInput.value = "";

    messageInput.focus();

};


/* =========================================
   NAV
========================================= */

document.getElementById(
    "navChats"
).onclick = () =>
    showScreen("chats");


document.getElementById(
    "navUsers"
).onclick = () =>
    showScreen("users");


document.getElementById(
    "navSettings"
).onclick = async () => {

    await loadProfile();

    showScreen("settings");

};


/* =========================================
   SCREENS
========================================= */

function showScreen(name){

    chatsScreen.classList.add("hidden");
    usersScreen.classList.add("hidden");
    chatScreen.classList.add("hidden");
    settingsScreen.classList.add("hidden");

    document
        .getElementById("navChats")
        .classList.remove("active");

    document
        .getElementById("navUsers")
        .classList.remove("active");

    document
        .getElementById("navSettings")
        .classList.remove("active");


    if(name === "chats"){

        chatsScreen.classList.remove("hidden");

        document
            .getElementById("navChats")
            .classList.add("active");

    }


    if(name === "users"){

        usersScreen.classList.remove("hidden");

        document
            .getElementById("navUsers")
            .classList.add("active");

        renderUsers();

    }


    if(name === "settings"){

        settingsScreen.classList.remove("hidden");

        document
            .getElementById("navSettings")
            .classList.add("active");

    }


    if(name === "chat"){

        chatScreen.classList.remove("hidden");

    }

}


/* =========================================
   BACK
========================================= */

document.getElementById(
    "backChat"
).onclick = () => {

    if(stopMessages){

        stopMessages();

        stopMessages = null;

    }

    currentChatId = null;

    showScreen("chats");

};


/* =========================================
   LOGOUT
========================================= */

document.getElementById(
    "logoutButton"
).onclick = async () => {

    await signOut(auth);

};


/* =========================================
   STOP
========================================= */

function stopAll(){

    if(stopUsers){
        stopUsers();
        stopUsers = null;
    }

    if(stopChats){
        stopChats();
        stopChats = null;
    }

    if(stopMessages){
        stopMessages();
        stopMessages = null;
    }

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   ERRORS
========================================= */

function firebaseError(code){

    const errors = {

        "auth/email-already-in-use":
            "Этот Email уже зарегистрирован.",

        "auth/invalid-email":
            "Неверный Email.",

        "auth/weak-password":
            "Пароль должен быть минимум 6 символов.",

        "auth/invalid-credential":
            "Неверный Email или пароль.",

        "auth/user-not-found":
            "Пользователь не найден.",

        "auth/wrong-password":
            "Неверный пароль.",

        "auth/too-many-requests":
            "Слишком много попыток. Попробуй позже.",

        "auth/api-key-not-valid":
            "Firebase отклонил API key.",

        "PERMISSION_DENIED":
            "Firebase Database Rules запрещают действие."

    };

    return errors[code] ||
        "Ошибка: " + code;

}
