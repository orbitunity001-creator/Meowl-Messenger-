<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meowl Messenger</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080b16;
  --card:rgba(20,25,45,.72);
  --border:rgba(255,255,255,.1);
  --text:#fff;
  --muted:#9ca3b8;
  --purple:#9b5cff;
  --cyan:#35e8ff;
  --danger:#ff5577;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 15%,rgba(155,92,255,.24),transparent 35%),
    radial-gradient(circle at 85% 20%,rgba(53,232,255,.16),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(155,92,255,.12),transparent 40%),
    var(--bg);
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.glass{
  background:var(--card);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:22px;
  box-shadow:
    0 0 40px rgba(155,92,255,.07),
    inset 0 0 30px rgba(255,255,255,.02);
}

/* ================= AUTH ================= */

#authScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-card{
  width:100%;
  max-width:430px;
  padding:30px;
}

.logo{
  text-align:center;
  font-size:33px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:var(--cyan);
  text-shadow:0 0 20px rgba(53,232,255,.45);
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  padding:12px;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(255,255,255,.04);
  color:var(--muted);
}

.tab.active{
  color:#fff;
  border-color:rgba(155,92,255,.6);
  background:rgba(155,92,255,.18);
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:14px;
}

input,
textarea{
  width:100%;
  color:#fff;
  background:rgba(255,255,255,.045);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px 15px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:rgba(53,232,255,.6);
  box-shadow:0 0 18px rgba(53,232,255,.08);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:15px;
  color:#fff;
  font-weight:700;
  background:linear-gradient(135deg,var(--purple),#6240ff);
  box-shadow:0 0 25px rgba(155,92,255,.2);
}

.primary:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  min-height:20px;
  color:#ff7c99;
  text-align:center;
  margin-top:12px;
  font-size:14px;
}

/* ================= APP ================= */

#appScreen{
  min-height:100vh;
  padding-bottom:82px;
}

.topbar{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,11,22,.68);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.top-title{
  font-size:21px;
  font-weight:800;
}

.status{
  color:#66ffbb;
  font-size:12px;
}

.content{
  width:100%;
  max-width:850px;
  margin:auto;
  padding:20px;
}

.page-title{
  font-size:28px;
  font-weight:800;
  margin-bottom:18px;
}

/* ================= USERS ================= */

.search{
  margin-bottom:15px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.user-card,
.chat-card{
  display:flex;
  align-items:center;
  gap:14px;
  padding:15px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.035);
  border-radius:18px;
  transition:.2s;
}

.user-card{
  cursor:pointer;
}

.user-card:hover,
.chat-card:hover{
  border-color:rgba(53,232,255,.35);
  transform:translateY(-1px);
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#fff;
  font-size:20px;
  font-weight:800;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  box-shadow:0 0 20px rgba(155,92,255,.18);
}

.user-info{
  min-width:0;
}

.user-name{
  font-weight:700;
  margin-bottom:4px;
}

.username{
  color:var(--cyan);
  font-size:13px;
}

.description{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
}

/* ================= CHAT ================= */

.chat-page{
  height:calc(100vh - 155px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.back-button{
  margin-bottom:10px;
  padding:9px 13px;
  border:1px solid var(--border);
  border-radius:12px;
  color:#fff;
  background:rgba(255,255,255,.05);
}

.chat-header{
  padding:15px;
  border-bottom:1px solid var(--border);
  font-weight:700;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:17px;
  word-break:break-word;
  white-space:pre-wrap;
}

.message.mine{
  align-self:flex-end;
  background:linear-gradient(135deg,#7140df,#8d55ff);
  border-bottom-right-radius:5px;
}

.message.other{
  align-self:flex-start;
  background:rgba(255,255,255,.08);
  border-bottom-left-radius:5px;
}

.message-time{
  margin-top:4px;
  font-size:10px;
  opacity:.6;
  text-align:right;
}

.send-box{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--border);
}

.send-box input{
  flex:1;
}

.send-button{
  width:52px;
  min-width:52px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  font-size:20px;
}

/* ================= SETTINGS ================= */

.settings-card{
  padding:20px;
}

.settings-card h3{
  margin-bottom:18px;
}

.danger-button{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:1px solid rgba(255,85,119,.35);
  border-radius:14px;
  color:#ff8aa2;
  background:rgba(255,85,119,.08);
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:74px;
  display:flex;
  justify-content:center;
  gap:8px;
  padding:9px;
  z-index:100;
  background:rgba(8,11,22,.84);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
}

.nav-button{
  width:min(30%,180px);
  border:1px solid transparent;
  border-radius:15px;
  color:var(--muted);
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.nav-button.active{
  color:#fff;
  background:rgba(155,92,255,.15);
  border-color:rgba(155,92,255,.3);
}

.nav-icon{
  font-size:19px;
}

.nav-text{
  font-size:11px;
}

@media(max-width:600px){

  .content{
    padding:15px;
  }

  .auth-card{
    padding:22px;
  }

  .page-title{
    font-size:24px;
  }

  .message{
    max-width:88%;
  }
}
</style>
</head>

<body>

     AUTH

<script type="module">

/* =====================================================
   FIREBASE SDK
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  get,
  update,
  remove,
  push,
  onValue,
  serverTimestamp,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =====================================================
   🔥 ТВОЙ FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDUu20AAahXFB57envRSAFIDqA9H6YKIM",

  authDomain:
    "meowl-messenger.firebaseapp.com",

  databaseURL:
    "https://meowl-messenger-default-rtdb.firebaseio.com",

  projectId:
    "meowl-messenger",

  storageBucket:
    "meowl-messenger.firebasestorage.app",

  messagingSenderId:
    "228165699456",

  appId:
    "1:228165699456:web:a33dfc849a553c01a36365",

  measurementId:
    "G-WBJM9L18VH"
};


/* =====================================================
   FIREBASE INIT
===================================================== */

const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getDatabase(firebaseApp);


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let currentProfile = null;

let usersCache = {};
let chatsCache = {};

let currentChatId = null;
let currentChatUser = null;

let stopUsersListener = null;
let stopChatsListener = null;
let stopMessagesListener = null;

let authMode = "login";


/* =====================================================
   ELEMENTS
===================================================== */

const authScreen =
  document.getElementById("authScreen");

const appScreen =
  document.getElementById("appScreen");

const authForm =
  document.getElementById("authForm");

const emailInput =
  document.getElementById("emailInput");

const passwordInput =
  document.getElementById("passwordInput");

const registerNameInput =
  document.getElementById("registerNameInput");

const registerNameField =
  document.getElementById("registerNameField");

const loginTab =
  document.getElementById("loginTab");

const registerTab =
  document.getElementById("registerTab");

const authButton =
  document.getElementById("authButton");

const authError =
  document.getElementById("authError");


/* =====================================================
   AUTH TABS
===================================================== */

loginTab.addEventListener(
  "click",
  () => {

    authMode = "login";

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    registerNameField.classList.add("hidden");

    authButton.textContent = "Войти";

    authError.textContent = "";
  }
);


registerTab.addEventListener(
  "click",
  () => {

    authMode = "register";

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    registerNameField.classList.remove("hidden");

    authButton.textContent =
      "Создать аккаунт";

    authError.textContent = "";
  }
);


/* =====================================================
   USERNAME
===================================================== */

function normalizeUsername(value){

  let username =
    String(value || "")
      .trim()
      .toLowerCase();

  if(!username.startsWith("@")){
    username = "@" + username;
  }

  return username;
}


function validUsername(username){

  return /^@[a-z0-9_]{3,20}$/
    .test(username);
}


/*
  Важно:
  @username является ключом Firebase.
*/

function usernameKey(username){

  return normalizeUsername(username);
}


/* =====================================================
   UNIQUE USERNAME
===================================================== */

async function claimUsername(
  username,
  uid
){

  const normalized =
    normalizeUsername(username);


  if(!validUsername(normalized)){

    throw new Error(
      "Username должен содержать 3–20 символов: a-z, 0-9 и _."
    );
  }


  const usernameRef =
    ref(
      db,
      "usernameIndex/" +
      usernameKey(normalized)
    );


  /*
    Transaction защищает от ситуации,
    когда два человека одновременно
    пытаются занять один username.
  */

  const result =
    await runTransaction(
      usernameRef,
      current => {

        if(current === null){
          return uid;
        }

        if(current === uid){
          return current;
        }

        return;
      }
    );


  if(!result.committed){

    throw new Error(
      "Этот username уже занят."
    );
  }


  return normalized;
}


/* =====================================================
   GENERATE USERNAME
===================================================== */

function generateUsername(uid){

  const clean =
    uid
      .replace(/[^a-zA-Z0-9]/g,"")
      .slice(-8)
      .toLowerCase();


  return "@meow" + clean;
}


/* =====================================================
   CREATE PROFILE
===================================================== */

async function createProfile(
  firebaseUser,
  name
){

  /*
    🔐 НАСТОЯЩИЙ UID FIREBASE AUTH
  */

  const uid =
    firebaseUser.uid;


  let username =
    generateUsername(uid);


  /*
    Резервируем username.
  */

  let claimed = false;


  for(let i = 0; i < 20; i++){

    const candidate =
      i === 0
        ? username
        : "@meow" +
          uid.slice(-6).toLowerCase() +
          i;


    try{

      username =
        await claimUsername(
          candidate,
          uid
        );

      claimed = true;
      break;

    }catch(error){

      if(i === 19){
        throw error;
      }
    }
  }


  if(!claimed){

    throw new Error(
      "Не удалось создать username."
    );
  }


  /*
    Профиль хранится ПО UID Firebase.
  */

  const profile = {

    uid: uid,

    username: username,

    usernameLower: username,

    nickname:
      String(
        name || "Пользователь"
      )
      .trim()
      .slice(0,40),

    nicknameLower:
      String(
        name || "Пользователь"
      )
      .trim()
      .toLowerCase()
      .slice(0,40),

    description: "",

    email:
      firebaseUser.email || "",

    createdAt:
      serverTimestamp()
  };


  try{

    await set(
      ref(
        db,
        "users/" + uid
      ),
      profile
    );

  }catch(error){

    /*
      Если запись профиля не прошла,
      освобождаем username.
    */

    try{

      await remove(
        ref(
          db,
          "usernameIndex/" +
          usernameKey(username)
        )
      );

    }catch(_){}

    throw error;
  }


  return profile;
}


/* =====================================================
   LOAD CURRENT PROFILE
===================================================== */

async function loadCurrentProfile(){

  if(!currentUser){
    return;
  }


  /*
    Никогда не используем email
    или username как ID.

    Только Firebase Auth UID.
  */

  const uid =
    currentUser.uid;


  const snapshot =
    await get(
      ref(
        db,
        "users/" + uid
      )
    );


  if(snapshot.exists()){

    currentProfile =
      snapshot.val();

    return;
  }


  /*
    Если пользователь авторизован,
    но профиля нет — создаём его.
  */

  currentProfile =
    await createProfile(
      currentUser,
      currentUser.email
        ? currentUser.email.split("@")[0]
        : "Пользователь"
    );
}


/* =====================================================
   LOGIN / REGISTER
===================================================== */

authForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    authError.textContent = "";

    authButton.disabled = true;


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    try{

      if(authMode === "login"){

        /*
          Firebase сам проверяет
          email + пароль и выдаёт
          авторизационный токен.
        */

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      }else{

        if(password.length < 6){

          throw new Error(
            "Пароль должен быть минимум 6 символов."
          );
        }


        /*
          Создание аккаунта Firebase Auth.
        */

        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        /*
          credential.user.uid —
          настоящий UID пользователя.
        */

        await createProfile(
          credential.user,
          registerNameInput.value
        );
      }


    }catch(error){

      console.error(error);

      authError.textContent =
        firebaseError(error);

    }finally{

      authButton.disabled = false;
    }
  }
);


/* =====================================================
   FIREBASE ERRORS
===================================================== */

function firebaseError(error){

  switch(error.code){

    case "auth/email-already-in-use":
      return "Этот email уже зарегистрирован.";

    case "auth/invalid-email":
      return "Неверный email.";

    case "auth/invalid-credential":
      return "Неверный email или пароль.";

    case "auth/weak-password":
      return "Пароль слишком слабый.";

    case "auth/network-request-failed":
      return "Ошибка сети.";

    case "PERMISSION_DENIED":
      return "Firebase Rules запретили действие.";

    default:
      return error.message ||
        "Произошла ошибка.";
  }
}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;


    if(!user){

      authScreen.classList.remove("hidden");
      appScreen.classList.add("hidden");

      cleanup();

      return;
    }


    /*
      🔐 Firebase уже подтвердил авторизацию.

      user.uid = настоящий ID пользователя.
    */

    console.log(
      "Firebase UID:",
      user.uid
    );


    try{

      await loadCurrentProfile();


      authScreen.classList.add("hidden");
      appScreen.classList.remove("hidden");


      fillSettings();

      startUsersListener();

      startChatsListener();

      showPage("chats");


    }catch(error){

      console.error(error);

      alert(
        "Ошибка загрузки профиля:\n" +
        error.message
      );
    }
  }
);

   USERS LISTENER

function startUsersListener(){

/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(){

  const list =
    document.getElementById(
      "userList"
    );


  const search =
    document.getElementById(
      "userSearch"
    )
    .value
    .trim()
    .toLowerCase();


  list.innerHTML = "";


  const normalizedSearch =
    search
      ? (
          search.startsWith("@")
            ? search
            : "@" + search
        )
      : "";


  const result =
    Object.entries(usersCache)
      .filter(([uid,user]) => {

        if(!user){
          return false;
        }


        /*
          Себя не показываем.
        */

        if(
          currentUser &&
          uid === currentUser.uid
        ){
          return false;
        }


        const username =
          String(
            user.username || ""
          ).toLowerCase();


        if(!normalizedSearch){
          return true;
        }


        return username.includes(
          normalizedSearch
        );
      });


  if(!result.length){

    list.innerHTML =
      `<div class="empty">
        Пользователи не найдены
      </div>`;

    return;
  }


  result
    .sort(
      (a,b) =>
        String(
          a[1].username || ""
        ).localeCompare(
          String(
            b[1].username || ""
          )
        )
    )
    .forEach(
      ([uid,user]) => {

        const card =
          document.createElement("div");

        card.className =
          "user-card";


        const name =
          user.nickname ||
          "Пользователь";


        const username =
          user.username ||
          "@unknown";


        const description =
          user.description || "";


        card.innerHTML = `

          <div class="avatar">
            ${escapeHtml(
              name
                .charAt(0)
                .toUpperCase()
            )}
          </div>

          <div class="user-info">

            <div class="user-name">
              ${escapeHtml(name)}
            </div>

            <div class="username">
              ${escapeHtml(username)}
            </div>

            ${
              description
                ? `
                  <div class="description">
                    ${escapeHtml(description)}
                  </div>
                `
                : ""
            }

          </div>
        `;


        card.addEventListener(
          "click",
          () =>
            openPrivateChat(
              uid,
              user
            )
        );


        list.appendChild(card);
      }
    );
}

/* =====================================================
   CHAT ID
===================================================== */

function makeChatId(
  uid1,
  uid2
){

  return [
    uid1,
    uid2
  ]
  .sort()
  .join("_");
}


/* =====================================================
   OPEN PRIVATE CHAT
===================================================== */

async function openPrivateChat(
  otherUid,
  otherUser
){

  if(!currentUser){
    return;
  }


  if(
    otherUid === currentUser.uid
  ){
    return;
  }


  const id =
    makeChatId(
      currentUser.uid,
      otherUid
    );


  currentChatId = id;
  currentChatUser = otherUser;


  const chatRef =
    ref(
      db,
      "chats/" + id
    );


  const snapshot =
    await get(chatRef);


  if(!snapshot.exists()){

    /*
      Приватный чат 1 на 1.

      Оба участника определяются
      реальными Firebase UID.
    */

    await set(
      chatRef,
      {

        participants: {

          [currentUser.uid]: true,

          [otherUid]: true

        },

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()
      }
    );
  }


  document.getElementById(
    "chatHeader"
  ).textContent =
    otherUser.nickname ||
    otherUser.username ||
    "Пользователь";


  showPage("chat");

  startMessagesListener(id);
}


/* =====================================================
   MESSAGES
===================================================== */

function startMessagesListener(chatId){

  if(stopMessagesListener){
    stopMessagesListener();
  }


  stopMessagesListener =
    onValue(
      ref(
        db,
        "chats/" +
        chatId +
        "/messages"
      ),
      snapshot => {

        const box =
          document.getElementById(
            "messages"
          );


        box.innerHTML = "";


        const data =
          snapshot.val();


        if(!data){

          box.innerHTML =
            `<div class="empty">
              Пока нет сообщений
            </div>`;

          return;
        }


        Object.entries(data)
          .sort(
            (a,b) =>
              Number(
                a[1].createdAt || 0
              ) -
              Number(
                b[1].createdAt || 0
              )
          )
          .forEach(
            ([id,message]) => {

              const element =
                document.createElement(
                  "div"
                );


              const mine =
                message.senderId ===
                currentUser.uid;


              element.className =
                "message " +
                (
                  mine
                    ? "mine"
                    : "other"
                );


              const text =
                document.createElement(
                  "div"
                );

              text.textContent =
                message.text || "";


              const time =
                document.createElement(
                  "div"
                );

              time.className =
                "message-time";


              if(message.createdAt){

                time.textContent =
                  new Date(
                    message.createdAt
                  )
                  .toLocaleTimeString(
                    "ru-RU",
                    {
                      hour:"2-digit",
                      minute:"2-digit"
                    }
                  );
              }


              element.appendChild(text);
              element.appendChild(time);

              box.appendChild(element);
            }
          );


        box.scrollTop =
          box.scrollHeight;
      },
      error => {

        console.error(
          "Messages:",
          error
        );
      }
    );
}


/* =====================================================
   SEND MESSAGE
===================================================== */

document
  .getElementById("sendForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const input =
        document.getElementById(
          "messageInput"
        );


      const text =
        input.value.trim();


      if(
        !text ||
        !currentUser ||
        !currentChatId
      ){
        return;
      }


      if(text.length > 2000){
        return;
      }


      input.disabled = true;


      try{

        const messageRef =
          push(
            ref(
              db,
              "chats/" +
              currentChatId +
              "/messages"
            )
          );


        await set(
          messageRef,
          {

            text: text,

            /*
              Только настоящий Firebase UID.
            */

            senderId:
              currentUser.uid,

            createdAt:
              serverTimestamp()
          }
        );


        /*
          Обновляем только updatedAt.
        */

        await set(
          ref(
            db,
            "chats/" +
            currentChatId +
            "/updatedAt"
          ),
          serverTimestamp()
        );


        input.value = "";

      }catch(error){

        console.error(error);

        alert(
          "Не удалось отправить сообщение:\n" +
          error.message
        );

      }finally{

        input.disabled = false;

        input.focus();
      }
    }
  );


/* =====================================================
   CHATS LISTENER
===================================================== */

function startChatsListener(){

  if(stopChatsListener){
    stopChatsListener();
  }


  stopChatsListener =
    onValue(
      ref(db,"chats"),
      snapshot => {

        chatsCache =
          snapshot.val() || {};

        renderChats();
      },
      error => {

        console.error(
          "Chats:",
          error
        );
      }
    );
}


/* =====================================================
   RENDER CHATS
===================================================== */

function renderChats(){

  const list =
    document.getElementById(
      "chatList"
    );


  list.innerHTML = "";


  if(!currentUser){
    return;
  }


  const myChats =
    Object.entries(chatsCache)
      .filter(
        ([id,chat]) =>
          chat &&
          chat.participants &&
          chat.participants[
            currentUser.uid
          ] === true
      );


  if(!myChats.length){

    list.innerHTML =
      `<div class="empty">
        Пока нет чатов.<br>
        Открой «Пользователи» и выбери человека.
      </div>`;

    return;
  }


  myChats
    .sort(
      (a,b) =>
        Number(
          b[1].updatedAt || 0
        ) -
        Number(
          a[1].updatedAt || 0
        )
    )
    .forEach(
      ([chatId,chat]) => {

        const otherUid =
          Object.keys(
            chat.participants || {}
          )
          .find(
            uid =>
              uid !== currentUser.uid
          );


        if(!otherUid){
          return;
        }


        const user =
          usersCache[otherUid];


        if(!user){
          return;
        }


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "chat-card";


        const name =
          user.nickname ||
          "Пользователь";


        const username =
          user.username ||
          "@unknown";


        card.innerHTML = `

          <div class="avatar">
            ${escapeHtml(
              name
                .charAt(0)
                .toUpperCase()
            )}
          </div>

          <div class="user-info">

            <div class="user-name">
              ${escapeHtml(name)}
            </div>

            <div class="username">
              ${escapeHtml(username)}
            </div>

          </div>
        `;


        card.addEventListener(
          "click",
          () =>
            openPrivateChat(
              otherUid,
              user
            )
        );


        list.appendChild(card);
      }
    );
}


/* =====================================================
   SETTINGS
===================================================== */

function fillSettings(){

  if(!currentProfile){
    return;
  }


  document.getElementById(
    "settingsUsername"
  ).value =
    currentProfile.username || "";


  document.getElementById(
    "settingsNickname"
  ).value =
    currentProfile.nickname || "";


  document.getElementById(
    "settingsDescription"
  ).value =
    currentProfile.description || "";
}


document
  .getElementById("saveProfileButton")
  .addEventListener(
    "click",
    saveProfile
  );


async function saveProfile(){

  if(!currentUser){
    return;
  }


  const errorElement =
    document.getElementById(
      "settingsError"
    );


  errorElement.textContent = "";
  errorElement.style.color = "";


  const newUsername =
    normalizeUsername(
      document.getElementById(
        "settingsUsername"
      ).value
    );


  const nickname =
    document.getElementById(
      "settingsNickname"
    ).value
    .trim()
    .slice(0,40);


  const description =
    document.getElementById(
      "settingsDescription"
    ).value
    .trim()
    .slice(0,160);


  if(!validUsername(newUsername)){

    errorElement.textContent =
      "Username: @ + 3–20 символов, только a-z, 0-9 и _.";

    return;
  }


  if(!nickname){

    errorElement.textContent =
      "Укажи имя.";

    return;
  }


  const oldUsername =
    currentProfile.username;


  const usernameChanged =
    newUsername !== oldUsername;


  try{

    /*
      Сначала резервируем новый username.
    */

    if(usernameChanged){

      await claimUsername(
        newUsername,
        currentUser.uid
      );
    }


    /*
      Обновляем профиль под
      настоящим Firebase UID.
    */

    await update(
      ref(
        db,
        "users/" +
        currentUser.uid
      ),
      {

        username:
          newUsername,

        usernameLower:
          newUsername,

        nickname:
          nickname,

        nicknameLower:
          nickname.toLowerCase(),

        description:
          description
      }
    );


    /*
      Старый username освобождаем
      после успешного обновления.
    */

    if(
      usernameChanged &&
      oldUsername
    ){

      await remove(
        ref(
          db,
          "usernameIndex/" +
          usernameKey(oldUsername)
        )
      );
    }


    currentProfile = {

      ...currentProfile,

      username:
        newUsername,

      usernameLower:
        newUsername,

      nickname:
        nickname,

      nicknameLower:
        nickname.toLowerCase(),

      description:
        description
    };


    fillSettings();

    renderUsers();

    errorElement.style.color =
      "#66ffbb";

    errorElement.textContent =
      "Профиль сохранён ✓";


    setTimeout(
      () => {

        errorElement.textContent = "";
        errorElement.style.color = "";

      },
      2500
    );


  }catch(error){

    console.error(error);

    errorElement.style.color =
      "#ff7c99";

    errorElement.textContent =
      error.message ||
      "Не удалось сохранить профиль.";
  }
}


/* =====================================================
   NAVIGATION
===================================================== */

const pages = {

  chats:
    document.getElementById(
      "chatsPage"
    ),

  users:
    document.getElementById(
      "usersPage"
    ),

  settings:
    document.getElementById(
      "settingsPage"
    ),

  chat:
    document.getElementById(
      "chatPage"
    )
};


const navs = {

  chats:
    document.getElementById(
      "navChats"
    ),

  users:
    document.getElementById(
      "navUsers"
    ),

  settings:
    document.getElementById(
      "navSettings"
    )
};


function showPage(page){

  Object.values(pages)
    .forEach(
      element =>
        element.classList.add(
          "hidden"
        )
    );


  Object.values(navs)
    .forEach(
      element =>
        element.classList.remove(
          "active"
        )
    );


  pages[page]
    .classList.remove(
      "hidden"
    );


  if(navs[page]){

    navs[page]
      .classList.add(
        "active"
      );
  }
}


navs.chats.onclick =
  () => {

    closeMessagesListener();

    showPage("chats");
  };


navs.users.onclick =
  () => {

    closeMessagesListener();

    showPage("users");
  };


navs.settings.onclick =

  };


document

/* =====================================================
   CLEANUP
===================================================== */

function cleanup(){

  if(stopUsersListener){

    stopUsersListener();
    stopUsersListener = null;
  }


  if(stopChatsListener){

    stopChatsListener();
    stopChatsListener = null;
  }


  if(stopMessagesListener){

    stopMessagesListener();
    stopMessagesListener = null;
  }


  usersCache = {};
  chatsCache = {};

  currentProfile = null;

  currentChatId = null;
  currentChatUser = null;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
